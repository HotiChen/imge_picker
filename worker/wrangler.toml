name = "imagepicker"
main = "worker.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "imagepicker"
bucket_name = "imagepicker"

[[d1_databases]]
binding = "DB"
database_name = "imagepicker-db"
database_id = "1176e663-7f85-498a-b16d-a22ec9aaeacc"

# 部署後在 Cloudflare Dashboard 設定 Secret：
# PHOTOGRAPHER_TOKEN = "你的秘密 token"
# 指令：wrangler secret put PHOTOGRAPHER_TOKEN

# 選片送出通知信（Cloudflare Email Service）。
# 前提：imhoti.tw 已開 Email Routing，且 PHOTOGRAPHER_EMAIL 已是驗證過的
# Destination address。寄給驗證過的地址免費、不需付費方案。
# binding 必須寫在這裡：CI 的 wrangler deploy 會清掉只在 Dashboard 加的 binding / vars。
[[send_email]]
name = "NOTIFY_EMAIL"
allowed_sender_addresses = ["notify@imhoti.tw"]

[vars]
NOTIFY_FROM = "notify@imhoti.tw"
# 攝影師自建商品（非平台商品）。只有 "on" 才開；其他值或沒設都算關。
# 目前只賣平台商品，保留功能供日後開放。
CUSTOM_PRODUCTS = "off"
# 客人自助訂購（docs/guest-shop.md S2）。"on" = 全開；"pilot" = 只開
# GUEST_ORDERS_PILOT 列的專案（逗號分隔的 project id）；其他值或沒設都算關
# （打錯字 = 關）。個資告知審過之前保持 "off"：客人只看到「我有興趣」。
GUEST_ORDERS = "off"
GUEST_ORDERS_PILOT = ""
# 舊的客戶帳號系統（POST /api/auth/register、/login，client-login.html）。只有 "on" 才開；
# 其他值或沒設都算關（410 client_accounts_closed）。關閉原因：登入沒有限流、密碼只做一輪 SHA-256、註冊沒有上限。
LEGACY_CLIENT_ACCOUNTS = "off"
# 攝影師自助註冊（docs/multi-photographer.md 第 1 批，POST /api/photographer/register）。
# 只有 "on" 且已設 Secret TURNSTILE_SECRET 才開；其他值、打錯字或沒有 secret 都算關（403 registration_closed）。
# 開之前要先跑 worker/migrations/2026-10-11-photographers.sql。第 5 批註冊頁上線前保持 "off"。
PHOTOGRAPHER_SIGNUP = "off"

# 收件人用 Secret（不進 repo，deploy 也不會被清掉）：
# wrangler secret put PHOTOGRAPHER_EMAIL

# Turnstile（攝影師註冊防機器人）的 secret key：
# wrangler secret put TURNSTILE_SECRET
