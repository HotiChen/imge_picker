name = "imagepicker"
main = "worker.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "imagepicker"
bucket_name = "imagepicker"

[[d1_databases]]
binding = "DB"
database_name = "imagepicker-db"
database_id = "1176e663-7f85-498a-b16d-a22ec9aaeacc"

# 部署後在 Cloudflare Dashboard 設定 Secret：
# PHOTOGRAPHER_TOKEN = "你的秘密 token"
# 指令：wrangler secret put PHOTOGRAPHER_TOKEN

# 選片送出通知信（Cloudflare Email Service）。
# 前提：imhoti.tw 已開 Email Routing，且 PHOTOGRAPHER_EMAIL 已是驗證過的
# Destination address。寄給驗證過的地址免費、不需付費方案。
# binding 必須寫在這裡：CI 的 wrangler deploy 會清掉只在 Dashboard 加的 binding / vars。
[[send_email]]
name = "NOTIFY_EMAIL"
allowed_sender_addresses = ["notify@imhoti.tw"]

[vars]
NOTIFY_FROM = "notify@imhoti.tw"
# 攝影師自建商品（非平台商品）。只有 "on" 才開；其他值或沒設都算關。
# 目前只賣平台商品，保留功能供日後開放。
CUSTOM_PRODUCTS = "off"

# 收件人用 Secret（不進 repo，deploy 也不會被清掉）：
# wrangler secret put PHOTOGRAPHER_EMAIL
