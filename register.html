<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>註冊攝影師帳號 — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="js/photographer-session.js?v=20261031c"></script>
<style>
  /* home.html's cream theme. Reached only by the URL a friend is given: no page links here. */
  :root {
    --bg: #fff8ee; --surface: #ffffff; --accent: #f5a13b; --accent-dim: #ffd9a8; --accent-shadow: #d6801f;
    --ink-90: #231b12; --ink-70: #5b4f42; --ink-55: #6b5f50; --rule: #efe6d8; --danger: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink-90); font-family: 'Noto Sans TC', 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 1.6; min-height: 100vh; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 48px; }
  .brand { color: var(--accent-shadow); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .15em; }
  h1 { font-family: 'Noto Serif TC', serif; font-size: 24px; font-weight: 600; margin: 4px 0 6px; }
  .lead { color: var(--ink-55); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--surface); border-radius: 18px; padding: 22px 18px; box-shadow: 0 2px 10px rgba(90,60,20,.06); }
  .field-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--ink-70); margin-bottom: 6px; }
  .field { background: var(--bg); border: 1px solid var(--rule); color: var(--ink-90); padding: 0 12px; height: 48px; border-radius: 10px; font-size: 16px; font-family: inherit; outline: none; width: 100%; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .code { letter-spacing: .3em; font-family: 'IBM Plex Mono', monospace; }
  .hint { font-size: 12px; color: var(--ink-55); margin-top: 5px; }
  .notice { background: #fff3df; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-70); margin: 4px 0 18px; }
  .btn { width: 100%; height: 48px; border: none; border-radius: 999px; background: var(--accent); color: var(--ink-90); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .err { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div class="brand">STUDIO</div>
  <h1>註冊攝影師帳號</h1>
  <p class="lead">請填入邀請你的人給你的邀請碼。邀請碼只能用在被邀請的那個 Email，1 小時內有效。</p>
  <form class="card" id="reg-form" method="post" action="register.html" novalidate autocomplete="on">
    <div class="field-group">
      <label for="reg-email">Email（要和邀請時填的相同）</label>
      <input id="reg-email" class="field" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email">
    </div>
    <div class="field-group">
      <label for="reg-name">顯示名稱</label>
      <input id="reg-name" class="field" type="text" autocomplete="name" maxlength="50">
      <div class="hint">最多 50 個字，客人會看到這個名稱。</div>
    </div>
    <div class="field-group">
      <label for="reg-password">密碼</label>
      <input id="reg-password" class="field" type="password" autocomplete="new-password" maxlength="200">
      <div class="hint">10–200 個字元。</div>
    </div>
    <div class="field-group">
      <label for="reg-code">邀請碼（8 位數字）</label>
      <input id="reg-code" class="field code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    </div>
    <div class="notice">照片不會因保存期限自動刪除；毛片是否刪除由攝影師設定</div>
    <button id="reg-submit" class="btn" type="submit">建立帳號</button>
    <div id="reg-err" class="err" role="alert"></div>
  </form>
</main>

<script src="js/password-toggle.js?v=20261031c"></script>
<script>
(function () {
  const S = window.PhotographerSession;
  const form = document.getElementById('reg-form');
  const $ = id => document.getElementById(id);
  const errEl = $('reg-err'), btn = $('reg-submit');

  // One sentence for every way a code can fail: nothing says which part was wrong.
  const INVALID_INVITE = '邀請碼不正確或已失效。請確認 Email 和邀請碼，或請對方重新產生一組。';
  const MESSAGES = {
    invalid_invite: INVALID_INVITE,
    registration_closed: '目前尚未開放註冊',
    too_many_attempts: '嘗試次數太多，請 15 分鐘後再試',
    invites_unavailable: '註冊功能尚未啟用，請稍後再試',
    invalid_email: 'Email 格式不正確',
    invalid_password: '密碼需 10–200 個字元',
    invalid_display_name: '顯示名稱需 1–50 個字',
  };
  const say = t => { errEl.textContent = t || ''; };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (btn.disabled) return;
    say('');
    const email = $('reg-email').value.trim();
    const name = $('reg-name').value.trim();
    const password = $('reg-password').value;
    const code = $('reg-code').value.trim();
    // the same rules the Worker applies, said before a request is spent on them
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say(MESSAGES.invalid_email); $('reg-email').focus(); return; }
    if (!name || [...name].length > 50) { say(MESSAGES.invalid_display_name); $('reg-name').focus(); return; }
    if ([...password].length < 10 || [...password].length > 200) { say(MESSAGES.invalid_password); $('reg-password').focus(); return; }
    if (!/^\d{8}$/.test(code)) { say('邀請碼是 8 位數字'); $('reg-code').focus(); return; }

    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = '建立中…';
    try {
      const res = await fetch(`${S.WORKER_URL}/api/photographer/register-invite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, display_name: name, password, invite_code: code }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 201 && data && typeof data.token === 'string' && data.token) {
        S.store(data.token, { mustChange: data.must_change_password === true });
        location.href = data.must_change_password === true ? 'settings.html' : 'dashboard.html';
        return;
      }
      say(MESSAGES[data && data.code] || (res.status === 429 ? MESSAGES.too_many_attempts : `註冊失敗（${res.status}），請稍後再試`));
    } catch (err) {
      say('無法連線，請檢查網路後再試一次');
    }
    btn.disabled = false;
    btn.textContent = label;
  });

  // After the handler is attached, so a failed load of the toggle script can never leave a form that submits natively.
  if (window.PasswordToggle) PasswordToggle.attach($('reg-password'));
})();
</script>
</body>
</html>
