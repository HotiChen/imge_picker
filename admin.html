  function renderProjectDetail(data) {
    const body = document.getElementById('project-detail-body');
    const project = data.project || {};
    const pickers = data.pickers || [];
    const submissions = data.submissions || [];
    const tokens = data.tokens || [];
    const selected = (data.selections || []).filter(s => s.rating > 0);
    const ownerName = data.owner ? data.owner.name : null;
    const interests = Array.isArray(data.interests) ? data.interests : [];

    secProject = project;
    body.innerHTML = `
      <div class="pd-head">
        <span class="pd-title-wrap" id="pd-title-wrap">
          <h3 id="pd-title" data-pd-title>${escHtml(project.title || '（未命名）')}</h3>
          <button id="pd-rename-btn" class="btn btn-outline" type="button" aria-label="改專案名稱">改名</button>
        </span>
        <form id="pd-rename-form" class="pd-rename-form" hidden>

      ${secHtml('people', `<h4>挑選人</h4>

        <div class="proj-recent-row" data-token-row="${escHtml(t.token)}">
          <div>
            <code class="folder-raw">${escHtml(t.token)}</code>
            <span class="badge ${t.status === 'live' ? 'badge-approved' : 'badge-pending'}">${escHtml(TOKEN_STATUS_LABEL[t.status] || t.status)}</span>

      ${project.archived_at ? '' : '<button id="pd-new-link-btn" class="btn btn-outline" type="button" style="margin-top:8px;">產生新連結</button>'}

    secData = { selectedCount: selected.length, submissions, pickers, tokens, ownerName };

    renderShootDateHeader(project);

    // pre-fill the chooser (editable; nothing is sent until 交件 is pressed).
    finalDraft = lastFinalFolders(project);
    finalEditing = false;
    startFinalsTarget(project);
    fillInterests(interests);
    renderDeliveryBlock();
    renderProofDownloadBlock();
    renderPlanBlock();
    document.getElementById('pd-archive-btn')?.addEventListener('click', async () => {

      this.disabled = true;
      try {

        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (errEl) errEl.textContent = data.code === 'has_submissions'
            ? '已有送出紀錄，無法刪除，請改用封存' : (data.error || `失敗（${r.status}）`);
          return;
        }
        leaveProjectDetail();
        await loadProjectList();
      } catch (e) {
        if (errEl) errEl.textContent = '無法連線到 Worker';
      } finally {
        this.disabled = false;
      }
    });
    body.querySelectorAll('[data-copy-link]').forEach(btn => {
      btn.addEventListener('click', () => copyLinkAndShare(btn, project.title, btn.dataset.copyLink));

    body.querySelectorAll('[data-revoke-token]').forEach(btn => {
      btn.addEventListener('click', async () => {

          if (!r.ok) { const d = await r.json().catch(() => ({})); if (errEl) errEl.textContent = d.error || `失敗（${r.status}）`; return; }

    document.getElementById('pd-new-link-btn')?.addEventListener('click', async function () {
      const errEl = document.getElementById('pd-link-err');

        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/links`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${getToken()}` },
        });
        const linkData = await r.json().catch(() => ({}));
        if (!r.ok) { if (errEl) errEl.textContent = linkData.error || `失敗（${r.status}）`; return; }
        await openProjectDetail(currentProjectId);
        try { await navigator.clipboard.writeText(projectLink(linkData.token)); } catch (e) { /* best effort */ }
      } catch (e) {
        if (errEl) errEl.textContent = '無法連線到 Worker';

    document.getElementById('pd-download-csv-btn').addEventListener('click', () => downloadSelectionCsv(project, selected));

  // ── 交件 (docs/delivery.md) ────────────────────────────────────────────────
  // finalDraft: the folders chosen in the picker but not delivered yet.
  // finalEditing: a delivered project's 更換精修資料夾 chooser is open.
  let currentProject = null;
  let currentTokens = [];   // the open project's pick links, newest first (for the 交件通知文案)
  let currentRevisions = [];   // the guest's 要求修改, newest first (detail.revision_requests)
  let finalDraft = [];
  let finalEditing = false;

  const DELIVER_ERRORS = {
    not_retouching: () => '尚未開始精修，無法交件，請先按「開始精修」',
    too_many_final_folders: d => `精修資料夾最多 ${d.max || 20} 個`,
    invalid_final_folders: () => '精修資料夾不正確，請重新選擇',
    final_overlaps_proofs: d => `「${d.folder || ''}」與毛片資料夾重疊：精修資料夾必須獨立，不能在毛片資料夾裡面，也不能包含毛片資料夾`,
  };

  function chipsHtml(folders, removable) {
    return folders.map(f => `<span class="folder-chip" data-final-chip="${escHtml(f)}">${escHtml(f)}${
      removable ? `<button type="button" data-remove-final="${escHtml(f)}" title="移除">×</button>` : ''}</span>`).join('');
  }

  // The finals the Worker still holds for a project that is NOT delivered
  // (it keeps them across 取消交件 and 開放修改); [] when delivered or none.
  function lastFinalFolders(project) {
    if (project.delivered_at || !Array.isArray(project.final_folders)) return [];
    return project.final_folders.slice();
  }

  // 資料夾：<root>/ — the project's folders in one line. A project that follows the
  // convention (proofs in <root>/毛片/) shows its root; an older one shows the
  // folders its snapshot holds, as they are.
  function projectFolderLineHtml(project) {
    const info = PF.rootOfProject(project);
    const folders = Array.isArray(project.folders) ? project.folders : [];
    const list = info && info.proofShaped ? [info.root + '/'] : folders;
    if (!list.length) return '';
    return `<div class="pd-folder-line" id="pd-folder-line">資料夾：${list.map(f => `<code>${escHtml(f)}</code>`).join('、')}</div>`;
  }

  // ＋上傳毛片: upload.html on <root>/毛片/, locked there, so a photo cannot land
  // in the wrong project's folder. Only for a project whose proofs follow the
  // convention; an older project keeps uploading through the folder tree.
  function proofsUploadHtml(project) {
    const info = PF.rootOfProject(project);
    if (!info || !info.proofShaped) return '';
    return `<a id="pd-upload-proofs-btn" class="btn btn-outline" href="${escHtml(PF.uploadHref(project.id, info.proofFolder, true))}">＋上傳毛片</a>`;
  }

  // 看全部毛片: the review view (index.html?project=) in its all-proofs mode — every photo in
  // the project's folders, not just the client's picks. A plain same-tab link, like 看照片.
  function viewAllHtml(project) {
    const has = Array.isArray(project.folders) && project.folders.length > 0;
    if (!has) return '';
    return `<a id="pd-view-all-btn" class="btn btn-outline" href="index.html?project=${encodeURIComponent(project.id)}&amp;mode=all">看全部毛片</a>`;
  }

  // ＋上傳精修: upload.html on the next finals folder, locked there. The next one is
  // one past the biggest 精修* that already exists under the project's root, so a
  // second version never lands on (and overwrites) the first. What exists is read
  // from R2, and until that is known — or when it cannot be read — the link names
  // no folder at all and does not lock: choosing by hand is slower than guessing
  // and cannot overwrite anything.
  // An older project (proofs not in <root>/毛片/) keeps the old link, <parent>/精修/,
  // unlocked, with no listing.
  let finalsTarget = null;       // { projectId, state: 'checking' | 'ready' | 'failed', folder, locked }
  let finalsDefaulted = null;    // the newest 精修 folder, once it filled an empty 交件 draft

  function startFinalsTarget(project) {
    finalsDefaulted = null;
    const info = PF.rootOfProject(project);
    if (!info || !info.proofShaped) {
      finalsTarget = { projectId: project.id, state: 'ready', locked: false,
        folder: info ? `${info.root}/${PF.FINAL_NAME}/` : null };
      return;
    }
    const mine = finalsTarget = { projectId: project.id, state: 'checking', folder: null, locked: false };
    listPrefix(`${info.root}/`).then(listed => {
      if (finalsTarget !== mine) return;     // another project was opened meanwhile
      if (!listed) {
        mine.state = 'failed';
      } else {
        mine.state = 'ready';
        mine.locked = true;
        mine.folder = PF.nextFinalFolder(info.root, listed.folders);
        // 交件 starts on the newest 精修 — but never over a choice already made
        // (a draft the photographer built meanwhile, the last delivery's folders,
        // or a delivery that is up).
        const latest = PF.latestFinalFolder(info.root, listed.folders);
        const p = currentProject;
        if (latest && p && p.id === project.id && !p.delivered_at && !finalEditing &&
            !finalDraft.length && !lastFinalFolders(p).length) {
          finalDraft = [latest];
          finalsDefaulted = latest;
        }
      }
      renderDeliveryBlock();
    });
  }

  function finalsUploadHref(project) {
    const t = finalsTarget && finalsTarget.projectId === project.id ? finalsTarget : null;
    if (!t) return PF.uploadHref(project.id, null, false);
    if (t.state !== 'ready') return PF.uploadHref(project.id, null, false);
    return PF.uploadHref(project.id, t.folder, t.locked);
  }

  // ── 客戶確認 / 要求修改 (docs/delivery.md) ────────────────────────────────
  // Only for a delivered project. The guest's text and name are raw in the
  // JSON: they are put in with textContent (fillRevisionList), never HTML.
  function confirmSectionHtml(project) {
    const confirmed = !!project.client_confirmed_at;
    const open = currentRevisions.filter(r => !r.resolved_at).length;
    const status = confirmed
      ? (project.client_confirmed_by === 'photographer'
        ? `已標記完成（攝影師代為確認）· ${fmtTime(project.client_confirmed_at)}`
        : `客戶已確認完成 · ${fmtTime(project.client_confirmed_at)}`)
      : '客戶尚未確認';
    return `
      <div class="pd-confirm" id="pd-confirm">
        <div id="pd-confirm-status" class="pd-confirm-status${confirmed ? ' done' : ''}">${escHtml(status)}</div>
        ${open > 0 ? '<div class="pd-note" id="pd-revision-hint">請上傳新版精修資料夾後按「更換精修資料夾」，會自動結案目前的要求</div>' : ''}
        ${currentRevisions.length ? '<div id="pd-revisions"></div>' : ''}
        ${confirmed ? '' : '<div class="pd-row"><button id="pd-mark-done-btn" class="btn btn-outline" type="button">標記完成</button></div>'}
        <div id="pd-confirm-err" class="err"></div>
      </div>`;
  }

  // One card per round (js/revision-rounds-view.js): kind, photos, time, the client's note, open or
  // handled; a pins round also lists its photos with read-only pins. Guest strings are textContent only.
  function fillRevisionList(box) {
    const list = box.querySelector('#pd-revisions');
    if (!list) return;
    const ctx = { workerUrl: WORKER_URL, token: getToken, fmtTime, onCsv: downloadRoundCsv };
    // currentRevisions is newest first: the oldest round is 第 1 輪
    list.replaceChildren(...currentRevisions.map((r, i) => window.RevisionRoundsView.renderRound(r, currentRevisions.length - i, ctx)));
  }

  // 下載此輪需求表: the pins of one round for the retoucher (js/selection-export.js revisionToCsv)
  function downloadRoundCsv(round, k) {
    saveBlobAs(new Blob([window.SelectionExport.revisionToCsv(round)], { type: 'text/csv;charset=utf-8' }), currentProject || {}, 'csv', `修改第${k}輪`);
  }

  const MARK_DONE_ERRORS = {
    not_delivered: () => '尚未交件，無法標記完成（頁面可能已過期，請重新整理）',
    confirm_unavailable: () => '資料庫尚未升級（請先跑 migration）',
  };

  // 標記完成: the photographer confirms for a guest who never answers.
  // Updates the page in place from the Worker's answer.
  async function markDone() {
    const btn = document.getElementById('pd-mark-done-btn');
    const errEl = document.getElementById('pd-confirm-err');
    if (errEl) errEl.textContent = '';
    if (!confirm('這是代客戶確認：客戶頁面會顯示已確認完成，目前未處理的修改要求也會一併結案。確定要標記完成嗎？')) return;
    if (btn) btn.disabled = true;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/confirm`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const map = MARK_DONE_ERRORS[data.code];
        if (errEl) errEl.textContent = map ? map(data) : (r.status === 404 ? '找不到專案（可能已被刪除）' : (data.error || `失敗（${r.status}）`));
        if (btn) btn.disabled = false;
        return;
      }
      const at = data.client_confirmed_at;
      currentProject.client_confirmed_at = at;
      currentProject.client_confirmed_by = data.client_confirmed_by;
      currentProject.open_revision_count = 0;
      // the Worker resolves the open requests with the confirmation
      currentRevisions = currentRevisions.map(x => (x.resolved_at ? x : { ...x, resolved_at: at }));
      renderDeliveryBlock();
      const slot = document.getElementById('pd-confirm-badge-slot');
      if (slot) slot.innerHTML = confirmBadgeHtml(currentProject);
      await loadProjectList();
    } catch (e) {
      if (errEl) errEl.textContent = '無法連線到 Worker';
      if (btn) btn.disabled = false;
    }
  }

  function renderDeliveryBlock() {
    const box = document.getElementById('pd-delivery');
    const project = currentProject;
    if (!box || !project) return;
    const delivered = !!project.delivered_at;
    const finals = Array.isArray(project.final_folders) ? project.final_folders : [];
    if (!delivered && project.phase !== 'retouching') { box.style.display = 'none'; box.innerHTML = ''; secDeliveryShown(false); refreshSecSummaries(); return; }
    box.style.display = '';
    secDeliveryShown(true);

      ${showDefaultHint ? '<div class="pd-note" data-final-default-hint>已預選最新的精修資料夾（可修改，按「交件」才會生效）：</div>' : ''}
      <div id="pd-final-chips">${draftChips()}</div>

        <button id="pd-deliver-btn" class="btn btn-accent" type="button"${finalDraft.length ? '' : ' disabled'}>${delivered ? '確定更換' : '交件'}</button>

      </div>

    if (!delivered) {
      box.innerHTML = `${chooser}<div id="pd-deliver-err" class="err"></div>`;
    } else {
      box.innerHTML = `
        <h4><span class="badge badge-approved" data-delivered-status>已交件</span>
          <span class="folder-none">${escHtml(fmtTime(project.delivered_at))}</span></h4>
        <div id="pd-delivered-folders">${finals.length ? chipsHtml(finals, false)
          : '<span class="folder-none">（舊資料：沒有指定精修資料夾，客人仍看到選片畫面）</span>'}</div>
        ${finalEditing ? chooser : `<div class="pd-row">
          <button id="pd-replace-final-btn" class="btn btn-outline" type="button">更換精修資料夾</button>

          <button id="pd-undeliver-btn" class="btn btn-ghost" type="button">取消交件</button>
        </div>`}
        <div id="pd-deliver-err" class="err"></div>
        ${confirmSectionHtml(project)}`;
      fillRevisionList(box);
    }

    refreshSecSummaries();
    box.querySelector('#pd-final-pick-btn')?.addEventListener('click', openFinalFolderPicker);
    box.querySelectorAll('[data-remove-final]').forEach(btn => {
      btn.addEventListener('click', () => {
        finalDraft = finalDraft.filter(f => f !== btn.dataset.removeFinal);
        renderDeliveryBlock();
      });
    });
    box.querySelector('#pd-replace-final-btn')?.addEventListener('click', async () => {
      finalDraft = finals.slice();
      finalEditing = true;
      renderDeliveryBlock();
      await openFinalFolderPicker();
    });
    box.querySelector('#pd-final-cancel-btn')?.addEventListener('click', () => {
      finalEditing = false;
      finalDraft = [];
      renderDeliveryBlock();
    });
    box.querySelector('#pd-mark-done-btn')?.addEventListener('click', markDone);
    box.querySelector('#pd-copy-notice-btn')?.addEventListener('click', async () => {
      const st = document.getElementById('pd-copy-notice-status');
      const ok = await copyText(deliveryNoticeText(currentProject, liveLinkOf(currentTokens)));
      if (!st) return;
      st.textContent = ok ? '已複製' : '複製失敗，請手動複製';
      clearTimeout(st._t);
      st._t = setTimeout(() => { st.textContent = ''; }, 2500);
    });
    box.querySelector('#pd-undeliver-btn')?.addEventListener('click', async () => {
      if (!confirm('取消交件後，客人的連結會回到選片畫面（唯讀），精修成品不再顯示。確定要取消交件嗎？')) return;
      await projectAction('undeliver');
    });
    box.querySelector('#pd-deliver-btn')?.addEventListener('click', async function () {
      const errEl = document.getElementById('pd-deliver-err');
      if (errEl) errEl.textContent = '';

      try {
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/deliver`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ final_folders: finalDraft }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          const map = DELIVER_ERRORS[data.code];
          if (errEl) errEl.textContent = map ? map(data) : (data.error || `失敗（${r.status}）`);

  // ── 交件後的通知文案 ─────────────────────────────────────────────────────────
  // A ready-to-paste LINE message: where the finals are, what 確認完成 / 需要修改 do. It says
  // nothing about pins (the client cannot pin finals yet). The title is the photographer's
  // free text: it only ever goes through .value / textContent here, never innerHTML.
  function liveLinkOf(tokens) {
    const live = (tokens || []).find(t => t.status === 'live');
    return live ? projectLink(live.token) : '';
  }
  function deliveryNoticeText(project, link) {
    const title = String((project && project.title) || '').replace(/[\u0000-\u001F\u007F-\u009F\u2028\u2029]+/g, ' ').trim() || '您的專案';
    return [
      `${title} 的成品已經完成，可以看了！`,
      link ? `請從這個連結查看與下載：\n${link}` : '請從先前傳給您的選片連結查看與下載。',
      '',
      '看完覺得沒問題，請按頁面上的「確認完成」。',
      '如果有想調整的地方，請按「需要修改」，寫下想修改的內容，我會再幫您處理。',
    ].join('\n');
  }
  // Clipboard API first; where it is missing (an insecure context, an old in-app browser) or
  // refuses, select the text in a throw-away textarea and execCommand('copy'). 16px so iOS
  // does not zoom. Resolves true when either path worked.
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through to the selection path */ }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
    document.body.appendChild(ta);
    let ok = false;
    try {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = !!document.execCommand('copy');
    } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  // 複製連結 → the link is copied at once (as before) AND a dialog shows a ready-to-send message (title + link +
  // how to open it) in a read-only textarea, so it can be copied whole or selected by hand where the clipboard is blocked.
  // The text comes from the studio's saved template (settings 「傳給客人的選片訊息」) via Util.pickLinkMessage; until the
  // settings are loaded, or when they cannot be read, it is the built-in default. Fetched once per page (a failure is retried
  // on the next open), never awaited before the dialog opens.
  let pickLinkTemplate = null, pickLinkTemplateP = null;
  function loadPickLinkTemplate() {
    if (!pickLinkTemplateP) {
      pickLinkTemplateP = fetch(`${WORKER_URL}/api/admin/settings`, { headers: { 'Authorization': `Bearer ${getToken()}` } })
        .then(r => (r.ok ? r.json() : Promise.reject(new Error('settings'))))
        .then(s => { pickLinkTemplate = typeof s.pick_link_message === 'string' ? s.pick_link_message : null; return pickLinkTemplate; })
        .catch(() => { pickLinkTemplateP = null; return null; });
    }
    return pickLinkTemplateP;
  }
  function shareLinkMessage(title, link) {
    return Util.pickLinkMessage(pickLinkTemplate, title, link);
  }
  let closeShareDialog = null;   // cleanup of the dialog on screen, so a second open leaves no Esc listener behind
  function showShareLinkDialog(title, token, linkCopied) {
    if (closeShareDialog) closeShareDialog();
    const link = projectLink(token);
    const text = shareLinkMessage(title || '專案', link);
    const loadedAtOpen = !!pickLinkTemplateP && pickLinkTemplate !== null;
    const overlay = document.createElement('div');
    overlay.id = 'pd-share-link';
    overlay.className = 'picker-overlay';
    const box = document.createElement('div');
    box.className = 'picker-box dn-box';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'sl-title');
    const h = document.createElement('h4');
    h.id = 'sl-title';
    h.textContent = '傳給客人';
    const note = document.createElement('p');
    note.className = 'dn-note';
    note.textContent = linkCopied ? '連結已複製。要連同說明一起傳給客人，複製下面這段貼到 LINE。' : '要傳給客人，複製下面這段貼到 LINE（複製不了就長按文字手動複製）。';
    const ta = document.createElement('textarea');
    ta.id = 'sl-text';
    ta.className = 'dn-text';
    ta.value = text;
    const tweak = document.createElement('p');
    tweak.className = 'dn-note';
    tweak.append('預設文字可以在「');
    const setLink = document.createElement('a');
    setLink.href = 'settings.html';
    setLink.className = 'dn-set-link';
    setLink.textContent = '設定';
    tweak.append(setLink, '」裡修改');
    const actions = document.createElement('div');
    actions.className = 'dn-actions';
    const copy = document.createElement('button');
    copy.id = 'sl-copy-btn';
    copy.type = 'button';
    copy.className = 'btn btn-accent';
    copy.textContent = '📋 複製這段文字';
    const status = document.createElement('span');
    status.id = 'sl-status';
    status.className = 'dn-status';
    status.setAttribute('role', 'status');
    const close = document.createElement('button');
    close.id = 'sl-close-btn';
    close.type = 'button';
    close.className = 'btn btn-ghost';
    close.textContent = '關閉';
    actions.append(copy, status, close);
    box.append(h, note, ta, tweak, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    // settings not read yet: show the default now, swap in the saved template when it arrives, unless the text was already edited
    let edited = false;
    ta.addEventListener('input', () => { edited = true; });
    if (!loadedAtOpen) {
      loadPickLinkTemplate().then(() => {
        if (!edited && overlay.isConnected && pickLinkTemplate !== null) ta.value = shareLinkMessage(title || '專案', link);
      });
    }
    const onKey = e => { if (e.key === 'Escape') done(); };
    const done = () => { overlay.remove(); document.removeEventListener('keydown', onKey); if (closeShareDialog === done) closeShareDialog = null; };
    closeShareDialog = done;
    document.addEventListener('keydown', onKey);
    close.addEventListener('click', done);
    overlay.addEventListener('click', e => { if (e.target === overlay) done(); });
    copy.addEventListener('click', async () => {
      const ok = await copyText(ta.value);
      status.textContent = ok ? '已複製' : '複製失敗，請長按文字手動複製';
    });
    copy.focus();
  }
  async function copyLinkAndShare(btn, title, token) {
    const ok = await copyText(projectLink(token));
    if (ok && btn) flashGreen(btn);
    showShareLinkDialog(title, token, ok);
  }
  function showDeliverNotice(project, tokens) {
    if (!project || !project.delivered_at) return;
    document.getElementById('pd-deliver-notice')?.remove();
    const link = liveLinkOf(tokens);
    const text = deliveryNoticeText(project, link);
    const overlay = document.createElement('div');
    overlay.id = 'pd-deliver-notice';
    overlay.className = 'picker-overlay';
    const box = document.createElement('div');
    box.className = 'picker-box dn-box';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'dn-title');
    const h = document.createElement('h4');
    h.id = 'dn-title';
    h.textContent = '已交件，通知客人';
    const note = document.createElement('p');
    note.className = 'dn-note';
    note.textContent = link ? '把下面這段貼到 LINE 傳給客人。' : '目前沒有有效的選片連結（可到「挑選人與連結」產生新連結），文案裡先不放連結。';
    const ta = document.createElement('textarea');
    ta.id = 'dn-text';
    ta.className = 'dn-text';
    ta.readOnly = true;
    ta.value = text;
    const actions = document.createElement('div');
    actions.className = 'dn-actions';
    const copy = document.createElement('button');
    copy.id = 'dn-copy-btn';
    copy.type = 'button';
    copy.className = 'btn btn-accent';
    copy.textContent = '📋 複製交件通知文案';
    const status = document.createElement('span');
    status.id = 'dn-status';
    status.className = 'dn-status';
    status.setAttribute('role', 'status');
    const close = document.createElement('button');
    close.id = 'dn-close-btn';
    close.type = 'button';
    close.className = 'btn btn-ghost';
    close.textContent = '關閉';
    actions.append(copy, status, close);
    box.append(h, note, ta, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const onKey = e => { if (e.key === 'Escape') done(); };
    const done = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
    document.addEventListener('keydown', onKey);
    close.addEventListener('click', done);
    overlay.addEventListener('click', e => { if (e.target === overlay) done(); });
    copy.addEventListener('click', async () => {
      const ok = await copyText(text);
      status.textContent = ok ? '已複製' : '複製失敗，請長按文字手動複製';
    });
    copy.focus();
  }

  // 允許客人下載毛片原檔 — PATCH allow_proof_download. The checkbox follows
  // the server's answer, so a refused change puts it back where it was.
  function renderProofDownloadBlock() {
    const box = document.getElementById('pd-proofdl');
    const project = currentProject;
    if (!box || !project) return;
    box.innerHTML = `
      <label class="pd-switch"><input type="checkbox" id="pd-allow-proof-dl"${project.allow_proof_download ? ' checked' : ''}>
        允許客人下載毛片原檔</label>
      <div class="pd-note">開啟後，客人選片時可在預覽下載毛片的原始檔；交件後選片頁不再顯示，但會多一個「下載毛片原檔」入口。預設關閉。</div>
      <div id="pd-proofdl-err" class="err"></div>`;
    const input = box.querySelector('#pd-allow-proof-dl');
    input.addEventListener('change', async () => {
      const errEl = document.getElementById('pd-proofdl-err');
      if (errEl) errEl.textContent = '';
      const want = input.checked;
      input.disabled = true;
      try {
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ allow_proof_download: want }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          input.checked = !want;
          if (errEl) errEl.textContent = data.error || `設定失敗（${r.status}）`;
          return;
        }
        project.allow_proof_download = data.allow_proof_download === true;
        input.checked = project.allow_proof_download;
        refreshSecSummaries();
      } catch (e) {
        input.checked = !want;
        if (errEl) errEl.textContent = '無法連線到 Worker';
      } finally {
        input.disabled = false;
      }
    });
  }

  // 編輯方案 — PATCH pick_limit / extra_price / extra_max (only the keys that
  // changed). Blank 張數 / 加挑單價 → null; blank 最多可加選 → null = NO cap.
  const PLAN_ERRORS = {
    invalid_body: '數值不正確：張數、單價需為 0 以上整數，最多可加選為 0–500',
    archived: '專案已封存，請先取消封存再修改方案',
    extra_max_unavailable: '請先在 D1 執行 extra-max migration',
  };
  function planMaxText(p) {
    if (p.pick_limit == null) return '不限';
    if (p.extra_max == null) return '不限（舊專案未設加選上限）';
    return `${p.pick_limit + p.extra_max} 張（${p.pick_limit} + 加選 ${p.extra_max}）`;
  }
  function renderPlanBlock() {
    const box = document.getElementById('pd-plan');
    const project = currentProject;
    if (!box || !project) return;
    const val = v => (v == null ? '' : String(v));
    box.innerHTML = `
      <h4>編輯方案</h4>
      <div class="pick-admin-row">
        <div class="pick-admin-field">
          <label for="pd-plan-limit">精修張數上限（留空 = 不限）</label>
          <input id="pd-plan-limit" class="field" type="number" min="0" step="1" value="${escHtml(val(project.pick_limit))}">
        </div>
        <div class="pick-admin-field">
          <label for="pd-plan-price">加挑單價 NT$（留空 = 不顯示）</label>
          <input id="pd-plan-price" class="field" type="number" min="0" step="1" value="${escHtml(val(project.extra_price))}">
        </div>
        <div class="pick-admin-field">
          <label for="pd-plan-extra">最多可加選（張，留空 = 不限制，0 = 不可加選）</label>
          <input id="pd-plan-extra" class="field" type="number" min="0" max="500" step="1" value="${escHtml(val(project.extra_max))}">
        </div>
      </div>
      <div id="pd-plan-result" class="pd-note">客人最多可挑：${escHtml(planMaxText(project))}${project.extra_max == null ? '　最多可加選：不限制（舊專案）' : ''}</div>
      <div class="pd-note">已送出的紀錄維持送出當時的方案，修改只影響之後的送出。</div>
      <button id="pd-plan-save" class="btn btn-accent" type="button">儲存方案</button>
      <div id="pd-plan-err" class="err"></div>
      <div id="pd-plan-ok" class="ok-msg"></div>`;
    const errEl = box.querySelector('#pd-plan-err');
    const okEl = box.querySelector('#pd-plan-ok');
    const btn = box.querySelector('#pd-plan-save');
    btn.addEventListener('click', async () => {
      errEl.textContent = ''; okEl.textContent = '';
      const read = (id, max) => {
        const raw = box.querySelector(id).value.trim();
        if (raw === '') return { v: null };
        const n = Number(raw);
        return (Number.isInteger(n) && n >= 0 && n <= max) ? { v: n } : { bad: true };
      };
      const fields = [
        ['pick_limit', read('#pd-plan-limit', Number.MAX_SAFE_INTEGER), '精修張數上限需為 0 以上整數'],
        ['extra_price', read('#pd-plan-price', 10000000), '加挑單價需為 0 以上整數'],
        ['extra_max', read('#pd-plan-extra', 500), '最多可加選需為 0–500 的整數'],
      ];
      const body = {};
      for (const [key, res, msg] of fields) {
        if (res.bad) { errEl.textContent = msg; return; }
        const before = project[key] == null ? null : project[key];
        if (res.v !== before) body[key] = res.v;
      }
      if (!Object.keys(body).length) { okEl.textContent = '沒有變更'; return; }
      btn.disabled = true;
      try {
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          errEl.textContent = PLAN_ERRORS[data.code] || data.error || `儲存失敗（${r.status}）`;
          btn.disabled = false;
          return;
        }
        await Promise.all([openProjectDetail(currentProjectId), loadProjectList()]);
        const ok = document.getElementById('pd-plan-ok');
        if (ok) ok.textContent = '已儲存';
      } catch (e) {
        errEl.textContent = '無法連線到 Worker';
        btn.disabled = false;
      }
    });
  }

  async function projectAction(action) {
    const errEl = document.getElementById('pd-action-err');
    if (errEl) errEl.textContent = '';
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/${action}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { if (errEl) errEl.textContent = data.error || `失敗（${r.status}）`; return; }
      // 封存 takes the project out of the list (unless 顯示已封存): back to the list.
      if (action === 'archive') { leaveProjectDetail(); await loadProjectList(); return; }
      // The list shows the same phase/modified badges as the detail panel —
      // refreshing only the panel left the list showing 已送出 while the
      // detail already said 精修中. Every action that can change them has to
      // bring the list along too, not just the panel that triggered it.
      await Promise.all([openProjectDetail(currentProjectId), loadProjectList()]);
    } catch (e) {
      if (errEl) errEl.textContent = '無法連線到 Worker';
    }
  }

  // ── 訂單 (docs/products-orders.md) ────────────────────────────────────────
  const O = window.Orders;
  const ordersApi = O.client({ workerUrl: WORKER_URL, getToken, onUnauthorized: () => doLogout() });
  // state of the section on screen: the orders as last read, the project's
  // picked photo keys (what a print/album line may attach), the catalogue
  // (read when an editor opens) and which form is open.
  let oc = null;

  function todayTaipei() { return Util.todayTaipei(); }   // the studio's dates are Taipei dates
  function dateTaipei(iso) {
    return Util.fmtDate(iso, 'iso') || todayTaipei();
  }

  async function initOrders(project, picks) {
    oc = { projectId: project.id, picks, orders: [], loaded: false, failed: false, extra: null, catalogue: null, editing: null, paying: null, draft: null, msg: {} };
    const box = document.getElementById('pd-orders');
    if (!box) return;
    const mine = oc;
    const r = await ordersApi(`/api/admin/projects/${encodeURIComponent(project.id)}/orders`);
    if (oc !== mine) return; // another project was opened meanwhile
    if (!r.ok) {
      box.innerHTML = `<div class="empty">讀取訂單失敗：${escHtml(O.errorText(r.data, r.status))}</div>`;
      oc.failed = true;
      refreshSecSummaries();
      return;
    }
    oc.orders = r.data.orders || [];
    oc.loaded = true;
    oc.extra = r.data.extra_pick || null;
    // the first read decides whether 訂單 opens by itself: only if something is waiting
    // and nobody (this page, this browser) has chosen either way
    if (!('orders' in secChoice) && secStored('orders') === null) {
      secAuto.orders = ordersWaiting();
      secApply('orders', secAuto.orders);
    }
    renderOrders();
  }

  async function reloadOrders() {
    const mine = oc;
    const r = await ordersApi(`/api/admin/projects/${encodeURIComponent(mine.projectId)}/orders`);
    if (oc !== mine || !r.ok) return;
    mine.orders = r.data.orders || [];
    mine.extra = r.data.extra_pick || null;
    mine.editing = null; mine.paying = null; mine.draft = null;
    renderOrders();
  }

  function extraPickHtml(x) {
    if (!x) return '';
    const applies = x.count != null && x.pick_limit != null && x.extra_price != null;
    if (!applies && !x.order_id) return '';
    const info = applies
      ? `加挑：最近一次送出 ${escHtml(x.count)} 張，上限 ${escHtml(x.pick_limit)}，多挑 ${escHtml(x.extra)} 張 × ${O.money(x.extra_price)} = ${O.money(x.fee)}`
      : '加挑：已有加挑訂單';
    // No extra-pick order exists until 開始精修 writes it, so before that the
    // "count changed" warning is wrong: say when the order will appear instead.
    const pending = x.matches === false && !x.order_id && !(currentProject && currentProject.phase === 'retouching');
    const warn = pending
      ? '<div class="ord-hint" id="pd-extra-pending">按「開始精修」時會自動建立加挑訂單</div>'
      : x.matches === false
        ? `<div class="ord-warn" id="pd-extra-warn">加挑張數已變更（原 ${escHtml(x.order_extra == null ? 0 : x.order_extra)} → 現 ${escHtml(x.extra)}），請確認</div>` : '';
    return `<div class="ord-extra" id="pd-extra-pick">${info}${warn}</div>`;
  }

  function orderCardHtml(o) {
    const pay = O.paymentState(o);
    const items = o.items || [];
    const lines = items.map(i => `<tr data-item-id="${escHtml(i.id)}">
        <td>${escHtml(O.lineName(i))} <span class="badge badge-pending">${escHtml(O.KIND_LABEL[i.kind] || i.kind)}</span>
          ${(i.photo_keys || []).length ? `<details><summary class="ord-keys">照片 ${i.photo_keys.length} 張</summary><div class="ord-keys">${i.photo_keys.map(escHtml).join('<br>')}</div></details>` : ''}</td>
        <td class="num">${O.money(i.unit_price)}</td><td class="num">× ${escHtml(i.qty)}</td><td class="num">${O.money(i.unit_price * i.qty)}</td>
      </tr>`).join('');
    const canPay = o.status !== 'cancelled';
    const canEdit = o.status !== 'cancelled';
    const payForm = oc.paying === o.id ? `<div class="ord-form" data-pay-form>
        <div><label>收款金額（累計）</label><input class="field pay-amount" type="number" min="0" step="1" value="${escHtml(o.total)}"></div>
        <div><label>方式</label><select class="field pay-method">${Object.keys(O.METHOD_LABEL).map(k =>
          `<option value="${k}"${(o.paid_method || 'transfer') === k ? ' selected' : ''}>${escHtml(O.METHOD_LABEL[k])}</option>`).join('')}</select></div>
        <div><label>日期</label><input class="field pay-date" type="date" value="${escHtml(o.paid_at ? dateTaipei(o.paid_at) : todayTaipei())}"></div>
        <button type="button" class="btn btn-accent" data-pay-save>確認收款</button>
        <button type="button" class="btn btn-ghost" data-pay-cancel>取消</button>
      </div>` : '';
    return `<div class="ord-card ${escHtml(o.status)}" data-order-id="${escHtml(o.id)}" data-status="${escHtml(o.status)}" data-source="${escHtml(o.source)}">
      <div class="ord-head">
        <span class="badge ${o.status === 'confirmed' || o.status === 'fulfilled' ? 'badge-approved' : 'badge-pending'} ord-status">${escHtml(O.statusLabel(o))}</span>
        ${o.status === 'cancelled' && !o.paid_amount ? '' : `<span class="badge ${pay === 'paid' || pay === 'free' ? 'badge-approved' : 'badge-pending'} ord-pay" data-pay="${pay}">${escHtml(O.PAYMENT_LABEL[pay])}</span>`}
        <span class="folder-none">${escHtml(O.SOURCE_LABEL[o.source] || o.source)}</span>
        <span class="ord-time">${escHtml(fmtTime(o.created_at))}</span>
      </div>
      <div data-guest-slot></div>
      <table class="ord-table"><thead><tr><th>品項</th><th class="num">單價</th><th class="num">數量</th><th class="num">小計</th></tr></thead><tbody>${lines}</tbody></table>
      <div class="ord-totals">
        <div>小計 ${O.money(o.subtotal)}${o.discount ? ` · 折扣 −${O.money(o.discount)}` : ''}</div>
        <div><strong>合計 <span class="ord-total">${O.money(o.total)}</span></strong></div>
        <div>已收 <span class="ord-paid">${O.money(o.paid_amount)}</span>${o.paid_amount ? `（${escHtml(O.METHOD_LABEL[o.paid_method] || '')}${o.paid_at ? ' · ' + escHtml(dateTaipei(o.paid_at)) : ''}）` : ''}
          · 未收 <span class="ord-owed${o.outstanding > 0 ? ' owed' : ''}">${O.money(o.outstanding)}</span></div>
        <div class="muted">成本 ${O.money(o.cost)} · 毛利 ${O.money(o.total - o.cost)}</div>
      </div>
      ${o.note ? `<div class="ord-note">備註：${escHtml(o.note)}</div>` : ''}
      ${o.guest_note && o.source !== 'guest' ? `<div class="ord-note">客人留言：${escHtml(o.guest_note)}</div>` : ''}
      ${payForm}
      <div class="ord-actions">
        ${O.movesFor(o).map(([to, label]) => `<button type="button" class="btn ${to === 'cancelled' ? 'btn-danger' : 'btn-accent'}" data-status-to="${to}">${escHtml(label)}</button>`).join('')}
        ${canEdit ? '<button type="button" class="btn btn-ghost" data-order-edit>編輯</button>' : ''}
        ${canPay && oc.paying !== o.id ? '<button type="button" class="btn btn-ghost" data-pay-open>記錄收款</button>' : ''}
        ${o.paid_amount > 0 ? '<button type="button" class="btn btn-ghost" data-pay-clear>清除收款</button>' : ''}
      </div>
      <div class="ord-err" data-order-err>${escHtml(oc.msg[o.id] || '')}</div>
    </div>`;
  }

  function renderOrders() {
    const box = document.getElementById('pd-orders');
    if (!box || !oc) return;
    const editingNew = oc.editing === 'new';
    const editingOrder = oc.editing && oc.editing !== 'new' ? oc.orders.find(o => o.id === oc.editing) : null;
    box.innerHTML = `
      ${extraPickHtml(oc.extra)}
      <div id="pd-order-list">${oc.orders.length
        ? oc.orders.map(o => (editingOrder && editingOrder.id === o.id) ? editorHtml(o) : orderCardHtml(o)).join('')
        : '<div class="folder-none" id="pd-orders-empty">尚無訂單</div>'}</div>
      ${editingNew ? editorHtml(null) : ''}
      ${oc.editing ? '' : '<button type="button" id="pd-order-add-btn" class="btn btn-outline" style="margin-top:6px;">＋ 新增訂單</button>'}
      <div class="ord-err" id="pd-order-err">${escHtml(oc.msg._ || '')}</div>`;
    // a guest order's contact card is built with textContent (js/orders-common.js), not into the string above
    for (const o of oc.orders) {
      const card = O.guestCard(o);
      const slot = card && box.querySelector(`.ord-card[data-order-id="${CSS.escape(o.id)}"] [data-guest-slot]`);
      if (slot) slot.replaceWith(card);
    }
    refreshSecSummaries();
  }

  // ── editor (new order, or the lines/discount/note of an existing one) ──
  function draftFrom(o) {
    return {
      lines: o ? o.items.map(i => ({
        id: i.id, kind: i.kind, name: O.lineName(i), qty: String(i.qty), price: String(i.unit_price), catPrice: i.unit_price,
        keys: (i.photo_keys || []).slice(),
      })) : [],
      discount: o ? String(o.discount) : '',
      note: o ? o.note || '' : '',
    };
  }

  function editorHtml(o) {
    const d = oc.draft;
    const cat = oc.catalogue;
    const lineHtml = d.lines.map((l, idx) => {
      const photoable = l.kind === 'print' || l.kind === 'album';
      const cand = [...new Set([...oc.picks, ...l.keys])];
      return `<div class="ord-line-edit" data-idx="${idx}">
        <div class="ord-line-name">${escHtml(l.name)} <span class="badge badge-pending">${escHtml(O.KIND_LABEL[l.kind] || l.kind)}</span>
          ${photoable ? `<details><summary class="ord-keys" data-photo-summary>照片（${l.keys.length} 張）</summary>
            <div class="ord-photos">${cand.length ? cand.map(k => `<label><input type="checkbox" class="ord-photo" value="${escHtml(k)}"${l.keys.includes(k) ? ' checked' : ''}>${escHtml(k)}</label>`).join('')
              : '<span class="folder-none">專案尚無選取的照片</span>'}</div></details>` : ''}
        </div>
        <div><label>數量</label><input class="field ord-qty" type="number" min="1" max="999" step="1" value="${escHtml(l.qty)}"></div>
        <div><label>單價 NT$</label><input class="field ord-price" type="number" min="0" step="1" placeholder="${escHtml(l.catPrice)}" value="${escHtml(l.price)}"></div>
        <button type="button" class="btn btn-ghost" data-line-del>移除</button>
      </div>`;
    }).join('');
    const options = cat ? cat.flatMap(p => p.options.map(op => ({ p, op }))) : [];
    return `<div class="ord-editor" id="pd-order-editor" data-mode="${o ? 'edit' : 'new'}"${o ? ` data-order-id="${escHtml(o.id)}"` : ''}>
      <strong>${o ? '編輯訂單' : '新增訂單'}</strong>
      <div id="pd-editor-lines">${lineHtml || '<div class="folder-none">尚未加入品項</div>'}</div>
      <div class="ord-editor-add">
        ${cat === null ? '<span class="folder-none">載入商品中…</span>'
          : options.length ? `<select class="field" id="pd-add-option">${options.map(({ p, op }) =>
              `<option value="${escHtml(op.id)}">${escHtml(p.name)}${op.label ? ' · ' + escHtml(op.label) : ''} — ${O.money(op.price)}（${escHtml(O.KIND_LABEL[p.kind] || p.kind)}）</option>`).join('')}</select>
            <button type="button" class="btn btn-outline" id="pd-add-line">＋ 加入品項</button>`
          : '<span class="folder-none">尚無可販售的商品，請先到 <a class="pd-link" href="settings.html">設定</a> 新增商品</span>'}
      </div>
      <div class="ord-editor-foot">
        <div><label>折扣 NT$</label><input class="field" id="pd-ed-discount" type="number" min="0" step="1" value="${escHtml(d.discount)}" placeholder="0"></div>
        <div style="flex:1;min-width:200px;"><label>備註（只有你看得到）</label><input class="field" id="pd-ed-note" type="text" maxlength="500" value="${escHtml(d.note)}" style="width:100%;"></div>
        <button type="button" class="btn btn-accent" id="pd-editor-save">儲存訂單</button>
        <button type="button" class="btn btn-ghost" id="pd-editor-cancel">取消</button>
      </div>
      <div class="ord-err" id="pd-editor-err"></div>
    </div>`;
  }

  // read the editor's inputs back into oc.draft, before a re-render
  function syncDraft() {
    const ed = document.getElementById('pd-order-editor');
    if (!ed || !oc.draft) return;
    ed.querySelectorAll('.ord-line-edit').forEach(row => {
      const l = oc.draft.lines[Number(row.dataset.idx)];
      if (!l) return;
      l.qty = row.querySelector('.ord-qty').value;
      l.price = row.querySelector('.ord-price').value;
      if (row.querySelector('.ord-photo, .ord-photos')) {
        // the checkboxes are the truth for the candidates they list; keys not
        // listed (none) cannot exist, every kept key is a candidate
        l.keys = [...row.querySelectorAll('.ord-photo')].filter(c => c.checked).map(c => c.value);
      }
    });
    oc.draft.discount = document.getElementById('pd-ed-discount').value;
    oc.draft.note = document.getElementById('pd-ed-note').value;
  }

  async function ensureCatalogue() {
    if (oc.catalogue) return;
    const mine = oc;
    const r = await ordersApi('/api/admin/products');
    if (oc !== mine) return;
    if (!r.ok) { mine.catalogue = []; mine.msg._ = O.errorText(r.data, r.status); return; }
    mine.catalogue = (r.data.products || []).filter(p => p.active)
      .map(p => ({ ...p, options: (p.options || []).filter(op => op.active) })).filter(p => p.options.length);
  }

  async function openEditor(orderId) {
    syncDraft();
    oc.msg = {};
    oc.paying = null;
    const o = orderId === 'new' ? null : oc.orders.find(x => x.id === orderId);
    oc.editing = orderId;
    oc.draft = draftFrom(o);
    oc.catalogue = null;
    renderOrders();
    const mine = oc;
    await ensureCatalogue();
    if (oc !== mine || oc.editing !== orderId) return;
    syncDraft();
    renderOrders();
  }

  function editorError(text) {
    const el = document.getElementById('pd-editor-err');
    if (el) el.textContent = text;
  }

  async function saveEditor() {
    syncDraft();
    const d = oc.draft;
    const editingId = oc.editing;
    if (!d.lines.length) { editorError(O.errorText({ code: 'invalid_lines' })); return; }
    const lines = [];
    for (const l of d.lines) {
      if (!/^\d+$/.test(String(l.qty).trim()) || Number(l.qty) < 1 || Number(l.qty) > 999) { editorError(O.errorText({ code: 'invalid_qty' })); return; }
      const price = String(l.price).trim();
      if (price !== '' && !/^\d+$/.test(price)) { editorError(O.errorText({ code: 'invalid_unit_price' })); return; }
      const line = { qty: Number(l.qty), photo_keys: l.keys };
      if (l.id) line.id = l.id; else line.option_id = l.option_id;
      if (price !== '') line.unit_price = Number(price);
      lines.push(line);
    }
    const discRaw = String(d.discount).trim();
    if (discRaw !== '' && !/^\d+$/.test(discRaw)) { editorError(O.errorText({ code: 'invalid_discount' })); return; }
    const body = { lines, discount: discRaw === '' ? 0 : Number(discRaw), note: d.note.trim() };
    const btn = document.getElementById('pd-editor-save');
    if (btn) btn.disabled = true;
    const r = editingId === 'new'
      ? await ordersApi(`/api/admin/projects/${encodeURIComponent(oc.projectId)}/orders`, 'POST', body)
      : await ordersApi(`/api/admin/orders/${encodeURIComponent(editingId)}`, 'PUT', body);
    if (!r.ok) {
      if (btn) btn.disabled = false;
      editorError(O.errorText(r.data, r.status));
      if (r.data && r.data.code === 'conflict') {
        // what is on screen is stale: re-read, and say why the edit is gone
        const text = O.errorText(r.data, r.status);
        await reloadOrders();
        oc.msg._ = text;
        renderOrders();
      }
      return;
    }
    await reloadOrders();
  }

  // a write on an existing order: on failure the sentence goes under that
  // order (a conflict also re-reads, so what is on screen is what is stored)
  async function orderCall(orderId, path, method, body) {
    const r = await ordersApi(path, method, body);
    if (!r.ok) {
      const keepPay = oc.paying;
      await reloadOrders();
      if (keepPay && oc.orders.some(o => o.id === keepPay)) oc.paying = keepPay; // let the amount be corrected
      oc.msg[orderId] = O.errorText(r.data, r.status);
      renderOrders();
      return false;
    }
    await reloadOrders();
    return true;
  }

  document.addEventListener('click', async e => {
    if (!oc || !e.target.closest('#pd-orders')) return;
    const t = e.target;
    if (t.closest('#pd-order-add-btn')) { openEditor('new'); return; }
    if (t.closest('#pd-editor-cancel')) { oc.editing = null; oc.draft = null; renderOrders(); return; }
    if (t.closest('#pd-editor-save')) { await saveEditor(); return; }
    if (t.closest('#pd-add-line')) {
      syncDraft();
      const id = document.getElementById('pd-add-option').value;
      const hit = oc.catalogue.flatMap(p => p.options.map(op => ({ p, op }))).find(x => x.op.id === id);
      if (hit) oc.draft.lines.push({
        option_id: hit.op.id, kind: hit.p.kind, name: hit.op.label ? `${hit.p.name} · ${hit.op.label}` : hit.p.name,
        qty: '1', price: '', catPrice: hit.op.price, keys: [],
      });
      renderOrders();
      return;
    }
    const del = t.closest('[data-line-del]');
    if (del) {
      syncDraft();
      oc.draft.lines.splice(Number(del.closest('.ord-line-edit').dataset.idx), 1);
      renderOrders();
      return;
    }
    const card = t.closest('.ord-card');
    if (!card) return;
    const id = card.dataset.orderId;
    const order = oc.orders.find(o => o.id === id);
    if (!order) return;
    oc.msg = {};
    if (t.closest('[data-order-edit]')) { openEditor(id); return; }
    if (t.closest('[data-pay-open]')) { oc.paying = id; renderOrders(); return; }
    if (t.closest('[data-pay-cancel]')) { oc.paying = null; renderOrders(); return; }
    if (t.closest('[data-pay-save]')) {
      const amountRaw = card.querySelector('.pay-amount').value.trim();
      if (!/^\d+$/.test(amountRaw)) { oc.msg[id] = O.errorText({ code: 'invalid_paid_amount' }); renderOrders(); return; }
      const amount = Number(amountRaw);
      const body = { paid_amount: amount };
      if (amount > 0) {
        body.paid_method = card.querySelector('.pay-method').value;
        const date = card.querySelector('.pay-date').value;
        if (date) body.paid_at = date;
      }
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/payment`, 'POST', body);
      return;
    }
    if (t.closest('[data-pay-clear]')) {
      if (!confirm('確定清除這筆訂單的收款紀錄？')) return;
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/payment`, 'POST', { paid_amount: 0 });
      return;
    }
    if (t.closest('[data-erase-contact]')) {
      if (!confirm(O.ERASE_CONFIRM)) return;
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/erase-contact`, 'POST');
      return;
    }
    const mv = t.closest('[data-status-to]');
    if (mv) {
      const to = mv.dataset.statusTo;
      if (to === 'cancelled' && !confirm(O.CANCEL_CONFIRM)) return;
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/status`, 'POST', { status: to });
    }
  });

  // the 照片（N 張） summary follows the ticks
  document.addEventListener('change', e => {
    const c = e.target.closest && e.target.closest('.ord-photo');
    if (!c) return;
    const row = c.closest('.ord-line-edit');
    row.querySelector('[data-photo-summary]').textContent = `照片（${row.querySelectorAll('.ord-photo:checked').length} 張）`;
  });

  function downloadSelectedKeys(project, selected) {
    const keys = selected.map(s => s.photo_key);
    const askRetouch = confirm(`共 ${keys.length} 張。要同時標記為開始精修嗎？\n（取消 = 只下載清單，不標記；兩種都會下載）`);
    saveBlobAs(new Blob([keys.join('\n') + (keys.length ? '\n' : '')], { type: 'text/plain' }), project, 'txt');
    if (askRetouch) projectAction('start-retouch');
  }

  // 下載需求表: filename, the client's note and the pins, for the retoucher.
  // UTF-8 with a BOM (built in js/selection-export.js) so Excel reads 繁中.
  // No start-retouch question: that stays with 下載選片.
  function downloadSelectionCsv(project, selected) {
    saveBlobAs(new Blob([window.SelectionExport.selectionsToCsv(selected)], { type: 'text/csv;charset=utf-8' }), project, 'csv');
  }

  function saveBlobAs(blob, project, ext, label = 'selected') {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(project.title || 'project').replace(/[\\/:*?"<>|]/g, '_')}-${label}.${ext}`;
    // attached, and the URL outlives the click by a beat — revoking it (or an
    // unattached anchor) immediately can lose the download's filename in some
    // engines, since the click only schedules the download asynchronously
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function renderClients(clients) {
    const tbody = document.getElementById('clients-tbody');
    if (!clients || clients.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty">尚無客戶</td></tr>';
      return;
    }
    tbody.innerHTML = clients.map(c => `
      <tr data-id="${c.id}" data-client-shoot-date="${escHtml(c.shoot_date || '')}">
        <td>${escHtml(c.name)}</td>
        <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${escHtml(c.email)}</td>
        <td>${shootDateCellHTML(c)}</td>
        <td>${shootTypeCellHTML(c)}</td>
        <td>
          <div class="folder-cell">${folderCellHTML(c)}</div>
        </td>
        <td>
          <label class="toggle">
            <input type="checkbox" data-perm="can_book" ${c.can_book ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td>
          <label class="toggle">
            <input type="checkbox" data-perm="can_upload" ${c.can_upload ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td>
          ${c.approved
            ? '<span class="badge badge-approved">已審核</span>'
            : `<span class="badge badge-pending">待審核</span>`}
        </td>
        <td>
          <div class="actions">
            ${!c.approved ? `<button class="btn btn-accent approve-btn" data-id="${c.id}">審核通過</button>` : ''}
            <button class="btn btn-danger delete-btn" data-id="${c.id}">刪除</button>
          </div>
        </td>
      </tr>
    `).join('');

    // Bind events
    tbody.querySelectorAll('input[data-perm]').forEach(input => {
      input.addEventListener('change', async function() {
        const row = this.closest('tr');
        const userId = row.dataset.id;
        const perm = this.dataset.perm;
        const checked = this.checked;
        const otherPerm = perm === 'can_book' ? 'can_upload' : 'can_book';
        const otherInput = row.querySelector(`input[data-perm="${otherPerm}"]`);
        const otherChecked = otherInput ? otherInput.checked : false;
        const body = {
          can_book: perm === 'can_book' ? checked : otherChecked,
          can_upload: perm === 'can_upload' ? checked : otherChecked,
        };
        await patchPermissions(userId, body);
      });
    });

    tbody.querySelectorAll('[data-shoot-date], [data-shoot-tbd], [data-shoot-type], [data-shoot-type-other]')
      .forEach(el => {
        el.addEventListener('change', async function () {
          const row = this.closest('tr');
          if (this.hasAttribute('data-shoot-tbd')) {
            const dateEl = row.querySelector('[data-shoot-date]');
            dateEl.disabled = this.checked;
            if (this.checked) dateEl.value = '';
          }
          if (this.hasAttribute('data-shoot-type')) {
            const other = row.querySelector('[data-shoot-type-other]');
            const isOther = this.value === SHOOT_TYPE_OTHER;
            other.style.display = isOther ? '' : 'none';
            if (isOther) {
              other.focus();
              // 其他 on its own is not a category. Saving here would store the
              // empty box over whatever the client had said.
              if (!other.value.trim()) return;
            } else {
              other.value = '';
            }
          }
          await saveShoot(row);
        });
      });

    tbody.querySelectorAll('[data-add-folder]').forEach(btn => {
      btn.addEventListener('click', () => openFolderPicker(btn.closest('tr').dataset.id));
    });

    tbody.querySelectorAll('[data-remove-folder]').forEach(btn => {
      btn.addEventListener('click', async function () {
        const row = this.closest('tr');
        const gone = this.dataset.removeFolder;
        await saveFolders(row.dataset.id, rowFolders(row).filter(f => f !== gone));
      });
    });

    tbody.querySelectorAll('.approve-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const userId = this.dataset.id;
        this.disabled = true;
        this.textContent = '處理中…';
        try {
          const r = await fetch(`${WORKER_URL}/api/admin/clients/${userId}/approve`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (r.ok) loadClients();
          else this.textContent = '失敗';
        } catch(e) { this.textContent = '失敗'; }
      });
    });

    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const userId = this.dataset.id;
        const row = this.closest('tr');
        const name = row.querySelector('td').textContent;
        if (!confirm(`確定要刪除客戶「${name}」？此操作無法復原。`)) return;
        this.disabled = true;
        try {
          const r = await fetch(`${WORKER_URL}/api/admin/clients/${userId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (r.ok) { row.remove(); return; }
          const d = await r.json().catch(() => ({}));
          clientDeleteFailed(this, `刪除失敗（${d.error || r.status}）`);
        } catch(e) { clientDeleteFailed(this, `刪除失敗：${e.message}`); }
      });
    });
  }

  // The reason goes in the row, next to the button that failed, and the button works again.
  function clientDeleteFailed(btn, msg) {
    btn.disabled = false;
    let err = btn.parentElement.querySelector('.delete-err');
    if (!err) {
      err = document.createElement('div');
      err.className = 'delete-err';
      err.setAttribute('role', 'alert');
      btn.after(err);
    }
    err.textContent = msg;
  }

  async function patchPermissions(userId, body) {
    const token = getToken();
    await fetch(`${WORKER_URL}/api/admin/clients/${userId}/permissions`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  function flashGreen(el) {
    el.style.borderColor = 'var(--success)';
    setTimeout(() => { el.style.borderColor = ''; }, 1500);
  }

  // D1 timestamps come back as raw UTC ISO strings; Tim reads them in Taipei.
  // "9/27 22:52" rather than "2026-09-27T14:52:00.000Z" — no year (every one
  // of these is recent) and no seconds (nobody needs them here).
  // 客人興趣: product names come from our catalogue but go in with textContent anyway
  const INTEREST_KIND = { album: '相本', print: '無框畫' };
  function fillInterests(list) {
    const box = document.getElementById('pd-interests');
    if (!box) return;
    const h = document.createElement('h4');
    h.textContent = '客人興趣';
    const ul = document.createElement('ul');
    for (const it of list) {
      const li = document.createElement('li');
      const name = document.createElement('strong');
      name.textContent = String(it.product_name == null ? '' : it.product_name);
      const kind = document.createElement('span');
      kind.className = 'pd-int-kind';
      kind.textContent = INTEREST_KIND[it.product_kind] || '其他';
      const meta = document.createElement('span');
      meta.className = 'pd-int-meta';
      meta.textContent = `最近 ${fmtTime(it.last_at)}・點 ${Number(it.tap_count) || 1} 次`;
      li.append(name, kind, meta);
      ul.append(li);
    }
    box.replaceChildren(h, ul);
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return Util.fmtDate(iso, 'mdhm') || String(iso);
  }

  // Runs last, now that every function and `let` above it is initialised —
  // showAdmin() reaches into most of them (initCreateForm included).
  if (getToken()) {
    showAdmin();
  }
})();
</script>
<div id="folder-picker" class="picker-overlay" style="display:none;">
  <div class="picker-box">
    <div class="picker-head">
      <strong>選擇資料夾</strong>
      <span id="folder-picker-path" class="folder-raw"></span>
      <span id="folder-picker-head-hint" class="folder-hint"></span>
      <button type="button" class="btn btn-text" id="folder-picker-close">×</button>
    </div>
    <div id="folder-picker-list" class="picker-list"></div>
    <div class="picker-foot">
      <button type="button" class="btn btn-accent" data-confirm-folders>加入所選</button>
    </div>
  </div>
</div>
</body>
</html>
