<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選片專案 — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/revision-rounds-view.css?v=20261031b">
<link rel="stylesheet" href="css/side-nav.css?v=20261031b">
<link rel="stylesheet" href="css/studio-who.css?v=20261031b">
<link rel="stylesheet" href="css/guest-order-card.css?v=20261031b">
<link rel="stylesheet" href="css/album-layout-view.css?v=20261031b">
<style>
  /* Bright theme, shared with home.html / dashboard.html / settings.html — cream
     ground, white cards, dark ink, warm accent, soft pastel pills. The photographer's
     pages all use the same tokens; the client's pages (index.html, client-login.html,
     book_editor/view.html) stay dark. --accent-ink is the one derived token: the amber
     accent is only ~2:1 on white, so amber *text* (links, hints) uses this darker shade
     of it (6.8:1 on white). */
  :root {
    --bg: #fff8ee;
    --surface: #ffffff;
    --card: #fff3df;
    --card-hi: #ffecc9;
    --accent: #f5a13b;
    --accent-shadow: #d6801f;
    --accent-dim: #ffd9a8;
    --accent-ink: #8a4b00;
    --mint: #d6f0e3;
    --peach: #ffd9a8;
    --sky: #cfe3fb;
    --ink-90: #231b12;
    --ink-70: #5b4f42;
    --ink-55: #6b5f50;
    --rule: #efe6d8;
    --border: #efe6d8;
    --danger: #c0392b;
    --success: #1f6b4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { color: var(--ink-90); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; min-height: 100vh; }
  input::placeholder, textarea::placeholder { color: var(--ink-55); opacity: 1; }

  /* Login */
  #login-view { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 2px 10px rgba(90,60,20,.06); padding: 40px 32px; width: 320px; text-align: center; }
  .login-card .brand { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.15em; margin-bottom: 4px; }
  .login-card .subtitle { color: var(--ink-55); font-size: 12px; margin-bottom: 28px; }
  @media (max-width: 780px) { #login-view .field { font-size: 16px; } }   /* 16px: iOS does not zoom the page on focus */

  /* Admin layout */
  #admin-view { display: none; }
  /* One screen at a time (hash-routed, see applyView) — display:none on the
     section itself so a hidden view leaves the layout entirely. */
  .view-section { display: none; }
  .view-section.active { display: block; }
  header { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 52px; }
  header .brand { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.15em; }
  header .subtitle { color: var(--ink-55); font-size: 12px; }
  header .spacer { flex: 1; }
  header .refresh-info { color: var(--ink-55); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }


  main { flex: 1; min-width: 0; padding: 24px; max-width: 1100px; }

  h2 { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 600; margin-bottom: 16px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; }
  thead { background: var(--card); }
  th { padding: 10px 14px; text-align: left; color: var(--ink-70); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  td { padding: 10px 14px; border-top: 1px solid var(--rule); vertical-align: middle; }
  tr:hover td { background: var(--card); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .badge-pending { background: var(--peach); color: var(--ink-90); }
  .badge-approved { background: var(--mint); color: var(--success); }
  /* Status colours (project list + detail header): amber = in progress, coral = needs the
     photographer, green = done / past, grey = everything else. Own class names, each paired
     with .badge for the specificity to beat .badge-approved / .badge-pending; text >= 4.5:1
     on its own background (6:1 and up). */
  .badge.st-progress { background: #ffe3b0; color: #7a4a00; }
  .badge.st-action { background: #ffd9d2; color: #9b1c0c; }
  .badge.st-done { background: #d8f0d2; color: #1f5a1a; }
  .badge.st-neutral { background: #e8e2d8; color: #4a4338; }

  /* Toggle switch */
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--accent-dim); border-radius: 20px; transition: 0.2s; }
  .toggle-slider:before { position: absolute; content: ''; height: 14px; width: 14px; left: 3px; bottom: 3px; background: var(--ink-55); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(16px); background: var(--ink-90); }
  .toggle input:focus-visible + .toggle-slider { outline: 2px solid var(--ink-90); outline-offset: 2px; }

  /* Folder path input */
  .folder-input { background: var(--bg); border: 1px solid var(--rule); color: var(--ink-90); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; width: 160px; outline: none; }
  .folder-input:focus, .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .folder-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .folder-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card);
    border: 1px solid var(--accent-dim); border-radius: 999px; padding: 2px 6px 2px 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .folder-chip button { background: none; border: 0; color: var(--ink-55); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px; }
  .folder-chip button:hover { color: var(--danger); }
  .folder-none { color: var(--ink-55); font-size: 12px; }
  .folder-broken { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .folder-raw { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-55); }
  .picker-overlay { position: fixed; inset: 0; background: rgba(35,27,18,0.45); z-index: 2000;
    align-items: center; justify-content: center; display: flex; }
  .picker-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(90,60,20,.25);
    width: min(520px, 92vw); max-height: 80vh; display: flex; flex-direction: column; }
  .picker-head, .picker-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .picker-head { border-bottom: 1px solid var(--rule); }
  .picker-foot { border-top: 1px solid var(--rule); justify-content: flex-end; }
  .picker-head .btn-text { margin-left: auto; }
  .picker-list { overflow-y: auto; padding: 8px 16px; flex: 1; min-height: 0; }
  .folder-pick-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 5px 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .folder-pick-row .badge { margin-left: auto; }
  .folder-hint { color: var(--accent-ink); font-size: 11px; }
  .shoot-cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .shoot-cell .folder-input { width: 130px; }
  .checkline { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-55);
    font-size: 11px; cursor: pointer; }

  /* Buttons */
  .btn { padding: 5px 12px; border-radius: 999px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-locked:disabled, .btn-locked:disabled:hover { opacity: 1; background: var(--rule); border-color: var(--rule); color: var(--ink-70); }
  .btn:focus-visible, .btn-logout:focus-visible { outline: 2px solid var(--ink-90); outline-offset: 2px; }
  .btn-accent { background: var(--accent); color: var(--ink-90); }
  /* danger sits on white, not peach: --danger on --peach is only 4.1:1 */
  .btn-danger { background: var(--surface); color: var(--danger); border: 1px solid var(--danger); }
  .btn-ghost, .btn-outline { background: transparent; color: var(--ink-70); border: 1px solid var(--accent-dim); }
  .btn-ghost:hover, .btn-outline:hover { border-color: var(--accent); color: var(--ink-90); opacity: 1; }
  .btn-text { background: transparent; color: var(--ink-70); }

  /* Form fields (shared) */
  .field { background: var(--bg); border: 1px solid var(--rule); color: var(--ink-90); padding: 9px 12px; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; width: 100%; }

  /* Error */
  .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }
  .ok-msg { color: var(--success); font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 0; color: var(--ink-55); }

  /* Logout btn */
  .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--ink-55); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .panel { border-radius: 14px; background: var(--surface); box-shadow: 0 2px 10px rgba(90,60,20,.06); margin-bottom: 28px; }
  .panel-body { padding: 16px 18px; }
  .panel-stat { color: var(--ink-90); font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .panel-note { color: var(--ink-55); font-size: 12px; line-height: 1.7; margin: 0 0 8px; }
  .panel-note strong { color: var(--ink-90); font-weight: 600; }
  .panel-result { color: var(--ink-55); font-size: 12px; margin-left: 10px; }

  /* Guest picking — docs/guest-picking.md */
  .pick-admin-field { margin-bottom: 12px; max-width: 420px; }
  .pick-admin-field label { display: block; font-size: 12px; color: var(--ink-55); margin-bottom: 5px; }
  .pick-admin-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .pick-admin-row .pick-admin-field { flex: 1; min-width: 180px; }
  .pick-admin-result { margin-top: 14px; font-size: 12px; color: var(--ink-55); }
  .pick-admin-link-row { display: flex; gap: 8px; margin-top: 6px; }
  .pick-admin-link-row .field { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .proj-recent-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; margin-bottom: 6px; font-size: 13px; }
  /* the whole row opens the project (js below); 開啟 stays for discoverability */
  .proj-recent-row[data-project-row] { cursor: pointer; transition: background .12s, border-color .12s; }
  .proj-recent-row[data-project-row]:hover { background: var(--card); border-color: var(--accent); }
  .proj-recent-row[data-project-row]:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; background: var(--card); }
  /* 攝影類別 tag + list filter bar */
  .pt-tag { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--accent-dim); color: var(--ink-70); vertical-align: middle; }
  .pt-tag[hidden] { display: none; }
  #project-create-panel[hidden] { display: none; }
  .proj-new-btn { min-height: 44px; margin: 0 0 14px; }
  #proj-create-result { margin: 0 0 14px; }
  #proj-copy-link-btn { min-height: 44px; }
  .proj-create-actions .btn { min-height: 44px; }
  /* list row: title line (title + the ONE status badge), meta line, buttons */
  .proj-recent-main { min-width: 0; flex: 1; }
  .proj-row-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proj-row-title .proj-row-name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .proj-row-meta { margin: 2px 0 0; }
  @media (max-width: 768px) {
    .proj-recent-row { flex-direction: column; align-items: stretch; gap: 6px; padding: 10px 12px; }
    .proj-recent-row .actions { flex-wrap: nowrap; }
    .proj-recent-row .actions .btn { flex: 1; min-height: 44px; }
    /* project detail: the action buttons are the main controls on a phone */
    #project-detail-body .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  }
  .pl-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .pl-filter .field { width: auto; padding: 7px 10px; font-size: 13px; }
  .pl-filter #pl-q { flex: 1; min-width: 160px; }
  .pl-archived { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  @media (max-width: 768px) {
    /* two lines: search + 顯示已封存, then 狀態 / 類別 / 排序; a row is the title block and 複製連結 side by side
       (the whole row opens the project, so 開啟 is hidden here and a › shows the row is a way in) */
    .pl-filter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px; }
    .pl-filter #pl-q { grid-column: span 2; min-width: 0; }
    .pl-filter .pl-archived { grid-column: span 1; font-size: 12px; justify-self: end; }
    .pl-filter select.field { min-width: 0; text-overflow: ellipsis; }
    .proj-recent-row { flex-direction: row; align-items: center; gap: 8px; }
    .proj-recent-row .actions { flex: 0 0 auto; }
    .proj-recent-row .actions .btn { flex: 0 0 auto; padding-left: 12px; padding-right: 12px; }
    .proj-recent-row .actions [data-open-project] { display: none; }
    .proj-recent-row[data-project-row]::after { content: '›'; flex: 0 0 auto; color: var(--ink-55); font-size: 22px; line-height: 1; }
  }
  .pl-tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 10px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  .pl-tab { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-70); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .pl-tab[aria-selected="true"] { background: var(--surface); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(35,27,18,.15); }
  .pl-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pl-tab-n { font-weight: 500; color: var(--ink-55); margin-left: 2px; }
  .pl-count { font-size: 12px; color: var(--ink-55); margin-bottom: 8px; min-height: 1em; }
  #proj-type-other { margin-top: 6px; }
  /* 交件 notice dialog */
  /* 轉出精挑相片 XMP dialog */
  .xmp-box { padding: 16px 18px; gap: 10px; overflow-y: auto; }
  .xmp-box h4 { margin: 0; font-size: 15px; }
  .xmp-box .xmp-note { color: var(--ink-55); font-size: 12px; line-height: 1.6; margin: 0; }
  .xmp-box label.xmp-row { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-90); }
  .xmp-box select { min-height: 44px; font-size: 16px; font-family: inherit; padding: 0 10px; border: 1px solid var(--accent-dim); border-radius: 10px; background: var(--surface); color: var(--ink-90); }
  .xmp-box select:disabled { opacity: .5; }
  .xmp-box .xmp-count { font-size: 14px; font-weight: 600; margin: 0; }
  .xmp-box .xmp-warn { color: var(--danger); font-size: 12px; line-height: 1.6; margin: 0; }
  .xmp-box .xmp-caveat { background: var(--card); border-radius: 10px; padding: 8px 10px; }
  .xmp-box .btn { min-height: 44px; }
  .dn-box { padding: 16px 18px; gap: 10px; }
  .dn-box h4 { margin: 0; font-size: 15px; }
  .dn-box .dn-note { color: var(--ink-55); font-size: 12px; line-height: 1.6; margin: 0; }
  .dn-text { width: 100%; min-height: 190px; resize: vertical; font-family: inherit; font-size: 16px; line-height: 1.6;
    background: var(--bg); color: var(--ink-90); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
  .dn-box .dn-set-link { color: var(--accent-ink); display: inline-block; min-height: 44px; line-height: 44px; padding: 0 4px; margin: -12px 0; }
  .dn-actions .btn { min-height: 44px; }
  .dn-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dn-status { color: var(--success); font-size: 13px; font-weight: 600; }
  /* create form: which folder a project will use (js/project-folders.js) and whether it already holds photos */
  .proj-folder-preview { color: var(--ink-70); font-size: 13px; line-height: 1.7; margin: 0 0 6px; overflow-wrap: anywhere; }
  .proj-folder-preview code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-90); }
  .proj-folder-preview .proj-folder-warn { color: var(--accent-ink); }
  .proj-folder-note { color: var(--ink-70); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .proj-folder-note[data-state="existing"] { color: var(--accent-ink); font-weight: 600; }
  /* nothing to create yet: muted but still AA-legible (the generic .btn:disabled opacity would not be) */
  #proj-create-btn:disabled { opacity: 1; background: var(--card-hi); color: var(--ink-70); }
  /* Project detail sections: a title row (title + one-line summary + ▾/▸) that opens and
     closes its body. Closed = display:none on the body container. Everything inside keeps its id. */
  .pd-sec { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); margin: 10px 0 0; }
  #pd-photos .pd-sec { border-width: 1px 0 0; border-radius: 0; background: transparent; margin: 14px 0 0; }
  .pd-sec.pd-sec-off { display: none; }
  #project-detail-panel .pd-sec-h { display: block; margin: 0; font-size: 14px; }
  /* one line: the title button takes what is left, a link at the end (看照片 →) stays on the same line */
  .pd-sec-head { position: relative; display: flex; flex-wrap: nowrap; align-items: center; gap: 0 4px; }
  .pd-sec-head .pd-sec-h { flex: 1 1 0; min-width: 0; }
  .pd-sec-btn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; width: 100%; min-height: 40px;
    padding: 9px 14px; background: transparent; border: 0; border-radius: 12px; text-align: left; cursor: pointer;
    font: inherit; color: var(--ink-90); }
  .pd-sec-btn:hover { background: var(--card); }
  .pd-sec-btn:focus-visible { outline: 2px solid var(--ink-90); outline-offset: -2px; }
  .pd-sec-caret { width: 14px; flex: none; color: var(--ink-55); font-size: 12px; }
  .pd-sec-title { font-weight: 600; font-size: 14px; }
  .pd-sec-sum { flex: 1 1 140px; min-width: 0; color: var(--ink-70); font-size: 12px; font-weight: 400; overflow-wrap: anywhere; }
  .pd-sec-head a.pd-link { flex: none; display: inline-flex; align-items: center; min-height: 44px; margin: 0 6px 0 0; padding: 0 8px; font-size: 12px; white-space: nowrap; color: var(--accent-ink); text-decoration: none; }
  .pd-sec-head a.pd-link:hover { text-decoration: underline; }
  /* 挑選人與連結: line 1 = title + 複製連結 (a sibling of the toggle, pinned right), line 2 = the summary */
  #pd-sec-people .pd-sec-title { flex: 1 1 auto; display: inline-flex; align-items: center; min-height: 44px; }
  /* padding-right = room for the pinned 複製連結 button (~100px at 13px text, wider if its label grows) */
  #pd-sec-people .pd-sec-btn { padding-top: 0; padding-bottom: 6px; padding-right: 118px; }
  #pd-sec-people .pd-sec-sum { flex: 1 1 100%; padding-left: 24px; }
  .pd-sec-copy { position: absolute; top: 0; right: 8px; min-height: 44px; min-width: 44px; padding: 0 12px; white-space: nowrap; line-height: 1.2; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; }
  .pd-sec-copy[aria-disabled="true"], .pd-sec-copy[aria-disabled="true"]:hover { background: var(--rule); border-color: var(--rule); color: var(--ink-70); cursor: default; }
  .pd-sec-copy small { display: block; font-size: 11px; font-weight: 400; }
  .pd-sec.is-collapsed > .pd-sec-body { display: none; }
  .pd-sec-body { padding: 2px 14px 12px; }
  /* the blocks used to be boxes of their own; inside a section they are just its content */
  .pd-sec .pd-block { border: 0; border-radius: 0; padding: 0; margin: 0; }
  .pd-sec .pd-block + .pd-block { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 12px; }
  #project-detail-panel .pd-sec-body h4 { margin: 2px 0 8px; }
  #project-detail-panel .pd-sec-body > .pd-block:first-child > h4:first-child, #project-detail-panel .pd-sec-body > h4:first-child { margin-top: 0; }
  /* leftover blank space: an empty message line, a roomy empty state and the card margin take no room here */
  #project-detail-panel .err:empty, #project-detail-panel .ok-msg:empty { display: none; }
  #project-detail-panel .empty { padding: 8px 0; text-align: left; }
  #project-detail-panel.panel { margin-bottom: 12px; }
  .pd-back-bar { padding: 14px 18px 0; }
  /* page-level back: a text link at the top-left, never a pill (shared convention; upload.html / styles.css / book_editor.css carry their own copy) */

          </div>
          <div class="pick-admin-field">
            <label for="proj-date">拍攝日期</label>
            <input id="proj-date" class="field" type="date">
          </div>
        </div>
        <!-- The folders are named by date + name (js/project-folders.js) and fixed once the
             project exists; R2 only creates a folder when its first photo is uploaded. -->
        <div id="proj-folder-preview" class="proj-folder-preview" aria-live="polite"></div>
        <div id="proj-folder-note" class="proj-folder-note" aria-live="polite" hidden></div>
        <div class="pick-admin-row">
          <div class="pick-admin-field">
            <label for="proj-type">攝影類別</label>
            <select id="proj-type" class="field"></select>
            <input id="proj-type-other" class="field" type="text" maxlength="20" placeholder="自行輸入（最多 20 字）" style="display:none;">
          </div>
        </div>
        <div class="pick-admin-row">
          <div class="pick-admin-field">
            <label for="proj-pick-limit">精修張數上限（留空 = 不限）</label>
            <input id="proj-pick-limit" class="field" type="number" min="0" step="1">
          </div>
          <div class="pick-admin-field">
            <label for="proj-extra-price">加選單價 NT$（留空 = 不顯示）</label>
            <input id="proj-extra-price" class="field" type="number" min="0" step="1">
          </div>
          <div class="pick-admin-field">
            <label for="proj-extra-max">最多可加選（張，0 = 不可加選）</label>
            <input id="proj-extra-max" class="field" type="number" min="0" max="500" step="1">
          </div>
        </div>
        <div class="actions proj-create-actions">
          <button id="proj-create-btn" class="btn btn-accent" type="button">建立專案並產生連結</button>
          <button id="proj-create-cancel" class="btn btn-outline" type="button">取消</button>
        </div>
        <div id="proj-create-err" class="err"></div>
      </div>
    </div>

    <!-- after a create the form closes; this box keeps the link to send (it hides on the next open) -->
    <div id="proj-create-result" class="panel panel-body pick-admin-result" style="display:none;">
      <div>連結已建立，傳給客人開始選片：</div>
      <div class="pick-admin-link-row">
        <input id="proj-link-output" class="field" readonly>
        <button id="proj-copy-link-btn" class="btn btn-outline" type="button">複製連結</button>
      </div>
    </div>

    <h3 style="font-size:14px;margin-bottom:10px;">選片專案列表</h3>
    <div class="pl-tabs" id="pl-tabs" role="tablist" aria-label="專案分頁">
      <button type="button" class="pl-tab" role="tab" data-pl-tab="active" aria-selected="true">進行中 <span class="pl-tab-n" data-pl-tab-n="active"></span></button>
      <button type="button" class="pl-tab" role="tab" data-pl-tab="done" aria-selected="false">已完成 <span class="pl-tab-n" data-pl-tab-n="done"></span></button>
    </div>
    <div class="pl-filter" id="pl-filter">
      <input id="pl-q" class="field" type="search" placeholder="搜尋專案名稱或客戶" aria-label="搜尋專案名稱或客戶" autocomplete="off">
      <label class="pl-archived"><input type="checkbox" id="proj-show-archived-toggle"> 顯示已封存</label>
      <select id="pl-status" class="field" aria-label="狀態"></select>
      <select id="pl-type" class="field" aria-label="攝影類別"></select>
      <select id="pl-sort" class="field" aria-label="排序">
        <option value="default">預設排序</option>
        <option value="me">待我處理優先</option>
      </select>
    </div>
    <div class="pl-count" id="pl-count" aria-live="polite"></div>
    <div class="pl-count" data-pl-search-note style="display:none;">搜尋中：兩個分頁一起找</div>
    <div id="proj-recent-list" style="margin-bottom:24px;"></div>
    </div>

    <div id="project-detail-panel" class="panel" style="display:none;">
      <div class="pd-back-bar"><button id="pd-back-btn" class="back-btn" type="button">← 返回專案列表</button></div>
      <div class="panel-body" id="project-detail-body"></div>
    </div>

    </section>

    <section id="view-clients" class="view-section">
    <h2>客戶列表</h2>
    <div class="table-wrap">
      <table id="clients-table">
        <thead>
          <tr>
            <th>姓名</th>
            <th>Email</th>
            <th>拍攝日期</th>
            <th>拍攝類型</th>
            <th>資料夾路徑</th>
            <th>相本書</th>
            <th>上傳</th>
            <th>審核狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="clients-tbody">
          <tr><td colspan="9" class="empty">載入中…</td></tr>
        </tbody>
      </table>
    </div>
    </section>
  </main>
  </div>
</div>
