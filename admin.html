  // projects.shoot_date (docs/delivery.md, "Shoot date"): 'YYYY-MM-DD' or null. Util.fmtDate reads it as
  // a Taipei day, so a value that is no date at all comes back '' and shows nothing.
  function shootDateOf(project) {
    const v = project && typeof project.shoot_date === 'string' ? project.shoot_date : '';
    return /^\d{4}-\d{2}-\d{2}$/.test(v) ? Util.fmtDate(`${v}T00:00:00+08:00`, 'iso') : '';
  }
  const SHOOT_DATE_ERRORS = {
    invalid_shoot_date: '拍攝日期格式不正確',
    invalid_body: '拍攝日期格式不正確',
    shoot_date_unavailable: '拍攝日期尚未啟用，請先執行 migration（2026-10-07-project-shoot-date.sql）',
  };
  const shootDateError = (data, status) => SHOOT_DATE_ERRORS[data && data.code] || (data && data.error) || `儲存失敗（${status}）`;
  const RENAME_INVALID = '專案名稱格式不正確（1–200 字）';
  const $id = id => document.getElementById(id);

  // The header's one meta line: 拍攝日期 · 攝影類別 · 挑選人. Each part is its own span (textContent only: the
  // type and the picker's name are user text); an empty date or type is left out, separators only between parts.
  function renderHeadMeta() {
    const el = $id('pd-meta');
    const p = currentProject;
    if (!el || !p) return;
    const part = (id, cls, text) => {
      const s = document.createElement('span');
      if (id) s.id = id;
      if (cls) s.className = cls;
      s.textContent = text;
      s.hidden = !text;
      return s;
    };
    const date = part('pd-shoot-text', '', shootDateOf(p));
    date.setAttribute('data-shoot-date', '');
    date.title = '拍攝日期';
    const type = part('pd-type-tag', '', projectTypeOf(p));
    type.title = '攝影類別';
    const owner = part(null, 'pd-owner', `挑選人：${currentOwnerName || '尚無人認領'}`);
    const kids = [];
    for (const s of [date, type, owner]) {
      if (s.hidden) continue;
      if (kids.length) kids.push(document.createTextNode(' · '));
      kids.push(s);
    }
    el.replaceChildren(...kids, ...[date, type].filter(s => s.hidden));
  }

  // ⋯ → 設定: one modal (一般設定 block) for 專案名稱 / 拍攝日期 / 攝影類別 (the folder is shown, never edited: renaming an R2
  // folder is decided against, CLAUDE.md). One 儲存 sends the same PATCH requests the old inline rows sent,
  // one per field that changed, in that order, with the old error messages under each field.
  function editModalHtml(project) {
    const info = PF.rootOfProject(project);
    const folders = Array.isArray(project.folders) ? project.folders : [];
    const list = info && info.proofShaped ? [info.root + '/'] : folders;
    const t = projectTypeOf(project);
    const typed = !!t && !SHOOT_TYPES.includes(t);
    return `<div id="pd-edit-modal" class="picker-overlay" hidden>
      <div class="picker-box pd-edit-box" role="dialog" aria-modal="true" aria-labelledby="pd-edit-h">
        <h4 id="pd-edit-h">專案設定</h4>
        <section class="pd-set-sec" aria-labelledby="pd-set-general-h">
        <h5 id="pd-set-general-h">一般設定</h5>
        <form id="pd-edit-form" class="pd-edit-form" novalidate>
          <div class="pd-edit-field">
            <label for="pd-rename-input">專案名稱</label>
            <input id="pd-rename-input" class="field" type="text" maxlength="200" autocomplete="off">
            <div class="pd-rename-hint">只改專案名稱，資料夾名稱不變</div>
            <div id="pd-rename-err" class="err" role="alert"></div>
          </div>
          <div class="pd-edit-field">
            <label for="pd-shoot-input">拍攝日期</label>
            <input id="pd-shoot-input" class="field" type="date">
            <div id="pd-shoot-err" class="err" role="alert"></div>
          </div>
          <div class="pd-edit-field">
            <label for="pd-type-select">攝影類別</label>
            <select id="pd-type-select" class="field">${projectTypeOptionsHtml(t)}</select>
            <input id="pd-type-other" class="field" type="text" maxlength="20" placeholder="自行輸入（最多 20 字）" aria-label="自行輸入攝影類別"
              value="${escHtml(typed ? t : '')}" style="${typed ? '' : 'display:none;'}">
            <div id="pd-type-err" class="err" role="alert"></div>
          </div>
          ${list.length ? `<div class="pd-edit-folder" id="pd-edit-folder">資料夾：${list.map(f => `<code>${escHtml(f)}</code>`).join('、')}（不能改）</div>` : ''}
          <div class="pd-edit-actions">
            <button id="pd-edit-save" class="btn btn-accent" type="submit">儲存</button>
          </div>
        </form>
        </section>
        <section class="pd-set-sec" aria-labelledby="pd-set-project-h">
          <h5 id="pd-set-project-h">專案設定</h5>
          <div id="pd-proofdl" class="pd-block"></div>
          <div id="pd-plan" class="pd-block"></div>
          <div id="pd-retention" class="pd-block"></div>
        </section>
        <div class="pd-edit-actions"><button id="pd-edit-cancel" class="btn btn-outline" type="button">關閉</button></div>
      </div>
    </div>`;
  }
  const visibleFocusables = root => [...root.querySelectorAll('a[href], button, input, select, textarea')]
    .filter(e => !e.disabled && e.getClientRects().length > 0);
  function editFill() {
    const p = currentProject || {};
    for (const id of ['pd-rename-err', 'pd-shoot-err', 'pd-type-err']) $id(id).textContent = '';
    $id('pd-rename-input').value = p.title || '';
    $id('pd-shoot-input').value = shootDateOf(p);
    const t = projectTypeOf(p), typed = !!t && !SHOOT_TYPES.includes(t);
    $id('pd-type-select').value = typed ? SHOOT_TYPE_OTHER : t;
    const other = $id('pd-type-other');
    other.value = typed ? t : '';
    other.style.display = typed ? '' : 'none';
  }
  function closeEditModal() {
    const modal = $id('pd-edit-modal');
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    $id('pd-more-btn')?.focus();   // 編輯 is a ⋯ menu item now: focus goes back to ⋯
  }
  // 設定 (⋯ menu): the 專案設定 modal. The general form is filled from the project now; the 毛片下載 / 方案 blocks
  // are drawn now too (their inputs show what the project holds at this moment).
  function openEditModal() {
    const modal = $id('pd-edit-modal');
    if (!modal) return;
    editFill();
    renderProofDownloadBlock();
    renderPlanBlock();
    renderRetentionBlock();
    modal.hidden = false;
    const input = $id('pd-rename-input');
    input.focus();
    input.select();
  }
  function wireEditModal() {
    const modal = $id('pd-edit-modal');
    if (!modal || modal.dataset.wired) return;   // an open modal survives a page refresh (renderProjectDetail): wire once
    modal.dataset.wired = '1';
    wireTypePair($id('pd-type-select'), $id('pd-type-other'));
    $id('pd-edit-cancel').addEventListener('click', closeEditModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeEditModal(); });
    modal.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); closeEditModal(); return; }
      if (e.key !== 'Tab') return;
      const f = visibleFocusables(modal);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
    });
    $id('pd-edit-form').addEventListener('submit', e => { e.preventDefault(); saveEdit(); });
  }
  // One PATCH of one field; true when it stuck. The error goes under that field, worded as the old inline row did.
  async function patchProjectField(key, value) {
    const project = currentProject;
    const err = $id({ title: 'pd-rename-err', shoot_date: 'pd-shoot-err', project_type: 'pd-type-err' }[key]);
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(project.id)}`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ [key]: value }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (key === 'title') err.textContent = data && data.code === 'invalid_body' ? RENAME_INVALID : '儲存失敗，請再試一次';
        else if (key === 'shoot_date') err.textContent = shootDateError(data, r.status);
        else err.textContent = PROJECT_TYPE_ERRORS[data && data.code] || (data && data.code === 'invalid_body' ? PROJECT_TYPE_ERRORS.invalid_project_type : null) || (data && data.error) || `儲存失敗（${r.status}）`;
        return false;
      }
      const row = projectsCache.find(x => x.id === project.id);
      if (key === 'title') {
        project.title = typeof data.title === 'string' && data.title ? data.title : value;
        $id('pd-title').textContent = project.title || '（未命名）';
        if (row) { row.title = project.title; drawProjectList(); }
      } else if (key === 'shoot_date') {
        project.shoot_date = data.shoot_date ?? null;
      } else {
        project.project_type = data.project_type ?? null;
        if (row) { row.project_type = project.project_type; drawProjectList(); }
      }
      renderHeadMeta();
      return true;
    } catch (e) {
      err.textContent = key === 'title' ? '儲存失敗，請再試一次' : '無法連線到 Worker';
      return false;
    }
  }
  async function saveEdit() {
    const save = $id('pd-edit-save');
    const project = currentProject;
    if (!save || save.disabled || !project) return;
    for (const id of ['pd-rename-err', 'pd-shoot-err', 'pd-type-err']) $id(id).textContent = '';
    const input = $id('pd-rename-input'), sel = $id('pd-type-select'), other = $id('pd-type-other');
    const title = input.value.trim().slice(0, 200);
    if (!title) { $id('pd-rename-err').textContent = '專案名稱不能空白'; input.focus(); return; }
    const type = projectTypeValue(sel, other);
    if (sel.value === SHOOT_TYPE_OTHER && type === null) { $id('pd-type-err').textContent = '請輸入類別名稱'; other.focus(); return; }
    const date = $id('pd-shoot-input').value || null;   // an emptied field clears it
    const todo = [];
    if (title !== (project.title || '')) todo.push(['title', title]);
    if ((date || '') !== shootDateOf(project)) todo.push(['shoot_date', date]);
    if ((type || '') !== projectTypeOf(project)) todo.push(['project_type', type || null]);   // 未分類 clears it
    save.disabled = true;
    try {
      for (const [k, v] of todo) if (!(await patchProjectField(k, v))) return;
      closeEditModal();
    } finally {
      save.disabled = false;
    }
  }

  // 「⋯」: the actions that are not the stage's main step, as a menu of real buttons. Each runs exactly what its
  // old button ran (same requests, same confirm dialogs). Rebuilt with the status card (renderDeliveryBlock), so
  // 複製交件通知文案 / 取消交件 follow the delivery and 刪除 only shows while there is no submission.
  // An item that does not apply now stays in its place, grayed (aria-disabled, never hidden or removed) with the reason
  // in small text on the item itself (a phone has no hover). A click on it does nothing; the arrow keys pass over it.
  const moreLabel = (text, off) => `<span class="pd-more-label">${text}</span>` + (off ? `<span class="pd-more-reason">${off}</span>` : '');
  function moreItem(id, action, text, off = '', danger = false) {
    return `<button type="button" id="${id}" class="pd-more-item${danger ? ' danger' : ''}${off ? ' is-off' : ''}" role="menuitem" tabindex="-1" data-action="${action}"${off ? ' aria-disabled="true"' : ''}>${moreLabel(text, off)}</button>`;
  }
  // 看全部毛片 is a link; grayed it has no href at all
  function moreViewAll(p, off) {
    const href = off ? ' aria-disabled="true"' : ` href="index.html?project=${encodeURIComponent(p.id)}&amp;mode=all"`;
    return `<a id="pd-view-all-btn" class="pd-more-item${off ? ' is-off' : ''}" role="menuitem" tabindex="-1"${href}>${moreLabel('看全部毛片', off)}</a>`;
  }
  // No 毛片 to look at: the root listing says there is no proofs folder (the 準備中 knowledge), or the project
  // records no folder at all and no listing is on its way. While the listing is still coming nothing is grayed.
  function noProofs(p) {
    const st = proofsState(p);
    if (st === 'none') return true;
    if (st === 'some') return false;
    const t = finalsTarget && finalsTarget.projectId === p.id ? finalsTarget : null;
    return !!t && t.state === 'ready' && !(Array.isArray(p.folders) && p.folders.length);   // listing done (not under way, not failed), nothing recorded
  }
  function renderMoreMenu() {
    const menu = $id('pd-more-menu');
    const p = currentProject;
    if (!menu || !p) return;
    const delivered = !!p.delivered_at;
    // 開放修改 (Worker: back to picking only from a later phase or while delivered) means something only then
    const nothingToReopen = !delivered && (!p.phase || p.phase === 'picking');
    const items = [moreItem('pd-settings-btn', 'settings', '設定')];
    items.push(moreViewAll(p, noProofs(p) ? '還沒有毛片' : ''));
    items.push(moreItem('pd-copy-notice-btn', 'copy-notice', '複製交件通知文案', delivered ? '' : '尚未交件'));
    items.push(moreItem('pd-reopen-btn', 'reopen', '開放修改', nothingToReopen ? '還沒送出選片' : ''));
    items.push(moreItem('pd-undeliver-btn', 'undeliver', '取消交件', delivered ? '' : '尚未交件'));
    items.push('<div class="pd-more-sep" role="separator"></div>');
    items.push(moreItem('pd-reset-seat-btn', 'reset-seat', '重設主人', currentOwnerName ? '' : '還沒有人認領', true));
    // an archived project's 取消封存 is the status card's button
    if (!p.archived_at) items.push(moreItem('pd-archive-btn', 'archive', '封存', '', true));
    items.push(moreItem('pd-delete-btn', 'delete', '刪除', currentSubmissions.length ? '已有送出紀錄，不能刪' : '', true));
    menu.innerHTML = items.join('');
  }
  const moreItems = () => [...($id('pd-more-menu')?.querySelectorAll('[role="menuitem"]:not([aria-disabled="true"])') || [])];
  function setMoreMenu(open, focusButton) {
    const btn = $id('pd-more-btn'), menu = $id('pd-more-menu');
    if (!btn || !menu) return;
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open) moreItems()[0]?.focus();
    else if (focusButton) btn.focus();
  }
  function wireMoreMenu() {
    const btn = $id('pd-more-btn'), menu = $id('pd-more-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', () => setMoreMenu(menu.hidden));
    btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); setMoreMenu(true); } });
    menu.addEventListener('keydown', e => {
      const items = moreItems();
      const i = items.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); setMoreMenu(false, true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length]?.focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length]?.focus(); }
      else if (e.key === 'Home') { e.preventDefault(); items[0]?.focus(); }
      else if (e.key === 'End') { e.preventDefault(); items[items.length - 1]?.focus(); }
      else if (e.key === 'Tab') setMoreMenu(false);
    });
    menu.addEventListener('click', e => {
      const item = e.target.closest('[role="menuitem"]');
      if (!item) return;
      if (item.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }   // grayed: nothing happens, the menu stays
      setMoreMenu(false, true);
      if (item.dataset.action) runMoreAction(item.dataset.action);
    });
  }
  // a click anywhere outside the open menu closes it (installed once; the menu itself is redrawn per project)
  document.addEventListener('click', e => {
    const menu = $id('pd-more-menu');
    if (menu && !menu.hidden && !(e.target.closest && e.target.closest('.pd-more'))) setMoreMenu(false);
  });
  async function runMoreAction(action) {
    if (action === 'settings') {
      openEditModal();
    } else if (action === 'copy-notice') {
      const st = $id('pd-copy-notice-status');
      const ok = await copyText(deliveryNoticeText(currentProject, liveLinkOf(currentTokens)));
      if (!st) return;
      st.textContent = ok ? '已複製' : '複製失敗，請手動複製';
      clearTimeout(st._t);
      st._t = setTimeout(() => { st.textContent = ''; }, 2500);
    } else if (action === 'reopen') {
      // reopen takes a delivery down with it (delivered_at and the client's confirmation are cleared), so say so
      const p = currentProject || {};
      const down = !p.delivered_at ? '' : p.client_confirmed_at
        ? '\n已交件的精修成品會不再顯示，客人的確認也會清除。' : '\n已交件的精修成品會不再顯示。';
      if (!confirm('開放修改後，客人的連結會回到選片畫面，可以重新修改選片；送出紀錄會保留。' + down + '\n確定要開放修改嗎？')) return;
      await projectAction('reopen');
    } else if (action === 'undeliver') {
      if (!confirm('取消交件後，客人的連結會回到選片畫面（唯讀），精修成品不再顯示。確定要取消交件嗎？')) return;
      await projectAction('undeliver');
    } else if (action === 'reset-seat') {
      if (!confirm('確定要重設選片人嗎？選取結果與送出紀錄都會保留。\n新的主人會接手目前所有選片，並可修改或刪除')) return;
      await projectAction('reset-seat');
    } else if (action === 'archive') {
      if (!confirm('封存後連結會立即失效，資料會保留')) return;
      await projectAction('archive'); // refreshes the list too, see projectAction
    } else if (action === 'delete') {
      await deleteProject();
    }
  }
  let deleting = false;
  async function deleteProject() {
    const errEl = $id('pd-action-err');
    if (errEl) errEl.textContent = '';
    if (deleting) return;
    if (!confirm(`確定刪除專案「${currentProject?.title || '未命名'}」？\n此動作無法復原：選取紀錄與分享連結都會一併移除`)) return;
    deleting = true;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (errEl) errEl.textContent = data.code === 'has_submissions'
          ? '已有送出紀錄，無法刪除，請改用封存' : (data.error || `失敗（${r.status}）`);
        return;
      }
      leaveProjectDetail();
      await loadProjectList();
    } catch (e) {
      if (errEl) errEl.textContent = '無法連線到 Worker';
    } finally {
      deleting = false;
    }
  }

  // 挑選人與連結 title row, line 1: a real 複製連結 button beside (not inside) the toggle. It copies the project's first live
  // pick link, the same one the 交件通知 text uses (liveLinkOf); with none it is grayed with its reason. A click only copies.
  function peopleCopyHtml(tokens) {
    const live = (tokens || []).find(t => t.status === 'live');
    return live
      ? `<button type="button" class="btn btn-outline pd-sec-copy" id="pd-sec-people-copy" data-copy-live-link="${escHtml(live.token)}">複製連結</button>`
      : '<button type="button" class="btn btn-outline pd-sec-copy" id="pd-sec-people-copy" aria-disabled="true">複製連結<small>沒有有效連結</small></button>';
  }

  function renderProjectDetail(data) {
    const body = document.getElementById('project-detail-body');
    const project = data.project || {};
    const pickers = data.pickers || [];
    const submissions = data.submissions || [];
    const tokens = data.tokens || [];
    const liveTokens = tokens.filter(t => t.status === 'live'), deadTokens = tokens.filter(t => t.status !== 'live');
    // a dead link (撤銷 / 過期) has no buttons and is dimmed: it only says what it is
    const linkRowHtml = t => `
        <div class="pd-link-row${t.status === 'live' ? '' : ' pd-link-dead'}" data-token-row="${escHtml(t.token)}">
          <div class="pd-link-top">
            <code class="folder-raw pd-link-token">${escHtml(t.token)}</code>
            <div class="actions pd-link-actions">
              ${t.status === 'live' ? `
              <button type="button" class="btn btn-outline" data-copy-link="${escHtml(t.token)}">複製連結</button>
              <button type="button" class="btn btn-danger" data-revoke-token="${escHtml(t.token)}">撤銷</button>` : ''}
            </div>
          </div>
          <div class="pd-link-info">
            <span class="badge ${t.status === 'live' ? 'badge-approved' : 'badge-pending'}">${escHtml(TOKEN_STATUS_LABEL[t.status] || t.status)}</span>
          </div>
        </div>`;
    const selected = (data.selections || []).filter(s => s.rating > 0);
    const ownerName = data.owner ? data.owner.name : null;
    const interests = Array.isArray(data.interests) ? data.interests : [];

    secProject = project;
    // a refresh of the same project (an action's openProjectDetail) must not wipe an open 設定 modal and what is
    // typed in it: the node is carried over to the redrawn page, its two blocks are redrawn below
    const oldModal = $id('pd-edit-modal');
    const keepModal = oldModal && !oldModal.hidden && currentProject && currentProject.id === project.id ? oldModal : null;
    const keepFocusId = keepModal && keepModal.contains(document.activeElement) ? document.activeElement.id : '';
    if (keepModal) keepModal.remove();
    body.innerHTML = `
      <div class="pd-head" id="pd-head">
        <div class="pd-head-main">
          <h3 id="pd-title" data-pd-title>${escHtml(project.title || '（未命名）')}</h3>
          <div class="pd-meta" id="pd-meta"></div>
          ${project.modified_after_submit ? '<div class="pd-head-note">客人已修改，尚未重新送出</div>' : ''}
          ${data.unnotified_submissions ? `<div class="pd-head-note">${escHtml(data.unnotified_submissions)} 次送出未寄信</div>` : ''}
        </div>
        <div class="pd-head-actions">
          <span id="pd-copy-notice-status" class="dn-status" role="status"></span>
          <div class="pd-more">
            <button id="pd-more-btn" class="btn btn-outline pd-head-btn" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="pd-more-menu">⋯</button>
            <div id="pd-more-menu" class="pd-more-menu" role="menu" aria-label="更多動作" hidden></div>
          </div>
        </div>
      </div>
      <div id="pd-action-err" class="err" role="alert"></div>

      <section class="pd-status" id="pd-status" aria-labelledby="pd-status-label">
        <div id="pd-status-head"><span class="pd-status-label" id="pd-status-label"></span><span class="pd-status-next" id="pd-status-next"></span></div>
        <div id="pd-status-body">
          <div class="pd-status-actions" id="pd-status-actions"></div>
          <div id="pd-delivery"></div>
        </div>
      </section>

      <section class="pd-card" id="pd-photos" aria-labelledby="pd-photos-h">
        <h4 id="pd-photos-h">照片</h4>
        <div id="pd-photo-rows"></div>
        <!-- 毛片刪除狀態 (renderRetentionLine) -->
        <p id="pd-expiry" class="pd-expiry" role="status" hidden></p>
        <div class="pd-photos-dl">
          <button id="pd-download-btn" class="btn btn-outline" type="button">下載選片</button>
          <button id="pd-download-csv-btn" class="btn btn-outline" type="button" title="檔名、客人備註、標示（給修圖師）">下載需求表 (CSV)</button>
          <button id="pd-xmp-btn" class="btn btn-outline" type="button" title="給 Lightroom 的 .xmp 檔：星等、色標、旗標">轉出精挑相片 XMP</button>
        </div>
      ${secHtml('selections', `<div id="pd-selections-details"><div class="table-wrap"><table><thead><tr><th>照片</th><th>♥</th><th>備註</th><th>選片人</th><th>更新時間</th></tr></thead>
          <tbody>${selected.length ? selected.map(s => `<tr>
            <td class="folder-raw"><a class="pd-link" href="index.html?project=${encodeURIComponent(project.id)}&amp;photo=${encodeURIComponent(s.photo_key)}">${escHtml(s.photo_key)}</a></td><td>♥</td><td>${escHtml(s.note || '')}</td>
            <td>${escHtml(pickerNameOf(pickers, s.updated_by))}</td><td>${escHtml(fmtTime(s.updated_at))}</td>
          </tr>`).join('') : '<tr><td colspan="5" class="empty">尚無選取</td></tr>'}</tbody></table></div></div>`,
        `<a class="pd-link" href="index.html?project=${encodeURIComponent(project.id)}">看照片 →</a>`)}
      </section>

      <section class="pd-card" id="pd-progress" aria-labelledby="pd-progress-h">
        <h4 id="pd-progress-h">進度</h4>
        <ol class="pd-steps" id="pd-steps"></ol>
      </section>

      ${interests.length ? '<div id="pd-interests" class="pd-block"></div>' : ''}

      ${secHtml('orders', '<div id="pd-orders"><div class="empty">載入中…</div></div>')}

      ${secHtml('people', `<h4>挑選人</h4>
      <div id="pd-pickers">${pickers.length ? pickers.map(p => `<div>${escHtml(p.name)}${p.relationship ? `（${escHtml(p.relationship)}）` : ''}${p.email ? ' · ' + escHtml(p.email) : ''}${data.owner && data.owner.id === p.id ? ' <span class="badge badge-approved">目前選片中</span>' : ''}</div>`).join('') : '<div class="empty">尚無挑選人</div>'}</div>

      <h4>挑選連結</h4>
      <div id="pd-tokens">${tokens.length ? (liveTokens.length ? liveTokens.map(linkRowHtml).join('') : '<div class="empty">沒有有效連結</div>') : '<div class="empty">尚無連結</div>'}${deadTokens.length ? `
        <button type="button" id="pd-dead-links-btn" class="pd-dead-btn" aria-expanded="false" aria-controls="pd-dead-links">另有 ${deadTokens.length} 條已失效</button>
        <div id="pd-dead-links" hidden>${deadTokens.map(linkRowHtml).join('')}</div>` : ''}</div>
      ${project.archived_at ? '' : '<button id="pd-new-link-btn" class="btn btn-outline" type="button" style="margin-top:8px;">產生新連結</button>'}
      <div id="pd-link-err" class="err"></div>`, peopleCopyHtml(tokens))}
      ${editModalHtml(project)}
    `;
    if (keepModal) {
      $id('pd-edit-modal').replaceWith(keepModal);
      if (keepFocusId) $id(keepFocusId)?.focus();
    }
    secData = { selectedCount: selected.length, submissions, pickers, tokens, ownerName };

    // 交件 / 毛片下載 have their own blocks (docs/delivery.md).
    currentProject = project;
    currentTokens = tokens;
    currentOwnerName = ownerName;
    currentSubmissions = submissions;
    currentRevisions = Array.isArray(data.revision_requests) ? data.revision_requests : [];
    renderHeadMeta();
    wireEditModal();
    wireMoreMenu();
    // Delivery state is delivered_at alone. After 取消交件 or 開放修改 the Worker keeps
    // final_folders, so an undelivered project can still carry them: they
    // pre-fill the chooser (editable; nothing is sent until 交件 is pressed).
    finalDraft = lastFinalFolders(project);
    finalEditing = false;
    startFinalsTarget(project);
    fillInterests(interests);
    renderDeliveryBlock();
    renderProofDownloadBlock();
    renderPlanBlock();
    renderRetentionBlock();
    renderRetentionLine();
    body.querySelectorAll('[data-copy-live-link]').forEach(btn => {
      btn.addEventListener('click', () => copyLinkAndShare(btn, project.title, btn.dataset.copyLiveLink, linkStage(project)));
    });
    body.querySelectorAll('[data-copy-link]').forEach(btn => {
      btn.addEventListener('click', () => copyLinkAndShare(btn, project.title, btn.dataset.copyLink, linkStage(project)));
    });
    body.querySelectorAll('[data-revoke-token]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('確定要撤銷這個連結嗎？撤銷後這個連結就無法再開啟。')) return;
        const errEl = document.getElementById('pd-link-err');
        if (errEl) errEl.textContent = '';
        try {
          const r = await fetch(`${WORKER_URL}/api/shares/${encodeURIComponent(btn.dataset.revokeToken)}/revoke`, {
            method: 'POST', headers: { 'Authorization': `Bearer ${getToken()}` },
          });
          if (!r.ok) { const d = await r.json().catch(() => ({})); if (errEl) errEl.textContent = d.error || `失敗（${r.status}）`; return; }
          await openProjectDetail(currentProjectId);
        } catch (e) {
          if (errEl) errEl.textContent = '無法連線到 Worker';
        }
      });
    });
    document.getElementById('pd-dead-links-btn')?.addEventListener('click', function () {
      const box = document.getElementById('pd-dead-links');
      const open = this.getAttribute('aria-expanded') !== 'true';

      box.hidden = !open;

      const errEl = document.getElementById('pd-link-err');
      if (errEl) errEl.textContent = '';
      // making a new link kills the project's other live ones (Worker): say so first; no live link = nothing to kill
      const liveNow = (currentTokens || []).filter(t => t.status === 'live').length;
      if (!confirm(liveNow
        ? '產生新連結後，舊連結會立刻失效，已經拿到舊連結的人要改用新的。選片紀錄不會掉。確定嗎？'
        : '要產生一條新的挑選連結嗎？')) return;
      this.disabled = true;
      try {
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/links`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${getToken()}` },
        });
        const linkData = await r.json().catch(() => ({}));
        if (!r.ok) { if (errEl) errEl.textContent = linkData.error || `失敗（${r.status}）`; return; }
        await openProjectDetail(currentProjectId);
        try { await navigator.clipboard.writeText(projectLink(linkData.token)); } catch (e) { /* best effort */ }
      } catch (e) {
        if (errEl) errEl.textContent = '無法連線到 Worker';
      } finally {
        this.disabled = false;
      }
    });

    document.getElementById('pd-download-csv-btn').addEventListener('click', () => downloadSelectionCsv(project, selected));
    document.getElementById('pd-xmp-btn').addEventListener('click', e => showXmpDialog(project, selected, e.currentTarget));
    initOrders(project, selected.map(x => x.photo_key));

  // ── 交件 (docs/delivery.md) ────────────────────────────────────────────────
  // finalDraft: the folders chosen in the picker but not delivered yet.
  // finalEditing: a delivered project's 更換精修資料夾 chooser is open.
  let currentProject = null;
  let currentTokens = [];   // the open project's pick links, newest first (for the 交件通知文案)
  let currentRevisions = [];   // the guest's 要求修改, newest first (detail.revision_requests)
  let currentOwnerName = null; // the seat holder's name (header meta line)
  let currentSubmissions = []; // newest first (detail.submissions): 進度's date, and 刪除 only while there are none
  let finalDraft = [];
  let finalEditing = false;

  const DELIVER_ERRORS = {
    not_retouching: () => '尚未開始精修，無法交件，請先按「開始精修」',
    too_many_final_folders: d => `精修資料夾最多 ${d.max || 20} 個`,
    invalid_final_folders: () => '精修資料夾不正確，請重新選擇',
    final_overlaps_proofs: d => `「${d.folder || ''}」與毛片資料夾重疊：精修資料夾必須獨立，不能在毛片資料夾裡面，也不能包含毛片資料夾`,
  };

  function chipsHtml(folders, removable) {
    return folders.map(f => `<span class="folder-chip" data-final-chip="${escHtml(f)}">${escHtml(f)}${
      removable ? `<button type="button" data-remove-final="${escHtml(f)}" title="移除">×</button>` : ''}</span>`).join('');
  }

  // The finals the Worker still holds for a project that is NOT delivered
  // (it keeps them across 取消交件 and 開放修改); [] when delivered or none.
  function lastFinalFolders(project) {
    if (project.delivered_at || !Array.isArray(project.final_folders)) return [];
    return project.final_folders.slice();
  }

  // ＋上傳毛片: upload.html on <root>/毛片/, locked there, so a photo cannot land
  // in the wrong project's folder. Only for a project whose proofs follow the
  // convention; an older project keeps uploading through the folder tree.
  function proofsUploadHtml(project) {
    const info = PF.rootOfProject(project);
    if (!info || !info.proofShaped) return '';
    // in 精修 proofs are not uploaded any more: the button stays (the row does not jump) but is disabled, and says why in
    // its text (a disabled button has no focus and may show no tooltip)
    const locked = project.phase === 'retouching';
    return locked
      ? '<button type="button" id="pd-upload-proofs-btn" class="btn btn-outline btn-locked" disabled title="已進入精修階段，不再上傳毛片">＋上傳毛片（已進入精修）</button>'
      : `<a id="pd-upload-proofs-btn" class="btn btn-outline" href="${escHtml(PF.uploadHref(project.id, info.proofFolder, true))}">＋上傳毛片</a>`;
  }

  // ＋上傳精修: upload.html on the next finals folder, locked there. The next one is
  // one past the biggest 精修* that already exists under the project's root, so a
  // second version never lands on (and overwrites) the first. What exists is read
  // from R2, and until that is known — or when it cannot be read — the link names
  // no folder at all and does not lock: choosing by hand is slower than guessing
  // and cannot overwrite anything.
  // An older project (proofs not in <root>/毛片/) keeps the old link, <parent>/精修/,
  // unlocked, with no listing.
  let finalsTarget = null;       // { projectId, state: 'checking' | 'ready' | 'failed', folder, locked }
  let finalsDefaulted = null;    // the newest 精修 folder, once it filled an empty 交件 draft

  function startFinalsTarget(project) {
    finalsDefaulted = null;
    const info = PF.rootOfProject(project);
    if (!info || !info.proofShaped) {
      finalsTarget = { projectId: project.id, state: 'ready', locked: false,
        folder: info ? `${info.root}/${PF.FINAL_NAME}/` : null };
      return;
    }
    // a refresh of the same project re-reads the listing: until it is back the last answer still counts (no 載入中… flash)
    const was = finalsTarget && finalsTarget.projectId === project.id ? finalsTarget : null;
    const mine = finalsTarget = { projectId: project.id, state: 'checking', folder: null, locked: false, prevListed: was ? (was.listed || was.prevListed || null) : null };
    listPrefix(`${info.root}/`).then(listed => {
      if (finalsTarget !== mine) return;     // another project was opened meanwhile
      if (!listed) {
        mine.state = 'failed';
      } else {
        mine.state = 'ready';
        mine.locked = true;
        mine.folder = PF.nextFinalFolder(info.root, listed.folders);
        mine.listed = listed.folders;   // what 精修* versions exist: the 照片 rows and the round's next step
        // 交件 starts on the newest 精修 — but never over a choice already made
        // (a draft the photographer built meanwhile, the last delivery's folders,
        // or a delivery that is up).
        const latest = PF.latestFinalFolder(info.root, listed.folders);
        const p = currentProject;
        if (latest && p && p.id === project.id && !p.delivered_at && !finalEditing &&
            !finalDraft.length && !lastFinalFolders(p).length) {
          finalDraft = [latest];
          finalsDefaulted = latest;
        }
      }
      renderDeliveryBlock();
    });
  }

  function finalsUploadHref(project) {
    const t = finalsTarget && finalsTarget.projectId === project.id ? finalsTarget : null;
    if (!t) return PF.uploadHref(project.id, null, false);
    if (t.state !== 'ready') return PF.uploadHref(project.id, null, false);
    return PF.uploadHref(project.id, t.folder, t.locked);
  }

  // ── 客戶確認 / 要求修改 (docs/delivery.md) ────────────────────────────────
  // Only for a delivered project. The guest's text and name are raw in the
  // JSON: they are put in with textContent (fillRevisionList), never HTML.
  function confirmSectionHtml(project) {
    const confirmed = !!project.client_confirmed_at;
    const open = currentRevisions.filter(r => !r.resolved_at).length;
    const status = confirmed
      ? (project.client_confirmed_by === 'photographer'
        ? `已標記完成（攝影師代為確認）· ${fmtTime(project.client_confirmed_at)}`
        : `客戶已確認完成 · ${fmtTime(project.client_confirmed_at)}`)
      : '客戶尚未確認';
    return `
      <div class="pd-confirm" id="pd-confirm">
        <div id="pd-confirm-status" class="pd-confirm-status${confirmed ? ' done' : ''}">${escHtml(status)}</div>
        ${open > 0 ? `<div class="pd-note" id="pd-revision-hint">${escHtml(revisionHint(roundPlan(project)))}</div>` : ''}
        ${currentRevisions.length ? '<div id="pd-revisions"></div>' : ''}
        ${confirmed ? '' : '<div class="pd-row"><button id="pd-mark-done-btn" class="btn btn-outline" type="button">標記完成</button></div>'}
        <div id="pd-confirm-err" class="err"></div>
      </div>`;
  }
  // what to do about an open round, in words that match the button the card shows
  function revisionHint(plan) {
    if (plan.kind === 'deliver') return `${plan.name} 已上傳：按「交付${plan.name}」交給客人，會自動結案目前的要求`;
    if (plan.name) return `請把新版上傳到 ${plan.name}，上傳後回來按「交付${plan.name}」，會自動結案目前的要求`;
    return '請上傳新版精修資料夾後按「更換精修資料夾」，會自動結案目前的要求';
  }

  // One card per round (js/revision-rounds-view.js): kind, photos, time, the client's note, open or
  // handled; a pins round also lists its photos with read-only pins. Guest strings are textContent only.
  function fillRevisionList(box) {
    const list = box.querySelector('#pd-revisions');
    if (!list) return;
    const ctx = { workerUrl: WORKER_URL, token: getToken, fmtTime, onCsv: downloadRoundCsv };
    // currentRevisions is newest first: the oldest round is 第 1 輪
    list.replaceChildren(...currentRevisions.map((r, i) => window.RevisionRoundsView.renderRound(r, currentRevisions.length - i, ctx)));
  }

  // 下載此輪需求表: the pins of one round for the retoucher (js/selection-export.js revisionToCsv)
  function downloadRoundCsv(round, k) {
    saveBlobAs(new Blob([window.SelectionExport.revisionToCsv(round)], { type: 'text/csv;charset=utf-8' }), currentProject || {}, 'csv', `修改第${k}輪`);
  }

  const MARK_DONE_ERRORS = {
    not_delivered: () => '尚未交件，無法標記完成（頁面可能已過期，請重新整理）',
    confirm_unavailable: () => '資料庫尚未升級（請先跑 migration）',
  };

  // 標記完成: the photographer confirms for a guest who never answers.
  // Updates the page in place from the Worker's answer.
  async function markDone() {
    const btn = document.getElementById('pd-mark-done-btn');
    const errEl = document.getElementById('pd-confirm-err');
    if (errEl) errEl.textContent = '';
    if (!confirm('這是代客戶確認：客戶頁面會顯示已確認完成，目前未處理的修改要求也會一併結案。確定要標記完成嗎？')) return;
    if (btn) btn.disabled = true;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/confirm`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const map = MARK_DONE_ERRORS[data.code];
        if (errEl) errEl.textContent = map ? map(data) : (r.status === 404 ? '找不到專案（可能已被刪除）' : (data.error || `失敗（${r.status}）`));
        if (btn) btn.disabled = false;
        return;
      }
      const at = data.client_confirmed_at;
      currentProject.client_confirmed_at = at;
      currentProject.client_confirmed_by = data.client_confirmed_by;
      currentProject.open_revision_count = 0;
      // the Worker resolves the open requests with the confirmation
      currentRevisions = currentRevisions.map(x => (x.resolved_at ? x : { ...x, resolved_at: at }));
      renderDeliveryBlock();
      await loadProjectList();
    } catch (e) {
      if (errEl) errEl.textContent = '無法連線到 Worker';
      if (btn) btn.disabled = false;
    }
  }

  // ── The status card (Tim 2026-10-19) ─────────────────────────────────────────
  // ONE stage per project, from fields the page already has. Order matters: an archived project is 已封存 whatever
  // else is true; a delivered one is 已完成 once confirmed (client_confirmed_at is only ever set while delivered),
  // else 客人要求修改 while a round is open, else 客人確認中; an undelivered one goes by its phase.
  const STAGE_LABEL = { new: '準備中', picking: '客人選片中', submitted: '選片完成・待精修', retouching: '精修中', awaiting: '客人確認中', done: '已完成', archived: '已封存' };
  // the newest open request and its round number (the oldest request is 第 1 輪); null when none is open
  function openRoundOf(revisions) {
    const i = revisions.findIndex(r => !r.resolved_at);
    return i === -1 ? null : { round: revisions[i], n: revisions.length - i };
  }
  // 準備中: a project nobody could pick from yet. Known only from the listing of its root (a folder exists in R2 once
  // something is in it): proofs folder absent → no 毛片 yet. Unknown (older folder layout, listing not back yet or
  // failed) is never 'new'; a project with a pick, a submission or a phase past picking is never 'new' either.
  // 'none' | 'some' | 'unknown'
  function proofsState(p) {
    const t = finalsTarget && finalsTarget.projectId === p.id ? finalsTarget : null;
    const info = PF.rootOfProject(p);
    if (!info || !info.proofShaped || !t) return 'unknown';
    const listed = t.state === 'ready' && t.locked ? t.listed : t.state === 'checking' ? t.prevListed : null;
    if (!Array.isArray(listed)) return 'unknown';
    return listed.includes(info.proofFolder) ? 'some' : 'none';
  }
  const hasPickActivity = () => !!(secData && secData.selectedCount) || currentSubmissions.length > 0;
  function projectStage(p, revisions) {
    if (p.archived_at) return 'archived';
    if (p.delivered_at) {
      if (p.client_confirmed_at) return 'done';
      if (openRoundOf(revisions)) return 'revising';
      return 'awaiting';
    }
    if (p.phase === 'retouching') return 'retouching';
    if (p.phase === 'submitted') return 'submitted';
    if (!hasPickActivity() && proofsState(p) === 'none') return 'new';
    return 'picking';
  }
  const leafName = f => String(f || '').split('/').filter(Boolean).pop() || '';
  // The next step of an open round, from the 精修* versions R2 holds under the project's root: a version newer than
  // the delivered one already has photos (a folder only exists once something is in it) → deliver it; else upload
  // the next one (nextFinalFolder, never reusing a version). Unknown (an older project, the listing not read yet or
  // failed) → { kind: 'upload', name: null }: the generic ＋上傳精修 link, which names no folder and locks nothing.
  function roundPlan(project) {
    const t = finalsTarget && finalsTarget.projectId === project.id ? finalsTarget : null;
    const info = PF.rootOfProject(project);
    if (!t || t.state !== 'ready' || !t.locked || !info || !info.proofShaped) return { kind: 'upload', name: null, folder: null };
    const latest = PF.latestFinalFolder(info.root, t.listed || []);
    const delivered = Array.isArray(project.final_folders) ? project.final_folders : [];
    if (latest && !delivered.includes(latest)) return { kind: 'deliver', folder: latest, name: leafName(latest) };
    return { kind: 'upload', folder: t.folder, name: leafName(t.folder) };
  }
  function stageNext(stage, p, plan) {
    switch (stage) {
      case 'new': return '下一步：上傳毛片，再把連結給客人';
      case 'picking': return '下一步：等客人送出選片';
      case 'submitted': return '下一步：開始精修（開始後客人不能再改選片）。到「照片」卡下載需求表 (CSV)，交給修圖師';
      case 'retouching': return '下一步：上傳精修後交件';
      case 'awaiting': return '下一步：等客人確認或提出修改';
      case 'revising':
        if (plan.kind === 'deliver') return `下一步：交付${plan.name}給客人`;
        return plan.name ? `下一步：上傳${plan.name}後交付` : '下一步：上傳新版精修後交付';
      case 'done': {
        const d = Util.fmtDate(p.client_confirmed_at, 'iso');
        return p.client_confirmed_by === 'photographer' ? `你已代客人標記完成（${d}）` : `客人已確認（${d}）`;
      }
      case 'archived': return '連結已失效，資料都保留';
      default: return '';
    }
  }
  // 已完成: the card shows only a header button (label + 客人已確認 line + chevron); the rest opens on tap.
  // The open state lives here, per project id, so a refresh re-render does not flip it back mid-session.
  let statusOpen = false, statusOpenFor = null;
  function applyStatusCollapse(stage, p) {
    const head = $id('pd-status-head'), body = $id('pd-status-body');
    const label = $id('pd-status-label'), next = $id('pd-status-next');
    if (statusOpenFor !== p.id) { statusOpenFor = p.id; statusOpen = false; }
    let btn = $id('pd-status-toggle');
    if (stage !== 'done') {
      if (btn) { head.append(label, next); btn.remove(); }
      body.hidden = false;
      return;
    }
    if (!btn) {
      btn = document.createElement('button');
      btn.type = 'button'; btn.id = 'pd-status-toggle'; btn.className = 'pd-status-toggle';
      btn.setAttribute('aria-controls', 'pd-status-body');
      btn.innerHTML = '<span class="pd-status-toggle-text"></span><span class="pd-status-chev" aria-hidden="true">▾</span>';
      btn.querySelector('.pd-status-toggle-text').append(label, next);
      head.append(btn);
      btn.addEventListener('click', () => { statusOpen = !statusOpen; applyStatusCollapse('done', currentProject); });
    }
    btn.setAttribute('aria-expanded', statusOpen ? 'true' : 'false');
    body.hidden = !statusOpen;
  }
  function renderStatusHead(stage, plan) {
    const card = $id('pd-status');
    const p = currentProject;
    if (!card || !p) return;
    const t = finalsTarget && finalsTarget.projectId === p.id ? finalsTarget : null;
    card.dataset.stage = stage;
    card.dataset.target = t ? t.state : 'ready';
    // 準備中 is only claimed once the listing says there is no 毛片; until then a project with nothing on record says 載入中…
    const waiting = stage === 'picking' && t && t.state === 'checking' && !t.prevListed && !hasPickActivity();
    $id('pd-status-label').textContent = waiting ? '載入中…' : stage === 'revising' ? `客人要求修改（第 ${openRoundOf(currentRevisions).n} 輪）` : STAGE_LABEL[stage];
    $id('pd-status-next').textContent = waiting ? '' : stageNext(stage, p, plan);
    const actions = $id('pd-status-actions');
    actions.innerHTML = stage === 'submitted'
      ? '<button id="pd-start-retouch-btn" class="btn btn-accent" type="button" data-primary>開始精修</button>'
      : stage === 'archived' ? '<button id="pd-unarchive-btn" class="btn btn-accent" type="button" data-primary>取消封存</button>' : '';
    actions.querySelector('#pd-start-retouch-btn')?.addEventListener('click', () => projectAction('start-retouch'));
    actions.querySelector('#pd-unarchive-btn')?.addEventListener('click', () => projectAction('unarchive'));
    applyStatusCollapse(stage, p);
  }

  // ── 照片: one row per version ──
  // 毛片 (看 = the review view of every proof, ＋上傳毛片 while it is allowed), then each 精修* version R2 holds
  // under the root, oldest first (or, when that cannot be listed, the project's own finals snapshot), the delivered
  // one marked 客人目前看的版本, and while a round waits for its new version an empty row to upload it into.
  // Counts and dates are not shown: the page does not know them without a listing per folder.
  function finalRowsOf(project) {
    const t = finalsTarget && finalsTarget.projectId === project.id ? finalsTarget : null;
    const info = PF.rootOfProject(project);
    const snapshot = Array.isArray(project.final_folders) ? project.final_folders : [];
    const out = [];
    if (t && t.state === 'ready' && t.locked && info) {
      PF.finalVersions(info.root, t.listed || []).sort((a, b) => a.n - b.n).forEach(v => out.push(v.folder));
    }
    for (const f of snapshot) if (!out.includes(f)) out.push(f);
    return out;
  }
  function renderPhotoRows(stage, plan) {
    const box = $id('pd-photo-rows');
    const p = currentProject;
    if (!box || !p) return;
    const t = finalsTarget && finalsTarget.projectId === p.id ? finalsTarget : null;
    $id('pd-photos').dataset.target = t ? t.state : 'ready';
    const id = encodeURIComponent(p.id);
    const delivered = p.delivered_at && Array.isArray(p.final_folders) ? p.final_folders : [];
    const rows = [`<div class="pd-ver" data-version="proofs"><span class="pd-ver-name">毛片</span>
      ${noProofs(p) ? '<span class="pd-ver-meta">還沒有毛片</span>' : ''}<span class="pd-ver-actions">${noProofs(p) ? '<button type="button" class="btn btn-outline btn-locked" data-view disabled aria-disabled="true" title="還沒有毛片">看</button>' : `<a class="btn btn-outline" data-view href="index.html?project=${id}&amp;mode=all">看</a>`}${proofsUploadHtml(p)}</span></div>`];
    for (const f of finalRowsOf(p)) {
      // 改交這一版: while delivered, on every version the client does not see now (a repeat deliver of just it)
      // (not on an archived project: its links are dead, so 取消封存 comes first)
      const revert = delivered.length && !delivered.includes(f) && !p.archived_at
        ? `<button class="btn btn-outline" type="button" data-revert-version data-folder="${escHtml(f)}">改交這一版</button>` : '';
      rows.push(`<div class="pd-ver" data-version="${escHtml(f)}"><span class="pd-ver-name">${escHtml(leafName(f))}</span>
        ${delivered.includes(f) ? '<span class="pd-ver-current" data-current-version>客人目前看的版本</span>' : ''}
        <span class="pd-ver-actions"><a class="btn btn-outline" data-view href="index.html?project=${id}&amp;mode=finals&amp;folder=${escHtml(encodeURIComponent(f))}">看</a>${revert}</span></div>`);
    }
    if (stage === 'revising' && plan.kind === 'upload' && plan.folder) {
      rows.push(`<div class="pd-ver" data-version="${escHtml(plan.folder)}" data-empty><span class="pd-ver-name">${escHtml(plan.name)}</span>
        <span class="pd-ver-meta">還沒有照片</span>
        <span class="pd-ver-actions"><a class="btn btn-outline" data-version-upload href="${escHtml(PF.uploadHref(p.id, plan.folder, true))}">＋ 上傳</a></span></div>`);
    }
    box.innerHTML = rows.join('');
    box.querySelectorAll('[data-revert-version]').forEach(btn => btn.addEventListener('click', function () {
      const name = leafName(this.dataset.folder);
      const now = delivered.map(leafName).join('、');
      // docs/delivery.md: a repeat deliver replaces the finals, clears the confirmation and resolves the open requests
      if (!confirm(`改交「${name}」給客人？\n\n客人將改看「${name}」，不再看到「${now}」。\n客人已確認完成的狀態會取消（需要客人重新確認），待處理的修改要求會一併結案。\n客人在「${now}」上還沒送出的修改標示不會帶到這一版。`)) return;
      deliverFolders([this.dataset.folder], this);
    }));
  }

  // ── 活動紀錄 (docs/delivery.md, "Activity log"): GET .../events, oldest first. Any failure (no table yet,
  // an old Worker, offline) is [] and 進度 draws exactly as without it. ──
  // 進度 again once the log is here, unless another project was opened (or 返回 pressed) meanwhile
  async function drawProjectLog(id, seq, eventsP) {
    const events = await eventsP;
    if (seq !== openSeq || !detailMode || !currentProject || currentProject.id !== id) return;
    currentEvents = { projectId: id, list: events };
    renderProgress();
  }
  async function fetchProjectEvents(id) {
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(id)}/events`, {
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      if (!r.ok) return [];
      const d = await r.json();
      return Array.isArray(d && d.events) ? d.events.filter(e => e && typeof e.at === 'string' && typeof e.kind === 'string') : [];
    } catch (e) {
      return [];
    }
  }
  const folderNames = fs => (Array.isArray(fs) ? fs.map(leafName).filter(Boolean).join('、') : '');
  // one event's line, or null for a kind this page does not know
  function eventLabel(e) {
    const d = e.data && typeof e.data === 'object' ? e.data : {};
    const names = folderNames(d.final_folders);
    if (e.kind === 'deliver') {
      if (d.repeat) {
        const prev = folderNames(d.previous);
        if (Array.isArray(d.previous) && String(d.final_folders) === String(d.previous)) return names ? `重新交件（${names}）` : '重新交件';
        return `改交${names || '精修'}${prev ? `（原本是${prev}）` : ''}`;
      }
      return names ? `交件（${names}）` : '交件';
    }
    if (e.kind === 'undeliver') return '取消交件';
    if (e.kind === 'reopen') return '開放修改';
    if (e.kind === 'retouch') return '開始精修';
    if (e.kind === 'link_reissued') { const n = Number(d.revoked); return n > 0 ? `重新產生挑選連結（舊連結 ${n} 條失效）` : '產生新挑選連結'; }
    if (e.kind === 'confirm') return e.actor === 'client' ? '客人確認完成' : '已標記完成（代客人）';
    return null;
  }
  // 進度 with the log merged in: the derived steps that are done and every logged event, by time, then the steps
  // still ahead in their usual order. Deduped: the first 交件 whose time is delivered_at is the 交件 step (it takes
  // the event's line, with the folder), the confirmation whose time is client_confirmed_at is the 客人確認 step, and
  // the latest 開始精修 dates the 開始精修 step. No events: exactly progressSteps.
  function progressTimeline(p, submissions, revisions, events) {
    const steps = progressSteps(p, submissions, revisions);
    if (!events.length) return { rows: steps, timed: false };
    const evs = events.map(e => ({ e, label: eventLabel(e) })).filter(x => x.label);
    const take = pred => { const i = evs.findIndex(pred); return i < 0 ? null : evs.splice(i, 1)[0]; };
    const lastRetouch = evs.filter(x => x.e.kind === 'retouch').pop();
    const done = [], ahead = [];
    for (const s of steps) {
      let row = { ...s };
      if (s.step === 'delivered' && s.done && s.at) {
        const ev = take(x => x.e.kind === 'deliver' && x.e.at === s.at);
        if (ev) row.label = ev.label;
      } else if (s.step === 'confirmed' && s.done && s.at) {
        take(x => x.e.kind === 'confirm' && x.e.at === s.at);
      } else if (s.step === 'retouch' && s.done && !s.at && lastRetouch) {
        take(x => x === lastRetouch);
        row.at = lastRetouch.e.at;
      } else if (s.round && s.photos > 0) {
        // with the log the round line says how many photos a pins round marked
        row.label = `客人要求修改（第 ${s.round} 輪，${s.photos} 張）`;
      }
      (s.done ? done : ahead).push(row);
    }
    // by time (parsed, so no string format is assumed); a done step with no time keeps its place after the
    // dated step before it; ties keep their order
    const ms = at => { const t = Date.parse(at); return Number.isFinite(t) ? t : 0; };
    let key = 0;
    const keyed = done.map(row => { if (row.at) key = ms(row.at); return { row, key }; });
    evs.forEach((x, i) => keyed.push({ row: { step: `ev-${x.e.id ?? i}`, kind: x.e.kind, label: x.label, done: true, at: x.e.at, state: 'done' }, key: ms(x.e.at) }));
    keyed.sort((a, b) => a.key - b.key);   // stable: ties keep their order
    return { rows: keyed.map(k => k.row).concat(ahead), timed: true };
  }

  // ── 進度: ✓ done / ● the first step not done / ○ the rest. Dates only where the page has one. ──
  function progressSteps(p, submissions, revisions) {
    const delivered = !!p.delivered_at;
    // one row per submission (oldest first; `sub` / `prev` feed its expandable detail), or the single 客人送出選片 row
    // when none is on record; a project nobody could pick from yet starts with 上傳毛片
    const subs = submissions.slice().reverse();
    const picked = p.phase !== 'picking' || delivered || subs.length > 0;
    const steps = [];
    if (projectStage(p, revisions) === 'new') steps.push({ step: 'proofs', label: '上傳毛片', done: false, at: null });
    if (subs.length) subs.forEach((s, i) => steps.push({ step: i ? `picked-${i + 1}` : 'picked', label: i ? '客人再次送出選片' : '客人送出選片',
      done: true, at: s.created_at, sub: s, prev: i ? subs[i - 1] : null }));
    else steps.push({ step: 'picked', label: '客人送出選片', done: picked, at: null });
    steps.push(
      { step: 'retouch', label: '開始精修', done: p.phase === 'retouching' || delivered, at: null },
      { step: 'delivered', label: '交件', done: delivered, at: p.delivered_at || null });
    revisions.slice().reverse().forEach((r, i) => steps.push({ step: `round-${i + 1}`, label: `客人要求修改（第 ${i + 1} 輪）`, done: !!r.resolved_at, at: r.created_at, round: i + 1, photos: Number(r.photo_count) || 0 }));
    steps.push({ step: 'confirmed', label: p.client_confirmed_by === 'photographer' ? '已標記完成（代客人）' : '客人確認', done: !!p.client_confirmed_at, at: p.client_confirmed_at || null });
    const cur = steps.findIndex(s => !s.done);
    return steps.map((s, i) => ({ ...s, state: s.done ? 'done' : (i === cur ? 'current' : 'next') }));
  }
  const STEP_MARK = { done: ['✓', '已完成'], current: ['●', '目前'], next: ['○', '還沒到'] };
  // the log of the open project only (a project opened before it arrived draws without it)
  let currentEvents = { projectId: null, list: [] };
  // 送出紀錄 lives in 進度: a submission's row opens to its detail (who, how many, what changed since the one before).
  // Closed by default; what is open is remembered per project while the page is open (a redraw keeps it).
  let subOpen = { projectId: null, steps: new Set() };
  function submissionHtml(s, prev) {
    const diff = prev ? projectDiff(s.photo_keys, prev.photo_keys) : null;
    const pinKeys = prev ? marksChangedKeys(s.marks, prev.marks) : [];
    const pinLine = pinKeys.length ? `標示變更 ${pinKeys.length} 張：${pinKeys.map(escHtml).join('、')}` : '';
    const keyLines = diff ? [
      diff.added.length ? `新增 ${diff.added.length} 張：${diff.added.map(escHtml).join('、')}` : '',
      diff.removed.length ? `移除 ${diff.removed.length} 張：${diff.removed.map(escHtml).join('、')}` : '',
      pinLine,
    ].filter(Boolean) : [];
    const diffHtml = !diff ? '<div class="pd-diff">（第一次送出）</div>'
      : (!keyLines.length ? '<div class="pd-diff">與上次相同</div>'
        : `<div class="pd-diff">${keyLines.join('<br>')}</div>`);
    const pickers = (secData && secData.pickers) || [];
    return `<div><strong>${escHtml(fmtTime(s.created_at))}</strong> — ${escHtml(pickerNameOf(pickers, s.picker_id))}
        （${escHtml(s.relationship)}${s.email ? ' · ' + escHtml(s.email) : ''}）— ${escHtml(s.count)} 張${s.pick_limit != null ? ` / 上限 ${escHtml(s.pick_limit)}` : ''}
        ${!s.notified ? '<span class="badge badge-pending">未寄信</span>' : ''}</div>
      ${diffHtml}`;
  }
  function renderProgress() {
    const list = $id('pd-steps');
    const p = currentProject;
    if (!list || !p) return;
    if (subOpen.projectId !== p.id) subOpen = { projectId: p.id, steps: new Set() };
    const events = currentEvents.projectId === p.id ? currentEvents.list : [];
    const { rows, timed } = progressTimeline(p, currentSubmissions, currentRevisions, events);
    // textContent, not an escHtml template: the log's lines carry folder names from the bucket, and this list is
    // the one place on the page that shows them from stored data (docs/delivery.md, "Activity log")
    const span = (cls, text) => { const el = document.createElement('span'); el.className = cls; el.textContent = text; return el; };
    list.replaceChildren(...rows.map(s => {
      const li = document.createElement('li');
      li.dataset.step = s.step;
      li.dataset.state = s.state;
      if (s.kind) li.dataset.kind = s.kind;
      const mark = span('pd-step-mark', STEP_MARK[s.state][0]);
      mark.setAttribute('aria-hidden', 'true');
      // with the log a day can hold several lines: the time too
      li.append(mark, span('sr-only', `${STEP_MARK[s.state][1]}：`), span('pd-step-label', s.label),
        span('pd-step-date', s.at ? (timed ? fmtTime(s.at) : fmtDay(s.at)) : ''));
      if (s.sub) {
        const open = subOpen.steps.has(s.step);
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'pd-step-toggle'; btn.id = `pd-sub-${s.step}-btn`;
        btn.setAttribute('aria-controls', `pd-sub-${s.step}`);
        const detail = document.createElement('div');
        detail.id = `pd-sub-${s.step}`; detail.className = 'pd-submission';
        detail.innerHTML = submissionHtml(s.sub, s.prev);
        const apply = o => { btn.setAttribute('aria-expanded', String(o)); btn.textContent = o ? '收起 ▴' : '詳情 ▾'; detail.hidden = !o; };
        apply(open);
        btn.addEventListener('click', () => {
          const o = btn.getAttribute('aria-expanded') !== 'true';
          if (o) subOpen.steps.add(s.step); else subOpen.steps.delete(s.step);
          apply(o);
        });
        li.append(btn, detail);
      }
      return li;
    }));
  }

  // POST deliver with these finals (a first 交件, 確定更換, or 交付精修二), then redraw and show the 交件通知
  async function deliverFolders(folders, btn) {
    const errEl = $id('pd-deliver-err');
    if (errEl) errEl.textContent = '';
    if (btn) btn.disabled = true;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/deliver`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ final_folders: folders }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const map = DELIVER_ERRORS[data.code];
        if (errEl) errEl.textContent = map ? map(data) : (data.error || `失敗（${r.status}）`);
        if (btn) btn.disabled = false;
        return;
      }
      await Promise.all([openProjectDetail(currentProjectId), loadProjectList()]);
      showDeliverNotice(currentProject, currentTokens);
    } catch (e) {
      if (errEl) errEl.textContent = '無法連線到 Worker';
      if (btn) btn.disabled = false;
    }
  }

  function renderDeliveryBlock() {
    const box = document.getElementById('pd-delivery');
    const project = currentProject;
    if (!box || !project) return;
    const stage = projectStage(project, currentRevisions);
    const plan = roundPlan(project);
    renderStatusHead(stage, plan);
    renderMoreMenu();
    renderPhotoRows(stage, plan);
    renderProgress();
    const delivered = !!project.delivered_at;
    const finals = Array.isArray(project.final_folders) ? project.final_folders : [];
    if (!delivered && project.phase !== 'retouching') { box.style.display = 'none'; box.innerHTML = ''; refreshSecSummaries(); return; }
    box.style.display = '';
    // at most one accent (primary) button in the card; an archived project's primary is 取消封存
    const primaryOk = stage !== 'archived';

    const last = lastFinalFolders(project);
    const showLastHint = last.length > 0 && finalDraft.length === last.length && last.every((f, i) => f === finalDraft[i]);
    const showDefaultHint = !delivered && !!finalsDefaulted && finalDraft.length === 1 && finalDraft[0] === finalsDefaulted;
    const target = finalsTarget && finalsTarget.projectId === project.id ? finalsTarget : null;
    const targetNote = !target ? ''
      : target.state === 'failed'
        ? '<div class="pd-note" id="pd-upload-final-note">無法讀取既有的精修資料夾，所以不自動編號、也不鎖定資料夾；請在上傳頁自己選資料夾（小心不要蓋掉前一版）。</div>'
        : (target.state === 'ready' && target.locked
          ? `<div class="pd-target-hint" id="pd-upload-final-hint">＋上傳精修會放進 <code>${escHtml(target.folder)}</code></div>` : '');
    // 交件 is the primary once there is something to deliver; until then (nothing chosen, nothing uploaded) it is ＋上傳精修
    const deliverMain = primaryOk && finalDraft.length > 0;
    const uploadMain = primaryOk && !delivered && !finalDraft.length;
    const chooser = `
      <div class="pd-note">精修成品必須放在<strong>獨立的資料夾</strong>（例如毛片旁邊的「精修」），不能放在毛片（選片用）資料夾裡面，否則會被拒絕。</div>
      ${showLastHint ? '<div class="pd-note" data-final-last-hint>上次選的精修資料夾（可修改，按「交件」才會生效）：</div>' : ''}
      ${showDefaultHint ? '<div class="pd-note" data-final-default-hint>已預選最新的精修資料夾（可修改，按「交件」才會生效）：</div>' : ''}
      <div id="pd-final-chips">${draftChips()}</div>
      <div class="pd-row">
        <button id="pd-final-pick-btn" class="btn btn-outline" type="button">選擇精修資料夾</button>
        <a id="pd-upload-final-btn" class="btn ${uploadMain ? 'btn-accent' : 'btn-outline'}"${uploadMain ? ' data-primary' : ''} data-target="${target ? target.state : 'ready'}" href="${escHtml(finalsUploadHref(project))}">＋上傳精修</a>
        <button id="pd-deliver-btn" class="btn ${deliverMain ? 'btn-accent' : 'btn-outline'}"${deliverMain ? ' data-primary' : ''} type="button"${finalDraft.length ? '' : ' disabled'}>${delivered ? '確定更換' : '交件'}</button>
        ${delivered ? '<button id="pd-final-cancel-btn" class="btn btn-ghost" type="button">取消</button>' : ''}
      </div>
      ${targetNote}`;
    function draftChips() {
      return finalDraft.length ? chipsHtml(finalDraft, true) : '<span class="folder-none">尚未選擇</span>';
    }
    // an open round: its one next step (upload the next version, or deliver the one already uploaded)
    const roundMain = !primaryOk || stage !== 'revising' || finalEditing ? ''
      : plan.kind === 'deliver'
        ? `<div class="pd-row"><button id="pd-round-deliver-btn" class="btn btn-accent" type="button" data-primary data-folder="${escHtml(plan.folder)}">交付${escHtml(plan.name)}</button></div>`
        : `<div class="pd-row"><a id="pd-round-upload-btn" class="btn btn-accent" data-primary data-target="${target ? target.state : 'ready'}" href="${escHtml(plan.folder ? PF.uploadHref(project.id, plan.folder, true) : finalsUploadHref(project))}">＋上傳${escHtml(plan.name || PF.FINAL_NAME)}</a></div>`;

    if (!delivered) {
      box.innerHTML = `${chooser}<div id="pd-deliver-err" class="err"></div>`;
    } else {
      box.innerHTML = `
        ${roundMain}
        <div class="pd-delivered-line"><span data-delivered-status>已交件</span>
          <span class="folder-none">${escHtml(fmtTime(project.delivered_at))}</span>
          <span id="pd-delivered-folders">${finals.length ? chipsHtml(finals, false)
            : '<span class="folder-none">（舊資料：沒有指定精修資料夾，客人仍看到選片畫面）</span>'}</span></div>
        ${finalEditing ? chooser : `<div class="pd-row">
          <button id="pd-replace-final-btn" class="btn btn-outline" type="button">更換精修資料夾</button>
        </div>`}
        <div id="pd-deliver-err" class="err"></div>
        ${confirmSectionHtml(project)}`;
      fillRevisionList(box);
    }

    refreshSecSummaries();
    box.querySelector('#pd-final-pick-btn')?.addEventListener('click', openFinalFolderPicker);
    box.querySelectorAll('[data-remove-final]').forEach(btn => {
      btn.addEventListener('click', () => {
        finalDraft = finalDraft.filter(f => f !== btn.dataset.removeFinal);
        renderDeliveryBlock();
      });
    });
    box.querySelector('#pd-replace-final-btn')?.addEventListener('click', async () => {
      finalDraft = finals.slice();
      finalEditing = true;
      renderDeliveryBlock();
      await openFinalFolderPicker();
    });
    box.querySelector('#pd-final-cancel-btn')?.addEventListener('click', () => {
      finalEditing = false;
      finalDraft = [];
      renderDeliveryBlock();
    });
    box.querySelector('#pd-mark-done-btn')?.addEventListener('click', markDone);
    box.querySelector('#pd-deliver-btn')?.addEventListener('click', function () { deliverFolders(finalDraft, this); });
    box.querySelector('#pd-round-deliver-btn')?.addEventListener('click', function () {
      const name = leafName(this.dataset.folder);
      if (!confirm(`把「${name}」交給客人？\n客人會看到新版，目前的修改要求會一併結案。`)) return;
      deliverFolders([this.dataset.folder], this);
    });
  }

  // ── 交件後的通知文案 ─────────────────────────────────────────────────────────
  // A ready-to-paste LINE message: where the finals are, what 確認完成 / 需要修改 do. It says
  // nothing about pins (the client cannot pin finals yet). The title is the photographer's
  // free text: it only ever goes through .value / textContent here, never innerHTML.
  function liveLinkOf(tokens) {
    const live = (tokens || []).find(t => t.status === 'live');
    return live ? projectLink(live.token) : '';
  }
  // Dates are always read in Asia/Taipei, whatever the browser's zone; '' when the value is not a date.
  // (The old 照片保存期限 lookup is gone: the R2 lifecycle rule is retired, docs/delivery.md "Photo expiry".)
  function taipeiDateText(iso) {
    const [y, m, d] = Util.fmtDate(iso, 'ymd').split('/');
    return d ? `${y} 年 ${m} 月 ${d} 日` : '';
  }

  // ── 毛片自動刪除 (docs/delivery.md, "Proof retention") ───────────────────
  // currentProject.proof_retention comes with the project detail: {available, days, source, project_days, studio_days,
  // proofs_delete_at, days_left, notice, proofs_deleted_at}. The photo card's line says when the proofs go (and, inside the
  // 14-day window, offers 延後 30 天 / 不要刪); the 專案設定 modal's 毛片保存 field sets the project's own number.
  const RET_ERRORS = {
    proofs_deleted: '毛片已經依設定刪除，不能再修改',
    proofs_not_scheduled: '這個專案沒有設定自動刪除，不需要延後',
    retention_too_long: '保存天數最多 3650 天，不能再延後',
    retention_changed: '設定剛剛被改過，請重新整理再試一次',
    invalid_body: '設定格式不正確',
    proof_retention_unavailable: '毛片自動刪除尚未啟用',
  };
  // POST .../proofs-retention: {ok: true, pr} or {ok: false, message}
  async function postRetention(body) {
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}/proofs-retention`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return { ok: false, message: RET_ERRORS[data.code] || data.error || `失敗（${r.status}）` };
      return data && data.proof_retention ? { ok: true, pr: data.proof_retention } : { ok: false, message: '回應格式不正確' };
    } catch (e) {
      return { ok: false, message: '無法連線到 Worker' };
    }
  }
  function applyRetention(pr) {
    if (!currentProject) return;
    currentProject.proof_retention = pr;
    renderRetentionLine();
    renderRetentionBlock();
  }
  function renderRetentionLine() {
    const el = $id('pd-expiry');
    const project = currentProject;
    if (!el || !project) return;
    const pr = project.proof_retention;
    el.replaceChildren();
    el.classList.remove('pd-expiry--warn');
    let text = '', actions = false;
    if (pr && pr.available) {
      const deletedDay = taipeiDateText(pr.proofs_deleted_at);
      const atDay = taipeiDateText(pr.proofs_delete_at);
      if (deletedDay) text = `毛片已於 ${deletedDay} 依設定刪除`;
      else if (pr.days > 0 && atDay) {
        text = `毛片將於 ${atDay} 刪除${Number.isFinite(pr.days_left) ? `（剩 ${pr.days_left} 天）` : ''}`;
        actions = pr.notice === true;
      }
    }
    if (!text) { el.hidden = true; return; }
    const span = document.createElement('span');
    span.id = 'pd-expiry-text';
    span.textContent = text;
    el.append(span);
    el.classList.toggle('pd-expiry--warn', actions);
    if (actions) {
      const box = document.createElement('span');
      box.className = 'pd-expiry-actions';
      const err = document.createElement('span');
      err.id = 'pd-ret-line-err';
      err.className = 'err';
      err.setAttribute('role', 'alert');
      for (const [id, label, body] of [['pd-ret-postpone', '延後 30 天', { action: 'postpone' }], ['pd-ret-never', '不要刪', { action: 'never' }]]) {
        const b = document.createElement('button');
        b.id = id; b.type = 'button'; b.className = 'btn btn-outline'; b.textContent = label;
        b.addEventListener('click', async () => {
          err.textContent = '';
          box.querySelectorAll('button').forEach(x => { x.disabled = true; });
          const r = await postRetention(body);
          if (r.ok) { applyRetention(r.pr); return; }
          err.textContent = r.message;
          box.querySelectorAll('button').forEach(x => { x.disabled = false; });
        });
        box.append(b);
      }
      el.append(box, err);
    }
    el.hidden = false;
  }
  const RET_PRESETS = [90, 180, 365];
  function retentionChoice(pr) {
    const d = pr.project_days;
    if (d === null || d === undefined) return 'studio';
    if (d === 0) return 'never';
    return RET_PRESETS.includes(d) ? String(d) : 'custom';
  }
  function renderRetentionBlock() {
    const box = $id('pd-retention');
    const project = currentProject;
    if (!box || !project) return;
    const pr = project.proof_retention;
    if (!pr || !pr.available) {
      box.innerHTML = '<h4>毛片保存</h4><div class="pd-note">毛片自動刪除尚未啟用。</div>';
      return;
    }
    const deletedDay = taipeiDateText(pr.proofs_deleted_at);
    if (pr.proofs_deleted_at) {
      box.innerHTML = `<h4>毛片保存</h4>
        <select id="pd-ret-select" class="field" aria-label="毛片保存" disabled><option>已刪除</option></select>
        <div class="pd-note">毛片已於 ${escHtml(deletedDay)} 依設定刪除，不能再修改。精修成品不受影響。</div>`;
      return;
    }
    const studioText = pr.studio_days > 0 ? `${pr.studio_days} 天` : '不自動刪';
    const choice = retentionChoice(pr);
    box.innerHTML = `
      <h4>毛片保存</h4>
      <label for="pd-ret-select">客人確認完成後，毛片保留多久</label>
      <select id="pd-ret-select" class="field">
        <option value="studio">跟工作室設定（目前：${escHtml(studioText)}）</option>
        <option value="never">不自動刪</option>
        ${RET_PRESETS.map(n => `<option value="${n}">客人確認後 ${n} 天</option>`).join('')}
        <option value="custom">自訂天數…</option>
      </select>
      <input id="pd-ret-custom" class="field" type="number" min="14" max="3650" step="1" inputmode="numeric" aria-label="自訂天數（14–3650）" placeholder="14–3650 天"
        value="${choice === 'custom' ? escHtml(pr.project_days) : ''}" ${choice === 'custom' ? '' : 'hidden'}>
      <div class="pd-note">從客人按下確認完成起算；到期前 14 天會提醒你。精修成品不會被刪。</div>
      <button id="pd-ret-save" class="btn btn-accent" type="button">儲存</button>
      <div id="pd-ret-err" class="err" role="alert"></div>
      <div id="pd-ret-ok" class="ok-msg"></div>`;
    const select = box.querySelector('#pd-ret-select');
    const custom = box.querySelector('#pd-ret-custom');
    const errEl = box.querySelector('#pd-ret-err');
    const okEl = box.querySelector('#pd-ret-ok');
    const btn = box.querySelector('#pd-ret-save');
    select.value = choice;
    select.addEventListener('change', () => {
      custom.hidden = select.value !== 'custom';
      if (select.value === 'custom') custom.focus();
    });
    btn.addEventListener('click', async () => {
      errEl.textContent = ''; okEl.textContent = '';
      let want;
      if (select.value === 'studio') want = null;
      else if (select.value === 'never') want = 0;
      else if (select.value === 'custom') {
        const raw = custom.value.trim();
        want = raw === '' ? NaN : Number(raw);
        if (!Number.isInteger(want) || want < 14 || want > 3650) { errEl.textContent = '自訂天數需為 14–3650 的整數'; return; }
      } else want = Number(select.value);
      const before = Number.isInteger(pr.project_days) ? pr.project_days : null;
      if (want === before) { okEl.textContent = '沒有變更'; return; }
      btn.disabled = true; select.disabled = true; custom.disabled = true;
      const r = await postRetention({ days: want });
      if (!r.ok) {
        errEl.textContent = r.message;
        btn.disabled = false; select.disabled = false; custom.disabled = false;
        return;
      }
      applyRetention(r.pr);
      const ok = $id('pd-ret-ok');
      if (ok) ok.textContent = '已儲存';
    });
  }
  function deliveryNoticeText(project, link) {
    const title = String((project && project.title) || '').replace(/[\u0000-\u001F\u007F-\u009F\u2028\u2029]+/g, ' ').trim() || '您的專案';
    return [
      `${title} 的成品已經完成，可以看了！`,
      link ? `請從這個連結查看與下載：\n${link}` : '請從先前傳給您的選片連結查看與下載。',
      '',
      '看完覺得沒問題，請按頁面上的「確認完成」。',
      '如果有想調整的地方，請按「需要修改」，寫下想修改的內容，我會再幫您處理。',
    ].join('\n');
  }
  // Clipboard API first; where it is missing (an insecure context, an old in-app browser) or
  // refuses, select the text in a throw-away textarea and execCommand('copy'). 16px so iOS
  // does not zoom. Resolves true when either path worked.
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through to the selection path */ }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
    document.body.appendChild(ta);
    let ok = false;
    try {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = !!document.execCommand('copy');

  // settings are loaded, or when they cannot be read, it is the built-in default. Fetched once per page (a failure is retried

  let pickLinkTemplate = null, pickLinkTemplateP = null, linkSettings = {};

    if (!pickLinkTemplateP) {

        .then(s => { linkSettings = s || {}; pickLinkTemplate = typeof s.pick_link_message === 'string' ? s.pick_link_message : null; return pickLinkTemplate; })
        .catch(() => { pickLinkTemplateP = null; return null; });

  }
  function shareLinkMessage(title, link, stage) {

  let closeShareDialog = null;   // cleanup of the dialog on screen, so a second open leaves no Esc listener behind
  function showShareLinkDialog(title, token, linkCopied, stage) {

    copy.textContent = '📋 複製這段文字';
    const status = document.createElement('span');
    status.id = 'sl-status';
    status.className = 'dn-status';
    status.setAttribute('role', 'status');
    const close = document.createElement('button');
    close.id = 'sl-close-btn';
    close.type = 'button';
    close.className = 'btn btn-ghost';
    close.textContent = '關閉';
    actions.append(copy, status, close);
    box.append(h, note, ta, tweak, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    // settings not read yet: show the default now, swap in the saved template when it arrives, unless the text was already edited
    let edited = false;
    ta.addEventListener('input', () => { edited = true; });
    if (!loadedAtOpen) {
      loadPickLinkTemplate().then(() => {
        if (!edited && overlay.isConnected && pickLinkTemplateP) ta.value = shareLinkMessage(title || '專案', link, stage);
      });
    }
    const onKey = e => { if (e.key === 'Escape') done(); };
    const done = () => { overlay.remove(); document.removeEventListener('keydown', onKey); if (closeShareDialog === done) closeShareDialog = null; };
    closeShareDialog = done;
    document.addEventListener('keydown', onKey);
    close.addEventListener('click', done);
    overlay.addEventListener('click', e => { if (e.target === overlay) done(); });
    copy.addEventListener('click', async () => {
      const ok = await copyText(ta.value);
      status.textContent = ok ? '已複製' : '複製失敗，請長按文字手動複製';
    });
    copy.focus();

  // 允許客人下載毛片原檔 — PATCH allow_proof_download. The checkbox follows
  // the server's answer, so a refused change puts it back where it was.
  function renderProofDownloadBlock() {
    const box = document.getElementById('pd-proofdl');
    const project = currentProject;
    if (!box || !project) return;
    box.innerHTML = `
      <label class="pd-switch"><input type="checkbox" id="pd-allow-proof-dl"${project.allow_proof_download ? ' checked' : ''}>
        允許客人下載毛片原檔</label>
      <div class="pd-note">開啟後，客人選片時可在預覽下載毛片的原始檔；交件後選片頁不再顯示，但會多一個「下載毛片原檔」入口。預設關閉。</div>
      <div id="pd-proofdl-err" class="err"></div>`;
    const input = box.querySelector('#pd-allow-proof-dl');
    input.addEventListener('change', async () => {
      const errEl = document.getElementById('pd-proofdl-err');
      if (errEl) errEl.textContent = '';
      const want = input.checked;
      input.disabled = true;
      try {
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ allow_proof_download: want }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          input.checked = !want;
          if (errEl) errEl.textContent = data.error || `設定失敗（${r.status}）`;
          return;
        }

      } catch (e) {
        input.checked = !want;

  // 編輯方案 — PATCH pick_limit / extra_price / extra_max (only the keys that
  // changed). Blank 張數 / 加挑單價 → null; blank 最多可加選 → null = NO cap.
  const PLAN_ERRORS = {
    invalid_body: '數值不正確：張數、單價需為 0 以上整數，最多可加選為 0–500',
    archived: '專案已封存，請先取消封存再修改方案',

  };
  function planMaxText(p) {
    if (p.pick_limit == null) return '不限';
    if (p.extra_max == null) return '不限（舊專案未設加選上限）';
    return `${p.pick_limit + p.extra_max} 張（${p.pick_limit} + 加選 ${p.extra_max}）`;

  function renderPlanBlock() {
    const box = document.getElementById('pd-plan');
    const project = currentProject;
    if (!box || !project) return;
    const val = v => (v == null ? '' : String(v));
    box.innerHTML = `
      <h4>編輯方案</h4>
      <div class="pick-admin-row">
        <div class="pick-admin-field">
