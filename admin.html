        <div class="pick-admin-field">
          <label for="pd-plan-price">加挑單價 NT$（留空 = 不顯示）</label>
          <input id="pd-plan-price" class="field" type="number" min="0" step="1" value="${escHtml(val(project.extra_price))}">
        </div>
        <div class="pick-admin-field">
          <label for="pd-plan-extra">最多可加選（張，留空 = 不限制，0 = 不可加選）</label>

        </div>
      </div>
      <div id="pd-plan-result" class="pd-note">客人最多可挑：${escHtml(planMaxText(project))}${project.extra_max == null ? '　最多可加選：不限制（舊專案）' : ''}</div>
      <div class="pd-note">已送出的紀錄維持送出當時的方案，修改只影響之後的送出。</div>
      <button id="pd-plan-save" class="btn btn-accent" type="button">儲存方案</button>
      <div id="pd-plan-err" class="err"></div>
      <div id="pd-plan-ok" class="ok-msg"></div>`;
    const errEl = box.querySelector('#pd-plan-err');
    const okEl = box.querySelector('#pd-plan-ok');
    const btn = box.querySelector('#pd-plan-save');
    btn.addEventListener('click', async () => {
      errEl.textContent = ''; okEl.textContent = '';
      const read = (id, max) => {
        const raw = box.querySelector(id).value.trim();
        if (raw === '') return { v: null };
        const n = Number(raw);
        return (Number.isInteger(n) && n >= 0 && n <= max) ? { v: n } : { bad: true };
      };
      const fields = [
        ['pick_limit', read('#pd-plan-limit', Number.MAX_SAFE_INTEGER), '精修張數上限需為 0 以上整數'],
        ['extra_price', read('#pd-plan-price', 10000000), '加挑單價需為 0 以上整數'],
        ['extra_max', read('#pd-plan-extra', 500), '最多可加選需為 0–500 的整數'],
      ];
      const body = {};
      for (const [key, res, msg] of fields) {
        if (res.bad) { errEl.textContent = msg; return; }
        const before = project[key] == null ? null : project[key];
        if (res.v !== before) body[key] = res.v;
      }
      if (!Object.keys(body).length) { okEl.textContent = '沒有變更'; return; }
      btn.disabled = true;
      try {
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          errEl.textContent = PLAN_ERRORS[data.code] || data.error || `儲存失敗（${r.status}）`;
          btn.disabled = false;
          return;

        const ok = document.getElementById('pd-plan-ok');
        if (ok) ok.textContent = '已儲存';
      } catch (e) {
        errEl.textContent = '無法連線到 Worker';
        btn.disabled = false;
      }
    });
  }

        ? oc.orders.map(o => (editingOrder && editingOrder.id === o.id) ? editorHtml(o) : orderCardHtml(o)).join('')
        : '<div class="folder-none" id="pd-orders-empty">尚無訂單</div>'}</div>
      ${editingNew ? editorHtml(null) : ''}
      ${oc.editing ? '' : '<button type="button" id="pd-order-add-btn" class="btn btn-outline" style="margin-top:6px;">＋ 新增訂單</button>'}
      <div class="ord-err" id="pd-order-err">${escHtml(oc.msg._ || '')}</div>`;
    // a guest order's contact card is built with textContent (js/orders-common.js), not into the string above
    for (const o of oc.orders) {
      const card = O.guestCard(o);
      const slot = card && box.querySelector(`.ord-card[data-order-id="${CSS.escape(o.id)}"] [data-guest-slot]`);
      if (slot) slot.replaceWith(card);
    }
    refreshSecSummaries();
  }

  // ── editor (new order, or the lines/discount/note of an existing one) ──
  function draftFrom(o) {
    return {
      lines: o ? o.items.map(i => ({
        id: i.id, kind: i.kind, name: O.lineName(i), qty: String(i.qty), price: String(i.unit_price), catPrice: i.unit_price,
        keys: (i.photo_keys || []).slice(),
      })) : [],
      discount: o ? String(o.discount) : '',
      note: o ? o.note || '' : '',
    };
  }

  function editorHtml(o) {
    const d = oc.draft;
    const cat = oc.catalogue;
    const lineHtml = d.lines.map((l, idx) => {
      const photoable = l.kind === 'print' || l.kind === 'album';
      const cand = [...new Set([...oc.picks, ...l.keys])];
      return `<div class="ord-line-edit" data-idx="${idx}">
        <div class="ord-line-name">${escHtml(l.name)} <span class="badge badge-pending">${escHtml(O.KIND_LABEL[l.kind] || l.kind)}</span>
          ${photoable ? `<details><summary class="ord-keys" data-photo-summary>照片（${l.keys.length} 張）</summary>
            <div class="ord-photos">${cand.length ? cand.map(k => `<label><input type="checkbox" class="ord-photo" value="${escHtml(k)}"${l.keys.includes(k) ? ' checked' : ''}>${escHtml(k)}</label>`).join('')
              : '<span class="folder-none">專案尚無選取的照片</span>'}</div></details>` : ''}
        </div>
        <div><label>數量</label><input class="field ord-qty" type="number" min="1" max="999" step="1" value="${escHtml(l.qty)}"></div>
        <div><label>單價 NT$</label><input class="field ord-price" type="number" min="0" step="1" placeholder="${escHtml(l.catPrice)}" value="${escHtml(l.price)}"></div>
        <button type="button" class="btn btn-ghost" data-line-del>移除</button>
      </div>`;
    }).join('');
    const options = cat ? cat.flatMap(p => p.options.map(op => ({ p, op }))) : [];
    return `<div class="ord-editor" id="pd-order-editor" data-mode="${o ? 'edit' : 'new'}"${o ? ` data-order-id="${escHtml(o.id)}"` : ''}>
      <strong>${o ? '編輯訂單' : '新增訂單'}</strong>
      <div id="pd-editor-lines">${lineHtml || '<div class="folder-none">尚未加入品項</div>'}</div>
      <div class="ord-editor-add">
        ${cat === null ? '<span class="folder-none">載入商品中…</span>'
          : options.length ? `<select class="field" id="pd-add-option">${options.map(({ p, op }) =>
              `<option value="${escHtml(op.id)}">${escHtml(p.name)}${op.label ? ' · ' + escHtml(op.label) : ''} — ${O.money(op.price)}（${escHtml(O.KIND_LABEL[p.kind] || p.kind)}）</option>`).join('')}</select>
            <button type="button" class="btn btn-outline" id="pd-add-line">＋ 加入品項</button>`
          : '<span class="folder-none">尚無可販售的商品，請先到 <a class="pd-link" href="settings.html">設定</a> 新增商品</span>'}
      </div>
      <div class="ord-editor-foot">
        <div><label>折扣 NT$</label><input class="field" id="pd-ed-discount" type="number" min="0" step="1" value="${escHtml(d.discount)}" placeholder="0"></div>
        <div style="flex:1;min-width:200px;"><label>備註（只有你看得到）</label><input class="field" id="pd-ed-note" type="text" maxlength="500" value="${escHtml(d.note)}" style="width:100%;"></div>
        <button type="button" class="btn btn-accent" id="pd-editor-save">儲存訂單</button>
        <button type="button" class="btn btn-ghost" id="pd-editor-cancel">取消</button>
      </div>
      <div class="ord-err" id="pd-editor-err"></div>
    </div>`;
  }

  // read the editor's inputs back into oc.draft, before a re-render
  function syncDraft() {
    const ed = document.getElementById('pd-order-editor');
    if (!ed || !oc.draft) return;
    ed.querySelectorAll('.ord-line-edit').forEach(row => {
      const l = oc.draft.lines[Number(row.dataset.idx)];
      if (!l) return;
      l.qty = row.querySelector('.ord-qty').value;
      l.price = row.querySelector('.ord-price').value;
      if (row.querySelector('.ord-photo, .ord-photos')) {
        // the checkboxes are the truth for the candidates they list; keys not
        // listed (none) cannot exist, every kept key is a candidate
        l.keys = [...row.querySelectorAll('.ord-photo')].filter(c => c.checked).map(c => c.value);
      }
    });
    oc.draft.discount = document.getElementById('pd-ed-discount').value;
    oc.draft.note = document.getElementById('pd-ed-note').value;
  }

  async function ensureCatalogue() {
    if (oc.catalogue) return;
    const mine = oc;
    const r = await ordersApi('/api/admin/products');
    if (oc !== mine) return;
    if (!r.ok) { mine.catalogue = []; mine.msg._ = O.errorText(r.data, r.status); return; }
    mine.catalogue = (r.data.products || []).filter(p => p.active)
      .map(p => ({ ...p, options: (p.options || []).filter(op => op.active) })).filter(p => p.options.length);
  }

  async function openEditor(orderId) {
    syncDraft();
    oc.msg = {};
    oc.paying = null;
    const o = orderId === 'new' ? null : oc.orders.find(x => x.id === orderId);
    oc.editing = orderId;
    oc.draft = draftFrom(o);
    oc.catalogue = null;
    renderOrders();
    const mine = oc;
    await ensureCatalogue();
    if (oc !== mine || oc.editing !== orderId) return;
    syncDraft();
    renderOrders();
  }

  function editorError(text) {
    const el = document.getElementById('pd-editor-err');
    if (el) el.textContent = text;
  }

  async function saveEditor() {
    syncDraft();
    const d = oc.draft;
    const editingId = oc.editing;
    if (!d.lines.length) { editorError(O.errorText({ code: 'invalid_lines' })); return; }
    const lines = [];
    for (const l of d.lines) {
      if (!/^\d+$/.test(String(l.qty).trim()) || Number(l.qty) < 1 || Number(l.qty) > 999) { editorError(O.errorText({ code: 'invalid_qty' })); return; }
      const price = String(l.price).trim();
      if (price !== '' && !/^\d+$/.test(price)) { editorError(O.errorText({ code: 'invalid_unit_price' })); return; }
      const line = { qty: Number(l.qty), photo_keys: l.keys };
      if (l.id) line.id = l.id; else line.option_id = l.option_id;
      if (price !== '') line.unit_price = Number(price);
      lines.push(line);
    }
    const discRaw = String(d.discount).trim();
    if (discRaw !== '' && !/^\d+$/.test(discRaw)) { editorError(O.errorText({ code: 'invalid_discount' })); return; }
    const body = { lines, discount: discRaw === '' ? 0 : Number(discRaw), note: d.note.trim() };
    const btn = document.getElementById('pd-editor-save');
    if (btn) btn.disabled = true;
    const r = editingId === 'new'
      ? await ordersApi(`/api/admin/projects/${encodeURIComponent(oc.projectId)}/orders`, 'POST', body)
      : await ordersApi(`/api/admin/orders/${encodeURIComponent(editingId)}`, 'PUT', body);
    if (!r.ok) {
      if (btn) btn.disabled = false;
      editorError(O.errorText(r.data, r.status));
      if (r.data && r.data.code === 'conflict') {
        // what is on screen is stale: re-read, and say why the edit is gone
        const text = O.errorText(r.data, r.status);
        await reloadOrders();
        oc.msg._ = text;
        renderOrders();
      }
      return;
    }
    await reloadOrders();
  }

  // a write on an existing order: on failure the sentence goes under that
  // order (a conflict also re-reads, so what is on screen is what is stored)
  async function orderCall(orderId, path, method, body) {
    const r = await ordersApi(path, method, body);
    if (!r.ok) {
      const keepPay = oc.paying;
      await reloadOrders();
      if (keepPay && oc.orders.some(o => o.id === keepPay)) oc.paying = keepPay; // let the amount be corrected
      oc.msg[orderId] = O.errorText(r.data, r.status);
      renderOrders();
      return false;
    }
    await reloadOrders();
    return true;
  }

  document.addEventListener('click', async e => {
    if (!oc || !e.target.closest('#pd-orders')) return;
    const t = e.target;
    if (t.closest('#pd-order-add-btn')) { openEditor('new'); return; }
    if (t.closest('#pd-editor-cancel')) { oc.editing = null; oc.draft = null; renderOrders(); return; }
    if (t.closest('#pd-editor-save')) { await saveEditor(); return; }
    if (t.closest('#pd-add-line')) {
      syncDraft();
      const id = document.getElementById('pd-add-option').value;
      const hit = oc.catalogue.flatMap(p => p.options.map(op => ({ p, op }))).find(x => x.op.id === id);
      if (hit) oc.draft.lines.push({
        option_id: hit.op.id, kind: hit.p.kind, name: hit.op.label ? `${hit.p.name} · ${hit.op.label}` : hit.p.name,
        qty: '1', price: '', catPrice: hit.op.price, keys: [],
      });
      renderOrders();
      return;
    }
    const del = t.closest('[data-line-del]');
    if (del) {
      syncDraft();
      oc.draft.lines.splice(Number(del.closest('.ord-line-edit').dataset.idx), 1);
      renderOrders();
      return;
    }
    const card = t.closest('.ord-card');
    if (!card) return;
    const id = card.dataset.orderId;
    const order = oc.orders.find(o => o.id === id);
    if (!order) return;
    oc.msg = {};
    if (t.closest('[data-order-edit]')) { openEditor(id); return; }
    if (t.closest('[data-pay-open]')) { oc.paying = id; renderOrders(); return; }
    if (t.closest('[data-pay-cancel]')) { oc.paying = null; renderOrders(); return; }
    if (t.closest('[data-pay-save]')) {
      const amountRaw = card.querySelector('.pay-amount').value.trim();
      if (!/^\d+$/.test(amountRaw)) { oc.msg[id] = O.errorText({ code: 'invalid_paid_amount' }); renderOrders(); return; }
      const amount = Number(amountRaw);
      const body = { paid_amount: amount };
      if (amount > 0) {
        body.paid_method = card.querySelector('.pay-method').value;
        const date = card.querySelector('.pay-date').value;
        if (date) body.paid_at = date;
      }
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/payment`, 'POST', body);
      return;
    }
    if (t.closest('[data-pay-clear]')) {
      if (!confirm('確定清除這筆訂單的收款紀錄？')) return;
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/payment`, 'POST', { paid_amount: 0 });
      return;
    }
    if (t.closest('[data-erase-contact]')) {
      if (!confirm(O.ERASE_CONFIRM)) return;
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/erase-contact`, 'POST');
      return;
    }
    const mv = t.closest('[data-status-to]');
    if (mv) {
      const to = mv.dataset.statusTo;
      if (to === 'cancelled' && !confirm(O.CANCEL_CONFIRM)) return;
      await orderCall(id, `/api/admin/orders/${encodeURIComponent(id)}/status`, 'POST', { status: to });
    }
  });

  // the 照片（N 張） summary follows the ticks
  document.addEventListener('change', e => {
    const c = e.target.closest && e.target.closest('.ord-photo');
    if (!c) return;
    const row = c.closest('.ord-line-edit');
    row.querySelector('[data-photo-summary]').textContent = `照片（${row.querySelectorAll('.ord-photo:checked').length} 張）`;
  });

  function downloadSelectedKeys(project, selected) {
    const keys = selected.map(s => s.photo_key);
    const askRetouch = confirm(`共 ${keys.length} 張。要同時標記為開始精修嗎？\n（取消 = 只下載清單，不標記；兩種都會下載）`);
    saveBlobAs(new Blob([keys.join('\n') + (keys.length ? '\n' : '')], { type: 'text/plain' }), project, 'txt');
    if (askRetouch) projectAction('start-retouch');
  }

  // 下載需求表: filename, the client's note and the pins, for the retoucher.
  // UTF-8 with a BOM (built in js/selection-export.js) so Excel reads 繁中.
  // No start-retouch question: that stays with 下載選片.
  function downloadSelectionCsv(project, selected) {
    saveBlobAs(new Blob([window.SelectionExport.selectionsToCsv(selected)], { type: 'text/csv;charset=utf-8' }), project, 'csv');
  }

  // 轉出精挑相片 XMP (js/xmp-export.js): Lightroom sidecars for the photos the client picked.
  // The settings live only in this dialog and in this browser's localStorage; nothing goes to the Worker.
  const XMP_KEY = 'xmp_export_settings_v1';
  function loadXmpSettings() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(XMP_KEY)); } catch (e) { raw = null; }
    return window.XmpExport.normalizeSettings(raw);
  }
  function saveXmpSettings(settings) {
    try { localStorage.setItem(XMP_KEY, JSON.stringify(settings)); } catch (e) { /* storage unavailable: the dialog still works */ }
  }
  let closeXmpDialog = null;
  function showXmpDialog(project, selected, opener) {
    if (closeXmpDialog) closeXmpDialog();
    const X = window.XmpExport;
    const settings = loadXmpSettings();
    const mk = (tag, props = {}, text) => { const el = document.createElement(tag); Object.assign(el, props); if (text !== undefined) el.textContent = text; return el; };
    const overlay = mk('div', { id: 'pd-xmp-dialog', className: 'picker-overlay' });
    const box = mk('div', { className: 'picker-box xmp-box' });
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'xmp-title');
    const h = mk('h4', { id: 'xmp-title' }, '轉出精挑相片 XMP');
    const intro = mk('p', { className: 'xmp-note' }, '給 Lightroom 的 .xmp 檔，只轉出客人挑的照片。只會有星等、色標、旗標，不含客人的備註。設定只存在這個瀏覽器，不會送到伺服器。');
    const selectRow = (id, label, options, value) => {
      const row = mk('label', { className: 'xmp-row' }, label);
      row.htmlFor = id;
      const sel = mk('select', { id });
      for (const [v, t] of options) sel.appendChild(mk('option', { value: String(v) }, t));
      sel.value = String(value);
      row.appendChild(sel);
      return [row, sel];
    };
    const colours = X.LABELS.map(c => [c, `${X.LABEL_ZH[c]}色 (${c})`]);
    const [ratingRow, ratingSel] = selectRow('xmp-rating', '星等', [['off', '不設定'], ['follow', '跟客人的星等'], ...[1, 2, 3, 4, 5].map(n => [n, `固定 ${n} 星`])], settings.rating);
    const [labelRow, labelSel] = selectRow('xmp-label', '色標', [['off', '不設定'], ...colours], settings.label);
    const [pinsRow, pinsSel] = selectRow('xmp-label-pins', '有修改標示（釘子）的照片改用', [['same', '跟上面一樣'], ...colours], settings.labelPins);
    const [flagRow, flagSel] = selectRow('xmp-flag', '旗標', [['off', '不設定'], ['pick', 'Pick（選取）']], settings.flag);
    const count = mk('p', { id: 'xmp-count', className: 'xmp-count' });
    count.setAttribute('role', 'status');
    const warn = mk('div', { id: 'xmp-warn' });
    const caveat = mk('p', { className: 'xmp-note xmp-caveat' }, '請不要解壓縮到已經有 .xmp 的資料夾，同名檔會蓋掉 Lightroom 的修圖設定。放在 RAW 旁邊、檔名相同，然後在 Lightroom 選照片 → 中繼資料 → 從檔案讀取中繼資料。旗標 (Pick) 還沒用真正的 Lightroom 驗證過，請先拿一張照片試試。');
    const err = mk('p', { id: 'xmp-err', className: 'xmp-warn' });
    err.setAttribute('role', 'alert');
    const actions = mk('div', { className: 'dn-actions' });
    const dl = mk('button', { id: 'xmp-download', type: 'button', className: 'btn btn-accent' }, '下載 zip');
    const close = mk('button', { id: 'xmp-close', type: 'button', className: 'btn btn-ghost' }, '關閉');
    actions.append(dl, close);
    box.append(h, intro, ratingRow, labelRow, pinsRow, flagRow, count, warn, caveat, err, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const current = () => X.normalizeSettings({ rating: ratingSel.value, label: labelSel.value, labelPins: pinsSel.value, flag: flagSel.value });
    const pickedCount = (selected || []).filter(x => x && x.rating >= 1).length;
    const warnLine = text => warn.appendChild(mk('p', { className: 'xmp-warn' }, text));
    const names = list => list.slice(0, 5).join('、') + (list.length > 5 ? `…等 ${list.length} 張` : '');
    let plan = null;
    const refresh = () => {
      const s = current();
      pinsSel.disabled = s.label === 'off';
      plan = X.planExport(s, selected);
      warn.textContent = '';
      if (pickedCount === 0) count.textContent = '客人還沒有挑任何照片，沒有東西可以轉出。';
      else if (!plan.files.length && !plan.collisions.length && !plan.skipped.length) count.textContent = '三個設定都是「不設定」，沒有東西可以轉出。';
      else count.textContent = `將轉出 ${plan.files.length} 個 XMP（其中 ${plan.pinned} 張有修改標示）`;
      if (plan.collisions.length) warnLine(`有 ${plan.collisions.length} 張和別張照片檔名相同（不同資料夾），只轉出第一張，這些沒有轉出：${names(plan.collisions.map(c => c.photo_key))}`);
      if (plan.skipped.length) warnLine(`有 ${plan.skipped.length} 張的檔名無法使用，沒有轉出：${names(plan.skipped.map(c => String(c.photo_key)))}`);
      dl.disabled = !plan.files.length;
    };
    for (const el of [ratingSel, labelSel, pinsSel, flagSel]) {
      el.addEventListener('change', () => { err.textContent = ''; saveXmpSettings(current()); refresh(); });
    }
    refresh();

    const onKey = e => { if (e.key === 'Escape') done(); };
    const done = () => {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
      if (closeXmpDialog === done) closeXmpDialog = null;
      if (opener && opener.isConnected) opener.focus();
    };
    closeXmpDialog = done;
    document.addEventListener('keydown', onKey);
    close.addEventListener('click', done);
    overlay.addEventListener('click', e => { if (e.target === overlay) done(); });
    dl.addEventListener('click', async () => {
      err.textContent = '';
      if (!plan || !plan.files.length) return;
      if (typeof window.JSZip !== 'function') { err.textContent = '壓縮元件沒載入（請檢查網路後重新整理）'; return; }
      dl.disabled = true;
      try {
        const zip = new window.JSZip();
        for (const f of plan.files) zip.file(f.name, f.text);
        zip.file('README.txt', X.readme());
        const blob = await zip.generateAsync({ type: 'blob' });
        saveBlobAs(blob, project, 'zip', 'xmp');
      } catch (e) {
        err.textContent = '產生 zip 失敗，請再試一次';
      } finally {
        dl.disabled = !plan.files.length;
      }
    });
    ratingSel.focus();
  }

  function saveBlobAs(blob, project, ext, label = 'selected') {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(project.title || 'project').replace(/[\\/:*?"<>|]/g, '_')}-${label}.${ext}`;
    // attached, and the URL outlives the click by a beat — revoking it (or an
    // unattached anchor) immediately can lose the download's filename in some
    // engines, since the click only schedules the download asynchronously
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function renderClients(clients) {
    const tbody = document.getElementById('clients-tbody');
    if (!clients || clients.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty">尚無客戶</td></tr>';
      return;
    }
    tbody.innerHTML = clients.map(c => `
      <tr data-id="${c.id}" data-client-shoot-date="${escHtml(c.shoot_date || '')}">
        <td>${escHtml(c.name)}</td>
        <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${escHtml(c.email)}</td>
        <td>${shootDateCellHTML(c)}</td>
        <td>${shootTypeCellHTML(c)}</td>
        <td>
          <div class="folder-cell">${folderCellHTML(c)}</div>
        </td>
        <td>
          <label class="toggle">
            <input type="checkbox" data-perm="can_book" ${c.can_book ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td>
          <label class="toggle">
            <input type="checkbox" data-perm="can_upload" ${c.can_upload ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td>
          ${c.approved
            ? '<span class="badge badge-approved">已審核</span>'
            : `<span class="badge badge-pending">待審核</span>`}
        </td>
        <td>
          <div class="actions">
            ${!c.approved ? `<button class="btn btn-accent approve-btn" data-id="${c.id}">審核通過</button>` : ''}
            <button class="btn btn-danger delete-btn" data-id="${c.id}">刪除</button>
          </div>
        </td>
      </tr>
    `).join('');

    // Bind events
    tbody.querySelectorAll('input[data-perm]').forEach(input => {
      input.addEventListener('change', async function() {
        const row = this.closest('tr');
        const userId = row.dataset.id;
        const perm = this.dataset.perm;
        const checked = this.checked;
        const otherPerm = perm === 'can_book' ? 'can_upload' : 'can_book';
        const otherInput = row.querySelector(`input[data-perm="${otherPerm}"]`);
        const otherChecked = otherInput ? otherInput.checked : false;
        const body = {
          can_book: perm === 'can_book' ? checked : otherChecked,
          can_upload: perm === 'can_upload' ? checked : otherChecked,
        };
        await patchPermissions(userId, body);
      });
    });

    tbody.querySelectorAll('[data-shoot-date], [data-shoot-tbd], [data-shoot-type], [data-shoot-type-other]')
      .forEach(el => {
        el.addEventListener('change', async function () {
          const row = this.closest('tr');
          if (this.hasAttribute('data-shoot-tbd')) {
            const dateEl = row.querySelector('[data-shoot-date]');
            dateEl.disabled = this.checked;
            if (this.checked) dateEl.value = '';
          }
          if (this.hasAttribute('data-shoot-type')) {
            const other = row.querySelector('[data-shoot-type-other]');
            const isOther = this.value === SHOOT_TYPE_OTHER;
            other.style.display = isOther ? '' : 'none';
            if (isOther) {
              other.focus();
              // 其他 on its own is not a category. Saving here would store the
              // empty box over whatever the client had said.
              if (!other.value.trim()) return;
            } else {
              other.value = '';
            }
          }
          await saveShoot(row);
        });
      });

    tbody.querySelectorAll('[data-add-folder]').forEach(btn => {
      btn.addEventListener('click', () => openFolderPicker(btn.closest('tr').dataset.id));
    });

    tbody.querySelectorAll('[data-remove-folder]').forEach(btn => {
      btn.addEventListener('click', async function () {
        const row = this.closest('tr');
        const gone = this.dataset.removeFolder;
        await saveFolders(row.dataset.id, rowFolders(row).filter(f => f !== gone));
      });
    });

    tbody.querySelectorAll('.approve-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const userId = this.dataset.id;
        this.disabled = true;
        this.textContent = '處理中…';
        try {
          const r = await fetch(`${WORKER_URL}/api/admin/clients/${userId}/approve`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (r.ok) loadClients();
          else this.textContent = '失敗';
        } catch(e) { this.textContent = '失敗'; }
      });
    });

    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const userId = this.dataset.id;
        const row = this.closest('tr');
        const name = row.querySelector('td').textContent;
        if (!confirm(`確定要刪除客戶「${name}」？此操作無法復原。`)) return;
        this.disabled = true;
        try {
          const r = await fetch(`${WORKER_URL}/api/admin/clients/${userId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          if (r.ok) { row.remove(); return; }
          const d = await r.json().catch(() => ({}));
          clientDeleteFailed(this, `刪除失敗（${d.error || r.status}）`);
        } catch(e) { clientDeleteFailed(this, `刪除失敗：${e.message}`); }
      });
    });
  }

  // The reason goes in the row, next to the button that failed, and the button works again.
  function clientDeleteFailed(btn, msg) {
    btn.disabled = false;
    let err = btn.parentElement.querySelector('.delete-err');
    if (!err) {
      err = document.createElement('div');
      err.className = 'delete-err';
      err.setAttribute('role', 'alert');
      btn.after(err);
    }
    err.textContent = msg;
  }

  async function patchPermissions(userId, body) {
    const token = getToken();
    await fetch(`${WORKER_URL}/api/admin/clients/${userId}/permissions`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  function flashGreen(el) {
    el.style.borderColor = 'var(--success)';
    setTimeout(() => { el.style.borderColor = ''; }, 1500);
  }

  // D1 timestamps come back as raw UTC ISO strings; Tim reads them in Taipei.
  // "9/27 22:52" rather than "2026-09-27T14:52:00.000Z" — no year (every one
  // of these is recent) and no seconds (nobody needs them here).
  // 客人興趣: product names come from our catalogue but go in with textContent anyway
  const INTEREST_KIND = { album: '相本', print: '無框畫' };
  function fillInterests(list) {
    const box = document.getElementById('pd-interests');
    if (!box) return;
    const h = document.createElement('h4');
    h.textContent = '客人興趣';
    const ul = document.createElement('ul');
    for (const it of list) {
      const li = document.createElement('li');
      const name = document.createElement('strong');
      name.textContent = String(it.product_name == null ? '' : it.product_name);
      const kind = document.createElement('span');
      kind.className = 'pd-int-kind';
      kind.textContent = INTEREST_KIND[it.product_kind] || '其他';
      const meta = document.createElement('span');
      meta.className = 'pd-int-meta';
      meta.textContent = `最近 ${fmtTime(it.last_at)}・點 ${Number(it.tap_count) || 1} 次`;
      li.append(name, kind, meta);
      ul.append(li);
    }
    box.replaceChildren(h, ul);
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return Util.fmtDate(iso, 'mdhm') || String(iso);
  }

  // Runs last, now that every function and `let` above it is initialised —
  // showAdmin() reaches into most of them (initCreateForm included).
  if (getToken()) {
    showAdmin();
  }
})();
</script>
<div id="folder-picker" class="picker-overlay" style="display:none;">
  <div class="picker-box">
    <div class="picker-head">
      <strong>選擇資料夾</strong>
      <span id="folder-picker-path" class="folder-raw"></span>
      <span id="folder-picker-head-hint" class="folder-hint"></span>
      <button type="button" class="btn btn-text" id="folder-picker-close">×</button>
    </div>
    <div id="folder-picker-list" class="picker-list"></div>
    <div class="picker-foot">
      <button type="button" class="btn btn-accent" data-confirm-folders>加入所選</button>
    </div>
  </div>
</div>
</body>
</html>
