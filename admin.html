<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選片專案 — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/revision-rounds-view.css?v=20261012f">
<link rel="stylesheet" href="css/side-nav.css?v=20261012f">
<link rel="stylesheet" href="css/guest-order-card.css?v=20261012f">
<style>
  /* Bright theme, shared with home.html / dashboard.html / settings.html — cream
     ground, white cards, dark ink, warm accent, soft pastel pills. The photographer's
     pages all use the same tokens; the client's pages (index.html, client-login.html,
     book_editor/view.html) stay dark. --accent-ink is the one derived token: the amber
     accent is only ~2:1 on white, so amber *text* (links, hints) uses this darker shade
     of it (6.8:1 on white). */
  :root {
    --bg: #fff8ee;
    --surface: #ffffff;
    --card: #fff3df;
    --card-hi: #ffecc9;
    --accent: #f5a13b;
    --accent-shadow: #d6801f;
    --accent-dim: #ffd9a8;
    --accent-ink: #8a4b00;
    --mint: #d6f0e3;
    --peach: #ffd9a8;
    --sky: #cfe3fb;
    --ink-90: #231b12;
    --ink-70: #5b4f42;
    --ink-55: #6b5f50;
    --rule: #efe6d8;
    --border: #efe6d8;
    --danger: #c0392b;
    --success: #1f6b4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { color: var(--ink-90); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; min-height: 100vh; }
  input::placeholder, textarea::placeholder { color: var(--ink-55); opacity: 1; }

  /* Login */
  #login-view { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 2px 10px rgba(90,60,20,.06); padding: 40px 32px; width: 320px; text-align: center; }
  .login-card .brand { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.15em; margin-bottom: 4px; }
  .login-card .subtitle { color: var(--ink-55); font-size: 12px; margin-bottom: 28px; }

  /* Admin layout */
  #admin-view { display: none; }
  /* One screen at a time (hash-routed, see applyView) — display:none on the
     section itself so a hidden view leaves the layout entirely. */
  .view-section { display: none; }
  .view-section.active { display: block; }
  header { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 52px; }
  header .brand { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.15em; }
  header .subtitle { color: var(--ink-55); font-size: 12px; }
  header .spacer { flex: 1; }
  header .refresh-info { color: var(--ink-55); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }


  main { flex: 1; min-width: 0; padding: 24px; max-width: 1100px; }

  h2 { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 600; margin-bottom: 16px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; }
  thead { background: var(--card); }
  th { padding: 10px 14px; text-align: left; color: var(--ink-70); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  td { padding: 10px 14px; border-top: 1px solid var(--rule); vertical-align: middle; }
  tr:hover td { background: var(--card); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .badge-pending { background: var(--peach); color: var(--ink-90); }
  .badge-approved { background: var(--mint); color: var(--success); }
  /* Status colours (project list + detail header): amber = in progress, coral = needs the
     photographer, green = done / past, grey = everything else. Own class names, each paired
     with .badge for the specificity to beat .badge-approved / .badge-pending; text >= 4.5:1
     on its own background (6:1 and up). */
  .badge.st-progress { background: #ffe3b0; color: #7a4a00; }
  .badge.st-action { background: #ffd9d2; color: #9b1c0c; }
  .badge.st-done { background: #d8f0d2; color: #1f5a1a; }
  .badge.st-neutral { background: #e8e2d8; color: #4a4338; }

  /* Toggle switch */
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--accent-dim); border-radius: 20px; transition: 0.2s; }
  .toggle-slider:before { position: absolute; content: ''; height: 14px; width: 14px; left: 3px; bottom: 3px; background: var(--ink-55); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(16px); background: var(--ink-90); }
  .toggle input:focus-visible + .toggle-slider { outline: 2px solid var(--ink-90); outline-offset: 2px; }

  /* Folder path input */
  .folder-input { background: var(--bg); border: 1px solid var(--rule); color: var(--ink-90); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; width: 160px; outline: none; }
  .folder-input:focus, .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .folder-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .folder-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card);
    border: 1px solid var(--accent-dim); border-radius: 999px; padding: 2px 6px 2px 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .folder-chip button { background: none; border: 0; color: var(--ink-55); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px; }
  .folder-chip button:hover { color: var(--danger); }
  .folder-none { color: var(--ink-55); font-size: 12px; }
  .folder-broken { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .folder-raw { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-55); }
  .picker-overlay { position: fixed; inset: 0; background: rgba(35,27,18,0.45); z-index: 2000;
    align-items: center; justify-content: center; display: flex; }
  .picker-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(90,60,20,.25);
    width: min(520px, 92vw); max-height: 80vh; display: flex; flex-direction: column; }
  .picker-head, .picker-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .picker-head { border-bottom: 1px solid var(--rule); }
  .picker-foot { border-top: 1px solid var(--rule); justify-content: flex-end; }
  .picker-head .btn-text { margin-left: auto; }
  .picker-list { overflow-y: auto; padding: 8px 16px; flex: 1; min-height: 0; }
  .folder-pick-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 5px 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .folder-pick-row .badge { margin-left: auto; }
  .folder-hint { color: var(--accent-ink); font-size: 11px; }
  .shoot-cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .shoot-cell .folder-input { width: 130px; }
  .checkline { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-55);
    font-size: 11px; cursor: pointer; }

  /* Buttons */
  .btn { padding: 5px 12px; border-radius: 999px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, .btn-logout:focus-visible { outline: 2px solid var(--ink-90); outline-offset: 2px; }
  .btn-accent { background: var(--accent); color: var(--ink-90); }
  /* danger sits on white, not peach: --danger on --peach is only 4.1:1 */
  .btn-danger { background: var(--surface); color: var(--danger); border: 1px solid var(--danger); }
  .btn-ghost, .btn-outline { background: transparent; color: var(--ink-70); border: 1px solid var(--accent-dim); }
  .btn-ghost:hover, .btn-outline:hover { border-color: var(--accent); color: var(--ink-90); opacity: 1; }
  .btn-text { background: transparent; color: var(--ink-70); }

  /* Form fields (shared) */
  .field { background: var(--bg); border: 1px solid var(--rule); color: var(--ink-90); padding: 9px 12px; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; width: 100%; }

  /* Error */
  .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }
  .ok-msg { color: var(--success); font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 0; color: var(--ink-55); }

  /* Logout btn */
  .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--ink-55); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .panel { border-radius: 14px; background: var(--surface); box-shadow: 0 2px 10px rgba(90,60,20,.06); margin-bottom: 28px; }
  .panel-body { padding: 16px 18px; }
  .panel-stat { color: var(--ink-90); font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .panel-note { color: var(--ink-55); font-size: 12px; line-height: 1.7; margin: 0 0 8px; }
  .panel-note strong { color: var(--ink-90); font-weight: 600; }
  .panel-result { color: var(--ink-55); font-size: 12px; margin-left: 10px; }

  /* Guest picking — docs/guest-picking.md */
  .pick-admin-field { margin-bottom: 12px; max-width: 420px; }
  .pick-admin-field label { display: block; font-size: 12px; color: var(--ink-55); margin-bottom: 5px; }
  .pick-admin-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .pick-admin-row .pick-admin-field { flex: 1; min-width: 180px; }
  .pick-admin-result { margin-top: 14px; font-size: 12px; color: var(--ink-55); }
  .pick-admin-link-row { display: flex; gap: 8px; margin-top: 6px; }
  .pick-admin-link-row .field { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .proj-recent-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; margin-bottom: 6px; font-size: 13px; }
  /* the whole row opens the project (js below); 開啟 stays for discoverability */
  .proj-recent-row[data-project-row] { cursor: pointer; transition: background .12s, border-color .12s; }
  .proj-recent-row[data-project-row]:hover { background: var(--card); border-color: var(--accent); }
  .proj-recent-row[data-project-row]:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; background: var(--card); }
  /* 攝影類別 tag + list filter bar */
  .pt-tag { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--accent-dim); color: var(--ink-70); vertical-align: middle; }
  .pt-tag[hidden] { display: none; }
  #project-create-panel[hidden] { display: none; }
  .proj-new-btn { min-height: 44px; margin: 0 0 14px; }
  #proj-create-result { margin: 0 0 14px; }
  #proj-copy-link-btn { min-height: 44px; }
  .proj-create-actions .btn { min-height: 44px; }
  /* list row: title line (title + the ONE status badge), meta line, buttons */
  .proj-recent-main { min-width: 0; flex: 1; }
  .proj-row-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proj-row-title .proj-row-name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .proj-row-meta { margin: 2px 0 0; }
  @media (max-width: 768px) {
    .proj-recent-row { flex-direction: column; align-items: stretch; gap: 6px; padding: 10px 12px; }
    .proj-recent-row .actions { flex-wrap: nowrap; }
    .proj-recent-row .actions .btn { flex: 1; min-height: 44px; }
    /* project detail: the action buttons are the main controls on a phone */
    #project-detail-body .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  }
  .pl-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .pl-filter .field { width: auto; padding: 7px 10px; font-size: 13px; }
  .pl-filter #pl-q { flex: 1; min-width: 160px; }
  .pl-count { font-size: 12px; color: var(--ink-55); margin-bottom: 8px; min-height: 1em; }
  #proj-type-other { margin-top: 6px; }
  /* 交件 notice dialog */
  .dn-box { padding: 16px 18px; gap: 10px; }
  .dn-box h4 { margin: 0; font-size: 15px; }
  .dn-box .dn-note { color: var(--ink-55); font-size: 12px; line-height: 1.6; margin: 0; }
  .dn-text { width: 100%; min-height: 190px; resize: vertical; font-family: inherit; font-size: 16px; line-height: 1.6;
    background: var(--bg); color: var(--ink-90); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
  .dn-box .dn-set-link { color: var(--accent-ink); display: inline-block; min-height: 44px; line-height: 44px; padding: 0 4px; margin: -12px 0; }
  .dn-actions .btn { min-height: 44px; }
  .dn-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dn-status { color: var(--success); font-size: 13px; font-weight: 600; }
  /* create form: which folder a project will use (js/project-folders.js) and whether it already holds photos */
  .proj-folder-preview { color: var(--ink-70); font-size: 13px; line-height: 1.7; margin: 0 0 6px; overflow-wrap: anywhere; }
  .proj-folder-preview code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-90); }
  .proj-folder-preview .proj-folder-warn { color: var(--accent-ink); }
  .proj-folder-note { color: var(--ink-70); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .proj-folder-note[data-state="existing"] { color: var(--accent-ink); font-weight: 600; }
  /* nothing to create yet: muted but still AA-legible (the generic .btn:disabled opacity would not be) */
  #proj-create-btn:disabled { opacity: 1; background: var(--card-hi); color: var(--ink-70); }
  /* Project detail sections: a title row (title + one-line summary + ▾/▸) that opens and
     closes its body. Closed = display:none on the body container. Everything inside keeps its id. */
  .pd-sec { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); margin: 10px 0 0; }
  .pd-sec.pd-sec-off { display: none; }
  #project-detail-panel .pd-sec-h { display: block; margin: 0; font-size: 14px; }
  .pd-sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; }
  .pd-sec-head .pd-sec-h { flex: 1 1 220px; min-width: 0; }
  .pd-sec-btn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; width: 100%; min-height: 40px;
    padding: 9px 14px; background: transparent; border: 0; border-radius: 12px; text-align: left; cursor: pointer;
    font: inherit; color: var(--ink-90); }
  .pd-sec-btn:hover { background: var(--card); }
  .pd-sec-btn:focus-visible { outline: 2px solid var(--ink-90); outline-offset: -2px; }
  .pd-sec-caret { width: 14px; flex: none; color: var(--ink-55); font-size: 12px; }
  .pd-sec-title { font-weight: 600; font-size: 14px; }
  .pd-sec-sum { flex: 1 1 140px; min-width: 0; color: var(--ink-70); font-size: 12px; font-weight: 400; overflow-wrap: anywhere; }
  .pd-sec-head a.pd-link { flex: none; margin: 0 14px 6px 38px; font-size: 12px; color: var(--accent-ink); text-decoration: none; }
  .pd-sec-head a.pd-link:hover { text-decoration: underline; }
  .pd-sec.is-collapsed > .pd-sec-body { display: none; }
  .pd-sec-body { padding: 2px 14px 12px; }
  /* the blocks used to be boxes of their own; inside a section they are just its content */
  .pd-sec .pd-block { border: 0; border-radius: 0; padding: 0; margin: 0; }
  .pd-sec .pd-block + .pd-block { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 12px; }
  #project-detail-panel .pd-sec-body h4 { margin: 2px 0 8px; }
  #project-detail-panel .pd-sec-body > .pd-block:first-child > h4:first-child, #project-detail-panel .pd-sec-body > h4:first-child { margin-top: 0; }
  /* leftover blank space: an empty message line, a roomy empty state and the card margin take no room here */
  #project-detail-panel .err:empty, #project-detail-panel .ok-msg:empty { display: none; }
  #project-detail-panel .empty { padding: 8px 0; text-align: left; }
  #project-detail-panel.panel { margin-bottom: 12px; }
  .pd-back-bar { padding: 14px 18px 0; }
  /* page-level back: a text link at the top-left, never a pill (shared convention; upload.html / styles.css / book_editor.css carry their own copy) */
  .back-btn { background: none; border: 0; color: var(--ink-70); padding: 0 8px; margin-left: -8px; min-height: 36px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .back-btn:hover { color: var(--ink-90); text-decoration: underline; }
  .back-btn:focus-visible { outline: 2px solid var(--ink-90); outline-offset: 2px; }
  @media (max-width: 640px) { .back-btn { min-height: 44px; } }
  .proj-notice { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: var(--accent-dim); color: var(--ink-90); font-size: 13px; line-height: 1.6; }
  .pd-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pd-title-wrap { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .pd-title-wrap h3 { overflow-wrap: anywhere; }
  .pd-title-wrap[hidden], .pd-rename-form[hidden] { display: none; }
  .pd-rename-form { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1 1 100%; }
  .pd-rename-form .field { flex: 1 1 220px; min-width: 0; width: auto; }
  .pd-rename-hint { flex: 1 1 100%; color: var(--ink-55); font-size: 12px; }
  .pd-owner { color: var(--ink-55); font-size: 13px; margin-bottom: 14px; }
  .pd-shoot-text { color: var(--ink-55); font-size: 13px; }
  .pd-shoot-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--ink-55); }
  .pd-shoot-row .field { width: auto; }
  .pd-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .pd-submission { padding: 10px 0; border-top: 1px solid var(--rule); font-size: 12px; }
  .pd-submission:first-child { border-top: none; }
  .pd-diff { color: var(--ink-55); margin-top: 4px; word-break: break-word; }
  .pd-block { border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
  .pd-block h4 { margin: 0 0 8px; }
  .pd-block .pd-note { color: var(--ink-55); font-size: 12px; margin: 6px 0 10px; line-height: 1.6; }
  .pd-block .pd-row a.btn, .pd-actions a.btn { text-decoration: none; }
  .pd-folder-line { color: var(--ink-55); font-size: 13px; margin: -6px 0 12px; overflow-wrap: anywhere; }
  .pd-folder-line code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-70); }
  .pd-target-hint { color: var(--ink-55); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }
  .pd-target-hint code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-70); }
  .pd-block .pd-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  /* client confirmation (docs/delivery.md): status, the guest's 要求修改 list, 標記完成 */
  .pd-confirm { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .pd-confirm-status { font-size: 13px; color: var(--ink-90); font-weight: 600; }
  .pd-confirm-status.done { color: var(--success); }
  /* 客人興趣 (docs/guest-shop.md, product interest): what the guest tapped 「我有興趣」 on */
  #pd-interests { margin-top: 12px; }
  #pd-interests h4 { margin: 0 0 6px; font-size: 14px; }
  #pd-interests ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #pd-interests li { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; font-size: 13px; overflow-wrap: anywhere; }
  #pd-interests .pd-int-kind { color: var(--ink-70); margin-left: 6px; }
  #pd-interests .pd-int-meta { color: var(--ink-70); font-size: 12px; display: block; margin-top: 2px; }
  #pd-revisions { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .pd-rev { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  /* a handled request is quieter (white, dashed, softer text), not translucent: it must stay AA-legible */
  .pd-rev.resolved { background: var(--surface); border-style: dashed; }
  .pd-rev.resolved .pd-rev-msg { color: var(--ink-70); }
  .pd-rev-meta { color: var(--ink-70); font-size: 12px; font-family: 'IBM Plex Mono', monospace; margin-bottom: 3px; }
  .pd-rev-msg { color: var(--ink-90); white-space: pre-wrap; overflow-wrap: anywhere; }
  .pd-rev-done { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--mint); color: var(--success); font-size: 11px; }
  .pd-switch { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  #project-detail-panel h4 { font-size: 13px; margin: 18px 0 8px; color: var(--ink-90); }
  #project-detail-panel h4 a.pd-link,
  #project-detail-panel summary a.pd-link,
  #project-detail-panel td a.pd-link { color: var(--accent-ink); text-decoration: none; }
  #project-detail-panel h4 a.pd-link:hover,
  #project-detail-panel summary a.pd-link:hover,
  #project-detail-panel td a.pd-link:hover { text-decoration: underline; }
  /* 目前選取 collapses by default (task: 專案選片) — the table underneath
     can be long, and the photographer usually only wants the count + a
     link into index.html?project=, not the whole list, every time. */
  #project-detail-panel summary {
    font-size: 13px; margin: 18px 0 8px; color: var(--ink-90);
    cursor: pointer; list-style: none;
  }
  #project-detail-panel summary::-webkit-details-marker { display: none; }
  #project-detail-panel summary::before { content: '▸ '; }
  #project-detail-panel details[open] summary::before { content: '▾ '; }
  #project-detail-panel summary a.pd-link { margin-left: 8px; }
  /* Orders (docs/products-orders.md) — project detail 訂單 */
  [hidden] { display: none !important; }
  .ord-card { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); padding: 12px 14px; margin-bottom: 10px; font-size: 13px; }
  /* dimmed by tint + dashed edge, not opacity: fading the text would take it under 4.5:1 */
  .ord-card.cancelled { background: var(--bg); border-style: dashed; }
  .ord-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .ord-head .ord-time { color: var(--ink-55); font-size: 12px; margin-left: auto; }
  .ord-table { width: 100%; border-collapse: collapse; background: transparent; }
  .ord-table th { padding: 4px 6px; font-size: 10px; }
  .ord-table td { padding: 5px 6px; border-top: 1px solid var(--rule); vertical-align: top; }
  .ord-table .num { text-align: right; white-space: nowrap; }
  .ord-keys { color: var(--ink-55); font-size: 11px; font-family: 'IBM Plex Mono', monospace; word-break: break-all; }
  .ord-totals { margin-top: 8px; text-align: right; line-height: 1.7; }
  .ord-totals .owed { color: var(--danger); font-weight: 600; }
  .ord-totals .muted { color: var(--ink-55); font-size: 12px; }
  .ord-note { color: var(--ink-55); font-size: 12px; margin-top: 6px; }
  .ord-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .ord-err, .delete-err { color: var(--danger); font-size: 12px; min-height: 0; margin-top: 6px; }
  .ord-err:empty, .delete-err:empty { display: none; }
  .ord-warn { border: 1px solid var(--accent); background: var(--peach); color: var(--ink-90); border-radius: 12px; padding: 8px 12px; margin-top: 8px; font-size: 13px; }
  .ord-hint { margin-top: 8px; font-size: 12px; color: var(--ink-55); }
  .ord-extra { border: 1px dashed var(--accent); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-size: 12px; color: var(--ink-55); }
  .ord-form { border: 1px solid var(--rule); border-radius: 12px; background: var(--card); padding: 12px 14px; margin: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .ord-form label { display: block; font-size: 11px; color: var(--ink-55); margin-bottom: 4px; }
  .ord-form .field { padding: 6px 8px; font-size: 13px; width: 130px; }
  .ord-editor { border: 1px solid var(--rule); border-radius: 12px; background: var(--card); padding: 12px 14px; margin: 10px 0; }
  .ord-line-edit { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding: 8px 0; border-top: 1px solid var(--rule); }
  .ord-line-edit:first-of-type { border-top: none; }
  .ord-line-edit .ord-line-name { flex: 1 1 200px; min-width: 0; }
  .ord-line-edit label { display: block; font-size: 11px; color: var(--ink-55); margin-bottom: 4px; }
  .ord-line-edit .field { padding: 6px 8px; font-size: 13px; width: 96px; }
  .ord-photos { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; max-height: 160px; overflow-y: auto; }
  .ord-photos label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 11px; color: var(--ink-90); }
  .ord-editor-add { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .ord-editor-add select.field { width: auto; max-width: 100%; padding: 6px 8px; font-size: 13px; }
  .ord-editor-foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
  .ord-editor-foot .field { padding: 6px 8px; font-size: 13px; }
</style>

<script>
(function() {
  const WORKER_URL = 'https://imagepicker.hotichen.workers.dev';
  const TOKEN_KEY = 'studio_token';
  let autoRefreshTimer = null;
  let refreshCountdown = 30;

  // ── Auth ──────────────────────────────────────────────────────────────────
  const loginView = document.getElementById('login-view');
  const adminView = document.getElementById('admin-view');

  function getToken() { return sessionStorage.getItem(TOKEN_KEY) || ''; }

  async function tryAdminLogin() {
    const token = document.getElementById('admin-token-input').value.trim();
    const errEl = document.getElementById('admin-login-err');
    if (!token) { errEl.textContent = '請輸入密碼'; return; }
    errEl.textContent = '';
    // Verify by calling /api/admin/clients
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/clients`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (r.status === 401) { errEl.textContent = '密碼錯誤'; return; }
      if (!r.ok) { errEl.textContent = `錯誤 ${r.status}`; return; }
      sessionStorage.setItem(TOKEN_KEY, token);
      showAdmin();
    } catch(e) {
      errEl.textContent = '無法連線到 Worker';
    }
  }

  function showAdmin() {
    loginView.style.display = 'none';
    adminView.style.display = 'block';
    loaded.projects = false;
    loaded.clients = false;
    startAutoRefresh();
    applyView();
  }

  // ── Views (hash-routed) ───────────────────────────────────────────────────
  // admin.html is two screens: 選片專案 (#projects, #project=<id>, and the
  // default for no/unknown hash) and 客戶 (#clients). Only one section is
  // shown; its data loads the first time it is shown.
  const VIEWS = {
    projects: { title: '選片專案', navKey: 'projects' },
    clients: { title: '客戶', navKey: 'clients' },
  };
  const loaded = { projects: false, clients: false };
  let currentView = 'projects';

  function viewFromHash() {
    return location.hash === '#clients' ? 'clients' : 'projects';
  }

  // The hash is `#project=<id>` (the detail) and/or the list's filters
  // (`#q=…&status=…&type=…&sort=…`, only what differs from the default), so a reload, a link and
  // Back all land on the same list. parseHash / buildHash are the only readers and writers.
  const LIST_STATUSES = [['all', '全部狀態'], ['picking', '選片中'], ['submitted', '已送出'], ['retouching', '精修中'],
    ['delivered', '已交件'], ['confirmed', '客戶已確認'], ['revising', '待修改']];
  const listFilter = { q: '', status: 'all', type: 'all', sort: 'default' };
  function parseHash() { return new URLSearchParams(location.hash.replace(/^#/, '')); }
  function buildHash(projectId) {
    const p = new URLSearchParams();
    if (projectId) p.set('project', projectId);
    if (listFilter.q) p.set('q', listFilter.q);
    if (listFilter.status !== 'all') p.set('status', listFilter.status);
    if (listFilter.type !== 'all') p.set('type', listFilter.type);
    if (listFilter.sort !== 'default') p.set('sort', listFilter.sort);
    const str = p.toString();
    return str ? '#' + str : '';
  }
  // the address of the list as it stands (what 返回 falls back to when there is no entry behind the detail)
  const listUrl = () => location.pathname + location.search + buildHash(null);

  function applyView() {
    currentView = viewFromHash();
    const v = VIEWS[currentView];
    Object.keys(VIEWS).forEach(k => {
      const sec = document.getElementById('view-' + k);
      if (sec) sec.classList.toggle('active', k === currentView);
    });
    document.getElementById('page-subtitle').textContent = v.title;
    document.title = v.title + ' — Studio';
    if (typeof SideNav !== 'undefined') SideNav.render(document.getElementById('sideNav'), v.navKey, doLogout);
    updateRefreshInfo();
    if (currentView === 'clients') {
      if (!loaded.clients) { loaded.clients = true; loadClients(); }
    } else {
      if (!loaded.projects) {
        loaded.projects = true;
        loadProjectDefaults();
        initListControls();
        initCreateForm();
        loadProjectList();
      }
      syncFilterFromHash();
      if (projectIdFromHash()) {
        restoreProjectFromHash();
      } else {
        // No project in the hash (menu click on 選片專案, browser Back from a detail,
        // 返回): the list.
        setProjectsMode(false);
      }
    }
  }
  window.addEventListener('hashchange', () => { if (getToken() && adminView.style.display === 'block') applyView(); });

  // Prefills 精修張數上限 / 加選單價 in the project-create form from the
  // studio's saved defaults (settings.html) — a convenience only, so any
  // failure here is silent and the fields just stay blank ("留空 = 不限").
  // Only fills a field that is still empty, so it never clobbers something
  // the photographer already typed before this resolved.
  async function loadProjectDefaults() {
    loadPickLinkTemplate();
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/settings`, {
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      if (!r.ok) return;
      const s = await r.json();
      const limitEl = document.getElementById('proj-pick-limit');
      const priceEl = document.getElementById('proj-extra-price');
      if (limitEl && !limitEl.value && s.default_pick_limit != null) limitEl.value = s.default_pick_limit;
      if (priceEl && !priceEl.value && s.default_extra_price != null) priceEl.value = s.default_extra_price;
      const extraEl = document.getElementById('proj-extra-max');
      if (extraEl && !extraEl.value && s.effective_default_extra_max != null) extraEl.value = s.effective_default_extra_max;
    } catch (e) { /* best effort */ }
  }

  // index.html?project=<id> links back to `#project=<id>` (openProjectDetail
  // sets it). Reopens that same project's detail on the way back in, whether
  // this is a fresh load after Back/the phone back gesture, or just this
  // browser still holding an old link from earlier.
  function projectIdFromHash() {
    return parseHash().get('project') || null;
  }
  function restoreProjectFromHash() {
    const id = projectIdFromHash();
    if (id) openProjectDetail(id);
  }

  // ── Projects view: the list, or one project's detail ──────────────────────
  // Never both: the detail used to open under the whole list, so on a phone 開啟
  // looked like it did nothing. The address says which one is up (#project=<id>
  // is the detail), so reload, a link from another page and the browser's Back all
  // land in the right one. Opening pushes ONE history entry (marked pdDetail), so
  // Back is "close the detail"; 返回 uses that same entry (history.back) and only
  // rewrites the address when the page was entered on the detail (a link, a reload
  // with no entry behind it), where Back would leave the page instead.
  let detailMode = false;
  let detailShownId = null;    // the project whose detail is drawn in the panel right now
  let listScrollY = 0;         // where the list was scrolled to when a project was opened
  let openSeq = 0;             // the newest openProjectDetail wins; an older answer is dropped

  function setProjectsMode(detail) {
    const area = document.getElementById('projects-list-area');
    const panel = document.getElementById('project-detail-panel');
    if (!area || !panel) return;
    const was = detailMode;
    detailMode = detail;
    area.style.display = detail ? 'none' : '';
    panel.style.display = detail ? 'block' : 'none';
    if (detail && !was) {
      listScrollY = window.scrollY;
      window.scrollTo(0, 0);
    } else if (!detail && was) {
      detailShownId = null;
      currentProjectId = null;
      window.scrollTo(0, listScrollY);
    }
  }
  function showProjectNotice(text) {
    const el = document.getElementById('proj-notice');
    if (!el) return;
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }
  // Leave the detail for the list. Also what an action that takes the project out of
  // the list (封存, 刪除) does.
  function leaveProjectDetail() {
    if (history.state && history.state.pdDetail) { history.back(); return; }   // hashchange → applyView → list
    history.replaceState(null, '', listUrl());
    setProjectsMode(false);
  }
  document.getElementById('pd-back-btn')?.addEventListener('click', leaveProjectDetail);

  document.getElementById('admin-login-btn').addEventListener('click', tryAdminLogin);
  PasswordToggle.attach(document.getElementById('admin-token-input'));
  document.getElementById('admin-token-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryAdminLogin(); });
  function doLogout() {
    sessionStorage.removeItem(TOKEN_KEY);
    clearInterval(autoRefreshTimer);
    adminView.style.display = 'none';
    loginView.style.display = 'flex';
  }
  document.getElementById('logout-btn').addEventListener('click', doLogout);

  // ── Auto-refresh ──────────────────────────────────────────────────────────
  function startAutoRefresh() {
    clearInterval(autoRefreshTimer);
    refreshCountdown = 30;
    updateRefreshInfo();
    autoRefreshTimer = setInterval(() => {
      refreshCountdown--;
      updateRefreshInfo();
      if (refreshCountdown <= 0) {
        if (currentView === 'clients') loadClients();
        refreshCountdown = 30;
      }
    }, 1000);
  }

  function updateRefreshInfo() {
    const el = document.getElementById('refresh-info');
    if (el) el.textContent = currentView === 'clients' ? `${refreshCountdown}s 後自動更新` : '';
  }

  // ── Load clients ──────────────────────────────────────────────────────────
  async function loadClients() {
    const token = getToken();
    if (!token) return;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/clients`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (r.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        adminView.style.display = 'none';
        loginView.style.display = 'flex';
        return;
      }
      const clients = await r.json();
      renderClients(clients);
    } catch(e) {
      document.getElementById('clients-tbody').innerHTML =
        `<tr><td colspan="9" class="empty">載入失敗：${e.message}</td></tr>`;
    }
  }

  // folders:null means the column will not parse. That is a different state
  // from "none set", and the two look identical unless one of them says so —
  // the account cannot be repaired by someone who thinks it is merely empty.
  function folderCellHTML(c) {
    if (c.folders === null || c.folders === undefined && c.folder_path && !Array.isArray(c.folders)) {
      return `<div data-folders-broken class="folder-broken">
        <span class="badge badge-pending">資料夾設定有誤</span>
        <code class="folder-raw">${escHtml(c.folder_path || '')}</code>
        <button class="btn btn-accent" data-add-folder type="button">重設</button>
      </div>`;
    }
    const list = Array.isArray(c.folders) ? c.folders : [];
    const chips = list.map(f => `
      <span class="folder-chip" data-folder-chip="${escHtml(f)}">
        ${escHtml(f)}<button type="button" data-remove-folder="${escHtml(f)}" title="移除">×</button>
      </span>`).join('');
    return `${chips || '<span class="folder-none">未設定</span>'}
      <button class="btn btn-outline" data-add-folder type="button">＋</button>`;
  }

  // 拍攝日期 has three states and a date input can show one of them, so the
  // other two are said out loud beside it: '' is 未填 — nobody was asked, which
  // is every account older than the column — and 未定 is the client answering
  // that the day is not settled. Anything else in the column was hand-written
  // into D1 and is shown raw rather than dropped on the floor.
  function shootDateCellHTML(c) {
    const v = c.shoot_date || '';
    const tbd = v === SHOOT_DATE_TBD;
    const iso = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
    const raw = v && !tbd && !iso;
    return `<div class="shoot-cell">
      <input class="folder-input" type="date" data-shoot-date value="${escHtml(iso)}"${tbd ? ' disabled' : ''}>
      <label class="checkline"><input type="checkbox" data-shoot-tbd${tbd ? ' checked' : ''}> ${escHtml(SHOOT_DATE_TBD)}</label>
      <span class="folder-none" data-shoot-date-unfilled${v === '' ? '' : ' style="display:none"'}>未填</span>
      ${raw ? `<code class="folder-raw" data-shoot-date-raw>${escHtml(v)}</code>` : ''}
    </div>`;
  }

  // The categories come from js/shoot-types.js, so adding one is a line there
  // and nothing here. A stored value that is not on the list was typed under
  // 其他 — by the client or by an earlier list — and comes back as that.
  function shootTypeCellHTML(c) {
    const v = c.shoot_type || '';
    const typed = v !== '' && !SHOOT_TYPES.includes(v);
    const picked = typed ? SHOOT_TYPE_OTHER : v;
    const options = [`<option value=""${picked === '' ? ' selected' : ''}>未填</option>`]
      .concat(SHOOT_TYPES.map(t =>
        `<option value="${escHtml(t)}"${t === picked ? ' selected' : ''}>${escHtml(t)}</option>`))
      .join('');
    return `<div class="shoot-cell">
      <select class="folder-input" data-shoot-type>${options}</select>
      <input class="folder-input" type="text" data-shoot-type-other placeholder="自行輸入"
        value="${escHtml(typed ? v : '')}"${typed ? '' : ' style="display:none"'}>
    </div>`;
  }

  // Only the shoot fields and the toggles as they stand. The Worker writes
  // permissions from whatever body it is handed, and `folders` left out is
  // `folders` left alone — sending the row's chips here would make a date
  // correction a folder write too.
  async function saveShoot(row) {
    const tbd = row.querySelector('[data-shoot-tbd]');
    const sel = row.querySelector('[data-shoot-type]');
    const other = row.querySelector('[data-shoot-type-other]');
    const shoot_date = tbd.checked ? SHOOT_DATE_TBD : row.querySelector('[data-shoot-date]').value;
    const shoot_type = sel.value === SHOOT_TYPE_OTHER ? other.value.trim() : sel.value;
    // the picker reads the date off the row, so an unsaved correction must not
    // leave it suggesting folders for the old one
    row.dataset.clientShootDate = shoot_date;
    const mark = row.querySelector('[data-shoot-date-unfilled]');
    if (mark) mark.style.display = shoot_date === '' ? '' : 'none';
    await patchPermissions(row.dataset.id, {
      can_book: !!row.querySelector('input[data-perm="can_book"]')?.checked,
      can_upload: !!row.querySelector('input[data-perm="can_upload"]')?.checked,
      shoot_date, shoot_type,
    });
  }

  function rowFolders(row) {
    return [...row.querySelectorAll('[data-folder-chip]')].map(el => el.dataset.folderChip);
  }

  // Only `folders` is sent. The Worker lets folders win a tie, but a stale
  // folder_path riding along would still land wherever that rule is not
  // reached, and it overwrites silently.
  async function saveFolders(userId, folders) {
    const row = document.querySelector(`tr[data-id="${userId}"]`);
    await patchPermissions(userId, {
      can_book: !!row?.querySelector('input[data-perm="can_book"]')?.checked,
      can_upload: !!row?.querySelector('input[data-perm="can_upload"]')?.checked,
      folders,
    });
    await loadClients();
  }

  let pickerFor = null;
  let pickerChosen = [];
  // The folders are named by date, so the client's shoot date is a strong hint
  // about which one is theirs. Held for as long as the picker is open.
  let pickerDate = '';
  let pickerMatch = null;
  // 'client' (the row's folder_path) or 'final' (the finals folders of a
  // delivery) — same overlay, different confirm target.
  let pickerMode = 'client';

  let pickerWired = false;
  async function openFolderPicker(userId) {
    if (!pickerWired) { wireFolderPicker(); pickerWired = true; }
    pickerMode = 'client';
    pickerFor = userId;
    pickerChosen = [];
    pickerDate = document.querySelector(`tr[data-id="${userId}"]`)?.dataset.clientShootDate || '';
    pickerMatch = shootDateFolderMatcher(pickerDate);
    document.getElementById('folder-picker').style.display = 'flex';
    await browseFolders('');
  }

  function wireFolderPicker() {
  const overlay = document.getElementById('folder-picker');
  const close = () => { overlay.style.display = 'none'; };
  document.getElementById('folder-picker-close').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.addEventListener('change', e => {
    const box = e.target.closest('[data-pick-folder]');
    if (!box) return;
    const f = box.dataset.pickFolder;
    if (box.checked) { if (!pickerChosen.includes(f)) pickerChosen.push(f); }
    else pickerChosen = pickerChosen.filter(x => x !== f);
  });

  overlay.addEventListener('click', e => {
    const nav = e.target.closest('[data-browse]');
    if (nav) { browseFolders(nav.dataset.browse); return; }
    if (!e.target.closest('[data-confirm-folders]')) return;
    if (pickerMode === 'final') {
      finalDraft = pickerChosen.slice();
      close();
      renderDeliveryBlock();
      return;
    }
    const row = document.querySelector(`tr[data-id="${pickerFor}"]`);
    // a repair starts from nothing; an add keeps what is already there
    const existing = row && !row.querySelector('[data-folders-broken]') ? rowFolders(row) : [];
    const merged = existing.concat(pickerChosen.filter(f => !existing.includes(f)));
    close();
    saveFolders(pickerFor, merged);
  });
  }

  // 交件: pick the final (retouched) folders. Same overlay as project
  // creation; the Worker refuses a folder inside/containing a proof folder.
  async function openFinalFolderPicker() {
    if (!pickerWired) { wireFolderPicker(); pickerWired = true; }
    pickerMode = 'final';
    pickerFor = null;
    pickerChosen = finalDraft.slice();
    pickerDate = '';
    pickerMatch = null;
    document.getElementById('folder-picker').style.display = 'flex';
    await browseFolders('');
  }

  async function browseFolders(prefix) {
    const box = document.getElementById('folder-picker-list');
    box.innerHTML = '<div class="empty">載入中…</div>';
    const token = getToken();
    let folders = [];
    try {
      const r = await fetch(`${WORKER_URL}/?list=${encodeURIComponent(prefix)}`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      const data = await r.json();
      folders = Array.isArray(data.folders) ? data.folders : [];
    } catch (e) { /* shown as empty below */ }

    document.getElementById('folder-picker-path').textContent = prefix || '（根目錄）';
    document.getElementById('folder-picker-head-hint').textContent =
      pickerMatch ? `拍攝日期 ${pickerDate} 的資料夾排在最前面`
        : (pickerMode === 'final' ? '精修資料夾要獨立，不能在毛片資料夾裡面' : '');
    // A hint, not a filter. The names are typed by hand, so the rule misses
    // some and can point at another client who shot the same day; floating the
    // matches to the top and saying why costs a scroll when it is wrong, where
    // hiding the rest would cost the photographer the folder they wanted.
    const matched = pickerMatch ? folders.filter(pickerMatch) : [];
    const ordered = matched.concat(folders.filter(f => !matched.includes(f)));
    const up = prefix ? `<button type="button" class="btn btn-outline" data-browse="${escHtml(
      prefix.replace(/[^/]+\/$/, ''))}">← 上一層</button>` : '';
    const rows = ordered.map(f => `
      <div class="folder-pick-row"${matched.includes(f) ? ' data-date-match' : ''}>
        <label><input type="checkbox" data-pick-folder="${escHtml(f)}"
          ${pickerChosen.includes(f) ? 'checked' : ''}> ${escHtml(f)}</label>
        ${matched.includes(f) ? '<span class="badge badge-approved">拍攝日相符</span>' : ''}
        <button type="button" class="btn btn-text" data-browse="${escHtml(f)}">進入 →</button>
      </div>`).join('');
    box.innerHTML = up + (rows || '<div class="empty">這層沒有子資料夾</div>');
  }

  // ── Guest picking — project admin (docs/guest-picking.md) ──────────────────
  let currentProjectId = null;

  const PF = window.ProjectFolders;   // the folder naming rules, js/project-folders.js

  // One listing of an R2 prefix through the Worker (admin token), the way
  // browseFolders reads it: { files, folders }. null when it could not be read —
  // callers decide what that means, none of them may guess.
  async function listPrefix(prefix) {
    try {
      const r = await fetch(`${WORKER_URL}/?list=${encodeURIComponent(prefix)}`, {
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      if (!r.ok) return null;
      const data = await r.json();
      return { files: Array.isArray(data.data) ? data.data : [], folders: Array.isArray(data.folders) ? data.folders : [] };
    } catch (e) { return null; }
  }

  // ── the create form: 專案名稱 + 拍攝日期 → the folders (js/project-folders.js) ──
  let createCheckSeq = 0;     // a later edit makes an earlier check's answer stale
  let createCheckTimer = null;

  function initCreateForm() {
    const date = document.getElementById('proj-date');
    if (date && !date.value) date.value = todayTaipei();
    updateCreateForm();
  }

  function updateCreateForm() {
    const preview = document.getElementById('proj-folder-preview');
    const note = document.getElementById('proj-folder-note');
    const btn = document.getElementById('proj-create-btn');
    const dateEl = document.getElementById('proj-date');
    if (!preview || !note || !btn || !dateEl) return;
    const plan = PF.plan(dateEl.value, document.getElementById('proj-title').value);
    createCheckSeq++;
    clearTimeout(createCheckTimer);
    note.hidden = true; note.textContent = ''; delete note.dataset.state;
    btn.disabled = !plan.ok;
    if (!plan.ok) {
      preview.textContent = plan.reason === 'name'
        ? '請輸入專案名稱（資料夾名稱不能含 / \\ ? # % * : | " < >，這些字會被拿掉）' : '請選擇拍攝日期';
      return;
    }
    preview.innerHTML = `資料夾：<code>${escHtml(plan.root)}/</code>　毛片放 <code>${escHtml(PF.PROOF_NAME)}/</code>，精修放 <code>${escHtml(PF.FINAL_NAME)}/</code>`
      + `（第二版起 ${escHtml(PF.FINAL_NAME)}二、${escHtml(PF.FINAL_NAME)}三…）。資料夾名稱建立後不能改。`
      + (plan.truncated ? ' <span class="proj-folder-warn">名稱過長，已截短。</span>' : '');
    const seq = createCheckSeq, folder = plan.proofFolder;
    createCheckTimer = setTimeout(() => checkProofFolder(folder, seq), 350);
  }

  // Not a gate: re-creating a project over the same folder picks its photos up
  // again, and a listing that fails never stops the create.
  async function checkProofFolder(folder, seq) {
    const listed = await listPrefix(folder);
    if (seq !== createCheckSeq) return;
    const note = document.getElementById('proj-folder-note');
    let state, text;
    if (!listed) { state = 'unknown'; text = '無法確認這個資料夾是否已有照片（不影響建立）'; }
    else if (listed.files.length) { state = 'existing'; text = `這個資料夾已有 ${listed.files.length} 張照片，會沿用`; }
    else if (listed.folders.length) { state = 'existing'; text = `這個資料夾已有 ${listed.folders.length} 個子資料夾（照片在裡面），會沿用`; }
    else { state = 'empty'; text = '目前沒有照片；上傳第一張時才會出現這個資料夾'; }
    note.dataset.state = state;
    note.textContent = text;
    note.hidden = false;
  }

  document.getElementById('proj-title')?.addEventListener('input', updateCreateForm);
  document.getElementById('proj-date')?.addEventListener('input', updateCreateForm);
  document.getElementById('proj-date')?.addEventListener('change', updateCreateForm);

  // GET /api/admin/projects — this photographer's projects, newest first,
  // straight from the Worker (docs/guest-picking.md). Replaces the old
  // per-browser localStorage cache: a project created on another browser
  // (or another day) now shows up here too.
  let showArchivedProjects = false;
  document.getElementById('proj-show-archived-toggle')?.addEventListener('change', function () {
    showArchivedProjects = this.checked;
    loadProjectList();
  });

  async function loadProjectList() {
    const box = document.getElementById('proj-recent-list');
    if (!box) return;
    try {
      const qs = showArchivedProjects ? '?archived=1' : '';
      const r = await fetch(`${WORKER_URL}/api/admin/projects${qs}`, {
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      if (!r.ok) { box.innerHTML = `<div class="empty">讀取失敗（${r.status}）</div>`; return; }
      const data = await r.json();
      renderProjectList(Array.isArray(data.projects) ? data.projects : []);
    } catch (e) {
      box.innerHTML = '<div class="empty">無法連線到 Worker</div>';
    }
  }

  // Client confirmation badge (docs/delivery.md), only for a delivered project
  // and only in addition to 已交件: confirmed (by whom) wins over open requests.
  // The ONE status computation: the badges below and the list's status filter / 待我處理 sort all read it.
  //   confirm: null | 'photographer' | 'confirmed' | 'revising' (only ever set for a delivered project)
  function projectStatus(p) {
    const delivered = !!(p && p.delivered_at);
    const open = Number(p && p.open_revision_count) || 0;
    let confirm = null;
    if (delivered) {
      if (p.client_confirmed_at) confirm = p.client_confirmed_by === 'photographer' ? 'photographer' : 'confirmed';
      else if (open > 0) confirm = 'revising';
    }
    return { phase: p ? p.phase : null, delivered, confirm, open };
  }
  function confirmBadgeHtml(p) {
    const st = projectStatus(p);
    if (st.confirm === 'photographer') return '<span class="badge badge-approved st-done" data-confirm-badge="photographer">已標記完成</span>';
    if (st.confirm === 'confirmed') return '<span class="badge badge-approved st-done" data-confirm-badge="confirmed">客戶已確認</span>';
    if (st.confirm === 'revising') return `<span class="badge badge-pending st-action" data-confirm-badge="revising">待修改 ${escHtml(st.open)}</span>`;
    return '';
  }
  // the photographer's turn: a selection is in (已送出), or the client asked for changes
  const needsPhotographer = p => { const st = projectStatus(p); return st.phase === 'submitted' || st.confirm === 'revising'; };
  function statusMatches(p, key) {
    if (key === 'all') return true;
    const st = projectStatus(p);
    switch (key) {
      case 'picking': return st.phase === 'picking';
      case 'submitted': return st.phase === 'submitted';
      case 'retouching': return st.phase === 'retouching' && !st.delivered;
      case 'delivered': return st.delivered;
      case 'confirmed': return st.confirm === 'confirmed' || st.confirm === 'photographer';
      case 'revising': return st.confirm === 'revising';
      default: return true;
    }
  }
  // projects.project_type: '' = unset. A value off the SHOOT_TYPES list was typed under 其他.
  const projectTypeOf = p => (p && typeof p.project_type === 'string' ? p.project_type.trim() : '');
  function typeMatches(p, key) {
    if (key === 'all') return true;
    const v = projectTypeOf(p);
    if (key === 'none') return v === '';
    if (key === SHOOT_TYPE_OTHER) return v !== '' && (v === SHOOT_TYPE_OTHER || !SHOOT_TYPES.includes(v));
    return v === key;
  }
  function searchMatches(p, q) {
    const n = q.trim().toLowerCase();
    if (!n) return true;
    return String(p.title || '').toLowerCase().includes(n) || String(p.owner_name || '').toLowerCase().includes(n);
  }
  function projectTypeOptionsHtml(value) {
    const typed = value !== '' && !SHOOT_TYPES.includes(value);
    const picked = typed ? SHOOT_TYPE_OTHER : value;
    return `<option value=""${picked === '' ? ' selected' : ''}>未分類</option>` + SHOOT_TYPES.map(t =>
      `<option value="${escHtml(t)}"${t === picked ? ' selected' : ''}>${escHtml(t)}</option>`).join('');
  }
  // the value a (select, typed box) pair stands for: the category, or the typed text for 其他.
  // 其他 with nothing typed is NOT a category (null) — never the literal '其他'.
  function projectTypeValue(sel, other) {
    return sel.value === SHOOT_TYPE_OTHER ? (other.value.trim() || null) : sel.value;
  }
  function wireTypePair(sel, other) {
    sel.addEventListener('change', () => {
      const isOther = sel.value === SHOOT_TYPE_OTHER;
      other.style.display = isOther ? '' : 'none';
      if (isOther) other.focus(); else other.value = '';
    });
  }
  const PROJECT_TYPE_ERRORS = {
    invalid_project_type: '攝影類別不正確（最多 20 字）',
    project_type_unavailable: '攝影類別尚未啟用，請先執行 migration（2026-10-07-project-type.sql）',
  };

  // ── list filters ──
  let projectsCache = [];
  function initListControls() {
    document.getElementById('pl-status').innerHTML = LIST_STATUSES.map(([v, t]) => `<option value="${escHtml(v)}">${escHtml(t)}</option>`).join('');
    document.getElementById('pl-type').innerHTML = [['all', '全部類別'], ['none', '未分類']].concat(SHOOT_TYPES.map(t => [t, t]))
      .map(([v, t]) => `<option value="${escHtml(v)}">${escHtml(t)}</option>`).join('');
    document.getElementById('proj-type').innerHTML = projectTypeOptionsHtml('');
    wireTypePair(document.getElementById('proj-type'), document.getElementById('proj-type-other'));
    const onChange = () => {
      listFilter.q = document.getElementById('pl-q').value.trim().slice(0, 100);
      listFilter.status = document.getElementById('pl-status').value;
      listFilter.type = document.getElementById('pl-type').value;
      listFilter.sort = document.getElementById('pl-sort').value;
      history.replaceState(history.state, '', listUrl());
      drawProjectList();
    };
    ['pl-q'].forEach(id => document.getElementById(id).addEventListener('input', onChange));
    ['pl-status', 'pl-type', 'pl-sort'].forEach(id => document.getElementById(id).addEventListener('change', onChange));
  }
  // the hash → listFilter → the controls → the list (page load, Back, a link). Unknown values are ignored.
  function syncFilterFromHash() {
    const p = parseHash();
    const status = p.get('status'), type = p.get('type'), sort = p.get('sort');
    listFilter.q = (p.get('q') || '').slice(0, 100);
    listFilter.status = LIST_STATUSES.some(([v]) => v === status) ? status : 'all';
    listFilter.type = type === 'none' || SHOOT_TYPES.includes(type) ? type : 'all';
    listFilter.sort = sort === 'me' ? 'me' : 'default';
    document.getElementById('pl-q').value = listFilter.q;
    document.getElementById('pl-status').value = listFilter.status;
    document.getElementById('pl-type').value = listFilter.type;
    document.getElementById('pl-sort').value = listFilter.sort;
    drawProjectList();
  }

  // The phase badge by colour: 選片中 / 精修中 amber (in progress), 已送出 coral (waiting for
  // the photographer), anything else grey. Delivered is its own badge beside it.
  function phaseBadgeHtml(p) {
    const cls = p.phase === 'submitted' ? 'st-action' : (p.phase === 'picking' || p.phase === 'retouching') ? 'st-progress' : 'st-neutral';
    return `<span class="badge badge-approved ${cls}" data-phase-badge="${escHtml(p.phase || '')}">${escHtml(PHASE_LABEL[p.phase] || p.phase || '')}</span>`;
  }

  function renderProjectList(projects) {
    projectsCache = projects;
    drawProjectList();
  }

  function drawProjectList() {
    const box = document.getElementById('proj-recent-list');
    if (!box) return;
    const count = document.getElementById('pl-count');
    if (count) count.textContent = '';
    if (!projectsCache.length) { box.innerHTML = '<div class="empty">尚未建立過專案</div>'; return; }
    let projects = projectsCache.filter(p => statusMatches(p, listFilter.status) && typeMatches(p, listFilter.type) && searchMatches(p, listFilter.q));
    if (listFilter.sort === 'me') projects = projects.filter(needsPhotographer).concat(projects.filter(p => !needsPhotographer(p)));
    const filtering = listFilter.q !== '' || listFilter.status !== 'all' || listFilter.type !== 'all';
    if (count && filtering) count.textContent = `顯示 ${projects.length} / ${projectsCache.length} 個專案`;
    if (!projects.length) { box.innerHTML = '<div class="empty">沒有符合的專案</div>'; return; }
    box.innerHTML = projects.map(p => {
      const st = projectStatus(p);
      // ONE visible badge per row: confirmed > client asked for changes > delivered > phase.
      // The full set of states stays on the row element as data-* so filters / tests keep reading it.
      const badge = st.confirm ? confirmBadgeHtml(p)
        : st.delivered ? '<span class="badge badge-approved st-done" data-delivered-badge>已交件</span>'
        : phaseBadgeHtml(p);
      const flags = [p.archived_at ? 'archived' : '', p.modified_after_submit ? 'modified' : '', p.unnotified_submissions ? 'unnotified' : ''].filter(Boolean).join(' ');
      const meta = [projectTypeOf(p) ? `<span data-project-type-tag>${escHtml(projectTypeOf(p))}</span>` : '',
        escHtml(p.owner_name || '尚無人認領'), `送出 ${escHtml(p.submission_count)} 次`,
        p.archived_at ? '已封存' : '', p.modified_after_submit ? '已修改' : '',
        p.unnotified_submissions ? `${escHtml(p.unnotified_submissions)} 次送出未寄信` : ''].filter(Boolean);
      return `
      <div class="proj-recent-row" data-project-row="${escHtml(p.id)}" data-phase="${escHtml(p.phase || '')}" data-delivered="${st.delivered ? '1' : '0'}" data-confirm="${escHtml(st.confirm || '')}" data-flags="${escHtml(flags)}" role="button" tabindex="0">
        <div class="proj-recent-main">
          <div class="proj-row-title">
            <span class="proj-row-name">${escHtml(p.title || '（未命名）')}</span>
            ${badge}
          </div>
          <div class="pd-owner proj-row-meta" data-row-meta>${meta.join(' · ')}</div>
        </div>
        <div class="actions">
          ${p.token ? `<button type="button" class="btn btn-outline" data-copy-link="${escHtml(p.token)}">複製連結</button>` : ''}
          <button type="button" class="btn btn-outline" data-open-project="${escHtml(p.id)}">開啟</button>
        </div>
      </div>`; }).join('');
    box.querySelectorAll('[data-open-project]').forEach(btn => {
      btn.addEventListener('click', () => openProjectDetail(btn.dataset.openProject));
    });
    // The whole row opens the project too. A click that lands on (or inside) a button or link
    // belongs to that control — 開啟 opens by itself, 複製連結 copies — so the row ignores it
    // and nothing opens twice. Enter / Space on the focused row itself opens it.
    box.querySelectorAll('[data-project-row]').forEach(row => {
      row.addEventListener('click', e => {
        const inner = e.target.closest('button, a, input, select, textarea, label');
        if (inner && row.contains(inner)) return;
        openProjectDetail(row.dataset.projectRow);
      });
      row.addEventListener('keydown', e => {
        if (e.target !== row || (e.key !== 'Enter' && e.key !== ' ')) return;
        e.preventDefault();
        openProjectDetail(row.dataset.projectRow);
      });
    });
    box.querySelectorAll('[data-copy-link]').forEach(btn => {

  function projectLink(token) {
    // index.html sits beside admin.html; the pick page needs nothing but ?t=.
    const base = location.href.replace(/admin\.html.*$/, 'index.html');

  // successful create. Every open starts clean (fields, error, the old 連結已建立 box).

  document.getElementById('proj-create-btn')?.addEventListener('click', async function () {
    const errEl = document.getElementById('proj-create-err');
    errEl.textContent = '';
    const folderPlan = PF.plan(document.getElementById('proj-date').value, document.getElementById('proj-title').value);
    if (!folderPlan.ok) { errEl.textContent = folderPlan.reason === 'name' ? '請輸入專案名稱' : '請選擇拍攝日期'; return; }
    const limitRaw = document.getElementById('proj-pick-limit').value.trim();
    const priceRaw = document.getElementById('proj-extra-price').value.trim();
    const pick_limit = limitRaw === '' ? null : parseInt(limitRaw, 10);
    const extra_price = priceRaw === '' ? null : parseInt(priceRaw, 10);
    if (pick_limit !== null && (!Number.isInteger(pick_limit) || pick_limit < 0)) {
      errEl.textContent = '精修張數上限需為 0 以上整數'; return;
    }
    if (extra_price !== null && (!Number.isInteger(extra_price) || extra_price < 0)) {
      errEl.textContent = '加選單價需為 0 以上整數'; return;
    }
    // 最多可加選: the number the field shows; a cleared field sends NOTHING (the
    // Worker then applies the studio default). Never null — null would mean
    // "no plan cap" to the Worker.
    const extraRaw = document.getElementById('proj-extra-max').value.trim();
    const extraMaxNum = extraRaw === '' ? undefined : Number(extraRaw);
    if (extraMaxNum !== undefined && (!Number.isInteger(extraMaxNum) || extraMaxNum < 0 || extraMaxNum > 500)) {
      errEl.textContent = '最多可加選需為 0–500 的整數'; return;
    }
    // the date field is the shoot date (it also names the folder): the project keeps it for the 完成頁
    const createBody = { title: folderPlan.title, folders: [folderPlan.proofFolder], pick_limit, extra_price, shoot_date: document.getElementById('proj-date').value };
    if (extraMaxNum !== undefined) createBody.extra_max = extraMaxNum;
    const typeValue = projectTypeValue(document.getElementById('proj-type'), document.getElementById('proj-type-other'));
    if (typeValue) createBody.project_type = typeValue;   // 未分類 sends nothing
    this.disabled = true;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(createBody),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { errEl.textContent = data.code && PROJECT_TYPE_ERRORS[data.code] ? PROJECT_TYPE_ERRORS[data.code] : data.code && SHOOT_DATE_ERRORS[data.code] && data.code !== 'invalid_body' ? SHOOT_DATE_ERRORS[data.code] : data.error || `建立失敗（${r.status}）`; return; }
      const link = projectLink(data.token);
      const linkOut = document.getElementById('proj-link-output');
      linkOut.value = link;
      linkOut.dataset.title = typeof data.project?.title === 'string' ? data.project.title : (createBody.title || '');
      linkOut.dataset.token = data.token;
      document.getElementById('proj-create-result').style.display = 'block';
      await loadProjectList();
      closeCreatePanel();
      resetCreateFields();
      // Stay on the list: the panel closes, the new project is a row with its own 複製連結.
    } catch (e) {
      errEl.textContent = '無法連線到 Worker';
    } finally {
      // back to what the form says now: still valid → on; emptied after a create → off
      this.disabled = !PF.plan(document.getElementById('proj-date').value, document.getElementById('proj-title').value).ok;
    }

  function pickerNameOf(pickers, id) {
    const p = (pickers || []).find(x => x.id === id);
    return p ? p.name : '（未知）';
  }

  // What changed between two submissions, by photo key — the same comparison
  // worker.js's pickDiff makes for the notification email, redone here since
  // the admin view has no email to read it off.
  function projectDiff(current, previous) {
    const now = new Set(current || []);
    const before = new Set(previous || []);
    return {
      added: (current || []).filter(k => !before.has(k)),
      removed: (previous || []).filter(k => !now.has(k)),
    };
  }

  // Photos whose retouch pins differ between two submissions (each a
  // {photo_key: [{x,y,note}]} snapshot, or null before the D1 migration ran —
  // treated as none). Only the count and the file names are shown: the pins'
  // own notes are guest text and never rendered here.
  function marksChangedKeys(current, previous) {
    const a = current && typeof current === 'object' ? current : {};
    const b = previous && typeof previous === 'object' ? previous : {};
    const norm = v => JSON.stringify((Array.isArray(v) ? v : []).map(m => [m && m.x, m && m.y, m && m.note]));
    return Array.from(new Set([...Object.keys(a), ...Object.keys(b)]))
      .filter(k => norm(a[k]) !== norm(b[k])).sort();
  }

  // Opens a project's detail view, or — when that project is already the one on
  // screen — re-reads it and redraws in place (every action calls this to refresh).
  // A refresh keeps the old drawing until the new one replaces it in one step: no
  // 載入中… in between, so nothing on the page disappears and the scroll position stays.
  async function openProjectDetail(id) {
    if (!id) return;
    const body = document.getElementById('project-detail-body');
    if (!document.getElementById('project-detail-panel') || !body) return;
    const entering = detailShownId !== id;
    const seq = ++openSeq;
    currentProjectId = id;
    // The hash is the detail view's address. index.html?project=<id> links back to it
    // with a plain <a> (same tab), so the browser Back / phone back gesture returns to
    // admin.html on that project; the hash is what lets this page reopen it, whether
    // the browser replays the page from bfcache or does a fresh load.
    if (projectIdFromHash() !== id) history.pushState({ pdDetail: 1 }, '', location.pathname + location.search + buildHash(id));
    showProjectNotice('');
    setProjectsMode(true);
    if (entering) {
      detailShownId = id;
      body.innerHTML = '<div class="empty">載入中…</div>';
    }
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(id)}`, {
        headers: { 'Authorization': `Bearer ${getToken()}` },
      });
      if (seq !== openSeq || !detailMode) return;   // another project was opened, or 返回 was pressed
      if (r.status === 404) {
        // a deleted project, a mistyped or stale link: say so on the list instead of a blank page
        history.replaceState(null, '', listUrl());
        body.innerHTML = '';
        setProjectsMode(false);
        showProjectNotice('找不到這個專案，可能已被刪除。');
        return;
      }
      if (!r.ok) { body.innerHTML = `<div class="empty">讀取失敗（${r.status}）</div>`; return; }
      const data = await r.json();
      if (seq !== openSeq || !detailMode) return;
      renderProjectDetail(data);
    } catch (e) {
      if (seq !== openSeq || !detailMode) return;
      body.innerHTML = '<div class="empty">無法連線到 Worker</div>';
    }
  }

  const PHASE_LABEL = { picking: '選片中', submitted: '已送出', retouching: '精修中' };

  const TOKEN_STATUS_LABEL = { live: '有效', revoked: '已撤銷', expired: '已過期' };

  // ── Project detail sections ────────────────────────────────────────────────
  // Each block below the header has a title row — title, a one-line summary, ▾/▸ —
  // that opens and closes its body (display:none on the body container; every id
  // inside stays in the DOM). Open or closed is: what the photographer chose on
  // this page (secChoice), else what this browser remembers (localStorage — a
  // per-browser convenience, so every access is guarded and nothing depends on it),
  // else the section's default. Keyed by section name, not by project.
  const SEC_TITLE = { delivery: '交件', settings: '設定', selections: '目前選取', orders: '訂單', submissions: '送出紀錄', people: '挑選人與連結' };
  const SEC_KEY = 'pd_sec_';
  let secProject = null;       // the project being drawn (the defaults depend on it)
  let secData = null;          // what the summaries count: selections, submissions, pickers, links, owner
  const secChoice = {};        // name -> boolean, set by a click on a title row (kept even when storage is not)
  const secAuto = {};          // name -> boolean, 訂單 opened (or not) by itself on what its orders say; not a choice

  function secStored(name) {
    try {
      const v = localStorage.getItem(SEC_KEY + name);
      return v === '1' ? true : v === '0' ? false : null;
    } catch (e) { return null; }
  }
  function secStore(name, open) {
    try { localStorage.setItem(SEC_KEY + name, open ? '1' : '0'); } catch (e) { /* storage unavailable: the choice lives in secChoice */ }
  }
  // 交件 is open whenever it is there (retouching or delivered); 目前選取 once the guest
  // has submitted; 訂單 opens by itself when its orders arrive with something waiting;
  // the rest start closed.
  function secDefault(name) {
    if (name === 'delivery') return true;
    if (name === 'selections') return !!secProject && secProject.phase === 'submitted';
    return false;
  }
  function secIsOpen(name) {
    if (name in secChoice) return secChoice[name];
    const stored = secStored(name);
    if (stored !== null) return stored;
    return name in secAuto ? secAuto[name] : secDefault(name);
  }
  function secHtml(name, inner, headExtra) {
    const open = secIsOpen(name);
    return `<section class="pd-sec${open ? '' : ' is-collapsed'}" id="pd-sec-${name}" data-sec="${name}">
      <div class="pd-sec-head">
        <h4 class="pd-sec-h"><button type="button" class="pd-sec-btn" id="pd-sec-${name}-btn" aria-expanded="${open}" aria-controls="pd-sec-${name}-body">
          <span class="pd-sec-caret" aria-hidden="true">${open ? '▾' : '▸'}</span><span class="pd-sec-title">${SEC_TITLE[name]}</span><span class="pd-sec-sum" id="pd-sec-${name}-sum"></span></button></h4>
        ${headExtra || ''}
      </div>
      <div class="pd-sec-body" id="pd-sec-${name}-body" role="region" aria-labelledby="pd-sec-${name}-btn">${inner}</div>
    </section>`;
  }
  function secApply(name, open) {
    const sec = document.getElementById('pd-sec-' + name);
    const btn = document.getElementById(`pd-sec-${name}-btn`);
    if (!sec || !btn) return;
    sec.classList.toggle('is-collapsed', !open);
    btn.setAttribute('aria-expanded', String(open));
    btn.querySelector('.pd-sec-caret').textContent = open ? '▾' : '▸';
  }
  document.getElementById('project-detail-body')?.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('.pd-sec-btn');
    if (!btn) return;
    const name = btn.closest('.pd-sec').dataset.sec;
    // flip what is on screen, whatever put it there (default, auto-open, memory, an earlier click)
    const open = btn.getAttribute('aria-expanded') !== 'true';
    secChoice[name] = open;
    secStore(name, open);
    secApply(name, open);
  });
  // 交件 is not there at all until the project is being retouched (or is delivered)
  function secDeliveryShown(shown) {
    document.getElementById('pd-sec-delivery')?.classList.toggle('pd-sec-off', !shown);
  }

  // 'M/D' in Taipei time, for the one-line summaries
  function fmtDay(iso) {
    return Util.fmtDate(iso, 'md');
  }

  function secSummaries() {
    const p = currentProject || {}, d = secData || {};
    const out = {};
    // 交件
    if (!p.delivered_at) out.delivery = '尚未交件';
    else {
      const finals = Array.isArray(p.final_folders) ? p.final_folders : [];
      const leaf = finals.length ? (String(finals[0]).split('/').filter(Boolean).pop() || '') + '/' : '';
      const open = currentRevisions.filter(r => !r.resolved_at).length;
      const confirm = p.client_confirmed_at
        ? (p.client_confirmed_by === 'photographer' ? '已標記完成' : '客戶已確認')
        : (open > 0 ? `待修改 ${open}` : '客戶尚未確認');
      out.delivery = [`已交件 ${fmtDay(p.delivered_at)}`.trim(),
        leaf ? leaf + (finals.length > 1 ? ` 等 ${finals.length} 個` : '') : '', confirm].filter(Boolean).join(' · ');
    }
    // 設定: the plan and the proofs download switch
    const plan = [];
    plan.push(p.pick_limit == null ? '不限張數' : `${p.pick_limit} 張` + (p.extra_max != null ? ` + 加選 ${p.extra_max}` : ''));
    if (p.extra_price != null) plan.push(`加選 ${O.money(p.extra_price)}`);
    plan.push(`毛片下載：${p.allow_proof_download ? '開' : '關'}`);
    out.settings = plan.join(' · ');
    out.selections = `${d.selectedCount || 0} 張`;
    out.orders = ordersSummary();
    const subs = d.submissions || [];
    out.submissions = subs.length ? `${subs.length} 次，最近 ${fmtDay(subs[0].created_at)}` : '尚無送出';
    const live = (d.tokens || []).filter(t => t.status === 'live').length;
    const people = (d.pickers || []).length;
    out.people = `${d.ownerName || '尚無人認領'}${people > 1 ? `（共 ${people} 人）` : ''} · 連結有效 ${live} 條`;
    return out;
  }
  function ordersSummary() {
    if (!oc || oc.projectId !== currentProjectId || (!oc.loaded && !oc.failed)) return '載入中…';
    if (oc.failed) return '讀取失敗';
    const live = oc.orders.filter(o => o.status !== 'cancelled');
    const cancelled = oc.orders.length - live.length;
    const tail = cancelled ? `（另有 ${cancelled} 筆已取消）` : '';
    if (!live.length) return cancelled ? `尚無有效訂單（${cancelled} 筆已取消）` : '尚無訂單';
    const requested = live.filter(o => o.status === 'requested').length;
    const owed = live.reduce((n, o) => n + (Number(o.outstanding) || 0), 0);
    return `${live.length} 筆` + (requested ? ` · 待確認 ${requested}` : '') + (owed > 0 ? ` · 未收 ${O.money(owed)}` : ' · 已收齊') + tail;
  }
  // 訂單 opens by itself when something is waiting — unless the photographer
  // (or this browser's memory) already decided
  function ordersWaiting() {
    return !!oc && oc.orders.some(o => o.status !== 'cancelled' && (o.status === 'requested' || (Number(o.outstanding) || 0) > 0));
  }

  function refreshSecSummaries() {
    const sums = secSummaries();   // put in with textContent: a name stays text
    for (const name of Object.keys(SEC_TITLE)) {
      const el = document.getElementById(`pd-sec-${name}-sum`);
      if (el) el.textContent = sums[name] || '';
    }
  }

  // projects.shoot_date (docs/delivery.md, "Shoot date"): 'YYYY-MM-DD' or null. Util.fmtDate reads it as
  // a Taipei day, so a value that is no date at all comes back '' and shows nothing.
  function shootDateOf(project) {
    const v = project && typeof project.shoot_date === 'string' ? project.shoot_date : '';
    return /^\d{4}-\d{2}-\d{2}$/.test(v) ? Util.fmtDate(`${v}T00:00:00+08:00`, 'iso') : '';
  }
  const SHOOT_DATE_ERRORS = {
    invalid_shoot_date: '拍攝日期格式不正確',
    invalid_body: '拍攝日期格式不正確',
    shoot_date_unavailable: '拍攝日期尚未啟用，請先執行 migration（2026-10-07-project-shoot-date.sql）',
  };
  const shootDateError = (data, status) => SHOOT_DATE_ERRORS[data && data.code] || (data && data.error) || `儲存失敗（${status}）`;
  function renderShootDateHeader(project) {
    const el = document.getElementById('pd-shoot-text');
    if (!el) return;
    const d = shootDateOf(project);
    el.textContent = d ? `拍攝日期 ${d}` : '';

  function renderTypeTag(project) {
    const el = document.getElementById('pd-type-tag');

    el.textContent = v;

  function wireProjectType(project) {

        if (sel.value === SHOOT_TYPE_OTHER && value === null) { err.textContent = '請輸入類別名稱'; return; }
        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(currentProjectId)}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_type: value || null }),   // 未分類 clears it
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { err.textContent = PROJECT_TYPE_ERRORS[data && data.code] || (data && data.code === 'invalid_body' ? PROJECT_TYPE_ERRORS.invalid_project_type : null) || (data && data.error) || `儲存失敗（${r.status}）`; return; }
        project.project_type = data.project_type ?? null;

        if (row) { row.project_type = project.project_type; drawProjectList(); }
      } catch (e) {

  const RENAME_INVALID = '專案名稱格式不正確（1–200 字）';
  function wireRename(project) {
    const wrap = document.getElementById('pd-title-wrap');
    const form = document.getElementById('pd-rename-form');
    const input = document.getElementById('pd-rename-input');
    const save = document.getElementById('pd-rename-save');

    document.getElementById('pd-rename-cancel').addEventListener('click', close);
    input.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); close(); } });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (save.disabled) return;
      err.textContent = '';
      const title = input.value.trim().slice(0, 200);
      if (!title) { err.textContent = '專案名稱不能空白'; input.focus(); return; }
      save.disabled = true;

        const r = await fetch(`${WORKER_URL}/api/admin/projects/${encodeURIComponent(project.id)}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { err.textContent = data && data.code === 'invalid_body' ? RENAME_INVALID : '儲存失敗，請再試一次'; return; }
        project.title = typeof data.title === 'string' && data.title ? data.title : title;

  function wireShootDate(project) {

          method: 'PATCH',

          body: JSON.stringify({ shoot_date: input.value || null }),   // an emptied field clears it

        project.shoot_date = data.shoot_date ?? null;
        input.value = shootDateOf(project);
        renderShootDateHeader(project);
      } catch (e) {
        err.textContent = '無法連線到 Worker';

      }
