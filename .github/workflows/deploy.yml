name: Deploy to imhoti.tw studio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests
        run: node --test "worker/test/*.test.mjs"
      - name: Syntax check frontend scripts
        run: |
          set -e
          for f in $(git ls-files '*.js' ':!:**/vendor/**'); do
            node --check "$f"
          done

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          set -e
          sudo apt-get install -y lftp
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:$SFTP_PORT" << 'LFTP_SCRIPT'
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror -R \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .claude/ \
            --exclude-glob worker/ \
            --exclude-glob ai_stock/ \
            --exclude-glob node_modules/ \
            --exclude-glob *.md \
            --exclude-glob .gitignore \
            . /public_html/studio/
          bye
          LFTP_SCRIPT

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd worker
          # Replace placeholder with actual D1 database ID from secret
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ secrets.D1_DATABASE_ID }}/" wrangler.toml
          npx wrangler@latest deploy --no-bundle
