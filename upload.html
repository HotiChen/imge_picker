<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上傳照片 — Image Picker Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg:      #15120d;
    --surface: #1d1a14;
    --card:    #221f18;
    --border:  #3a3528;
    --rule:    #2e2a22;
    --accent:  #e5a448;
    --ink-90:  #e8e3da;
    --ink-55:  #8c8375;
    --ink-35:  #5a5248;
    --green:   #4caf7d;
    --red:     #e57373;
    --radius:  4px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--ink-90); font-size: 14px; }

/* ── Header ── */
.header {
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
}
.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-mark { width: 22px; height: 22px; background: var(--accent); color: #15120d; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px; flex-shrink: 0; }
.logo-name { font-weight: 600; font-size: 0.9rem; color: var(--ink-90); }
.header-sep { flex: 1; }
.btn-back { background: none; border: 1px solid var(--border); color: var(--ink-55); padding: 5px 12px; border-radius: var(--radius); cursor: pointer; font-size: 0.8rem; font-family: inherit; transition: color 0.15s, border-color 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn-back:hover { color: var(--ink-90); border-color: var(--ink-55); }

/* ── Layout ── */
.page { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

.section-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.2em; color: var(--ink-35); text-transform: uppercase; margin-bottom: 8px; }

/* ── Folder input ── */
.folder-row { display: flex; gap: 8px; margin-bottom: 28px; }
.folder-input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--ink-90); padding: 9px 12px; border-radius: var(--radius); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; outline: none; transition: border-color 0.15s; }
.folder-input:focus { border-color: var(--accent); }
.folder-input::placeholder { color: var(--ink-35); }
.btn-primary { background: var(--accent); border: none; color: #15120d; padding: 9px 18px; border-radius: var(--radius); cursor: pointer; font-size: 0.82rem; font-weight: 600; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
.btn-primary:hover { opacity: 0.85; }
.btn-secondary { background: none; border: 1px solid var(--border); color: var(--ink-55); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-size: 0.8rem; font-family: inherit; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
.btn-secondary:hover { color: var(--ink-90); border-color: var(--ink-55); }
.btn-danger { background: none; border: 1px solid var(--red); color: var(--red); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: opacity 0.15s; }
.btn-danger:hover { opacity: 0.75; }

/* ── Drop zone ── */
.drop-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 56px 32px;
    text-align: center;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    margin-bottom: 28px;
    position: relative;
}
.drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(229,164,72,0.06);
}
.drop-zone.drag-over .drop-icon { transform: scale(1.1); }
.drop-icon { font-size: 2.8rem; margin-bottom: 14px; transition: transform 0.2s; display: block; }
.drop-title { font-size: 1.05rem; font-weight: 600; color: var(--ink-90); margin-bottom: 8px; }
.drop-sub { font-size: 0.82rem; color: var(--ink-55); margin-bottom: 20px; }
.drop-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.drop-zone input[type=file] { display: none; }

/* ── Overall progress ── */
.overall-bar-wrap { display: none; margin-bottom: 20px; }
.overall-bar-wrap.visible { display: block; }
.overall-stats { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 0.8rem; color: var(--ink-55); }
.overall-stats strong { color: var(--ink-90); }
.bar-track { height: 5px; background: var(--card); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.2s; }
.bar-fill.complete { background: var(--green); }
.bar-fill.has-error { background: var(--red); }

/* ── Queue ── */
.queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.queue-title { font-size: 0.82rem; color: var(--ink-55); }
.queue-list { display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto; }

.queue-item {
    display: grid;
    grid-template-columns: 20px 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    font-size: 0.8rem;
    transition: background 0.15s;
}
.queue-item.uploading { border-color: var(--accent); background: rgba(229,164,72,0.04); }
.queue-item.done { border-color: var(--rule); }
.queue-item.error { border-color: var(--red); background: rgba(229,115,115,0.04); }

.qi-icon { text-align: center; font-size: 1rem; flex-shrink: 0; }
.qi-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-90); font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; }
.qi-size { color: var(--ink-55); white-space: nowrap; font-size: 0.72rem; }
.qi-status { font-size: 0.72rem; color: var(--ink-55); white-space: nowrap; min-width: 60px; text-align: right; }
.qi-status.uploading { color: var(--accent); }
.qi-status.done { color: var(--green); }
.qi-status.error { color: var(--red); }

/* ── Mini progress on item ── */
.queue-item .item-bar { display: none; grid-column: 1 / -1; height: 2px; background: var(--rule); border-radius: 1px; overflow: hidden; margin-top: 2px; }
.queue-item.uploading .item-bar { display: block; }
.item-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 0.1s; }

/* scrollbar */
.queue-list::-webkit-scrollbar { width: 4px; }
.queue-list::-webkit-scrollbar-track { background: transparent; }
.queue-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header class="header">
    <a class="header-logo" href="index.html">
        <div class="logo-mark">選</div>
        <span class="logo-name">Image Picker Studio</span>
    </a>
    <div class="header-sep"></div>
    <a href="index.html" class="btn-back">← 回選圖</a>
</header>

<div class="page">

    <!-- Target folder -->
    <div class="section-label">01 / 目標資料夾</div>
    <div class="folder-row">
        <input type="text" id="targetFolder" class="folder-input" placeholder="例：2025/wedding-chen/" value="">
        <button class="btn-primary" id="confirmFolderBtn">確認</button>
    </div>

    <!-- Drop zone -->
    <div class="section-label">02 / 拖曳上傳</div>
    <div class="drop-zone" id="dropZone">
        <span class="drop-icon">📂</span>
        <div class="drop-title">拖曳照片或整個資料夾到這裡</div>
        <div class="drop-sub">支援 JPG · PNG · WEBP · HEIC · TIFF · GIF<br>整個資料夾會保留子目錄結構上傳</div>
        <div class="drop-btns">
            <button class="btn-secondary" id="pickFilesBtn">選擇檔案</button>
            <button class="btn-secondary" id="pickFolderBtn">選擇資料夾</button>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.tiff,.tif">
        <input type="file" id="folderInput" multiple webkitdirectory accept="image/*,.heic,.heif,.tiff,.tif">
    </div>

    <!-- Overall progress -->
    <div class="overall-bar-wrap" id="overallWrap">
        <div class="overall-stats">
            <span id="overallLabel">準備中...</span>
            <strong id="overallPct">0%</strong>
        </div>
        <div class="bar-track">
            <div class="bar-fill" id="overallBar" style="width:0%"></div>
        </div>
    </div>

    <!-- Queue -->
    <div id="queueSection" style="display:none;">
        <div class="queue-header">
            <span class="queue-title" id="queueTitle">佇列</span>
            <button class="btn-danger" id="clearDoneBtn">清除已完成</button>
        </div>
        <div class="queue-list" id="queueList"></div>
    </div>

</div>

<script src="js/config.js"></script>
<script>
const CONCURRENCY = 4;
const IMAGE_EXTS = /\.(jpe?g|png|webp|heic|heif|tiff?|gif|avif|bmp)$/i;

let queue = [];          // { id, file, path, state, progress, error }
let activeCount = 0;
let targetFolder = '';

const $ = id => document.getElementById(id);

// ── Folder confirmation ──
$('confirmFolderBtn').addEventListener('click', () => {
    let v = $('targetFolder').value.trim();
    if (v && !v.endsWith('/')) v += '/';
    targetFolder = v;
    if (v) toast(`目標資料夾已設定：${v}`);
    else    toast('未設定資料夾，檔案將上傳至根目錄');
});

// ── File / folder pickers ──
$('pickFilesBtn').addEventListener('click',  () => $('fileInput').click());
$('pickFolderBtn').addEventListener('click', () => $('folderInput').click());
$('fileInput').addEventListener('change',   e => addFiles(Array.from(e.target.files), ''));
$('folderInput').addEventListener('change', e => {
    const files = Array.from(e.target.files);
    // webkitRelativePath = "folderName/sub/file.jpg" — strip first segment to keep structure
    addFiles(files.map(f => ({ file: f, path: extractRelPath(f) })));
    e.target.value = '';
});

function extractRelPath(f) {
    const rel = f.webkitRelativePath || f.name;
    // keep entire path including root folder name
    return rel;
}

// ── Drag & drop ──
const dz = $('dropZone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('drag-over'); });
dz.addEventListener('drop', async e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const items = Array.from(e.dataTransfer.items).filter(i => i.kind === 'file');
    const entries = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null).filter(Boolean);
    if (entries.length === 0) {
        // fallback: no FileSystemEntry API
        addFiles(Array.from(e.dataTransfer.files), '');
        return;
    }
    const collected = [];
    for (const entry of entries) {
        const results = await traverseEntry(entry, '');
        collected.push(...results);
    }
    addFiles(collected);
});

async function traverseEntry(entry, prefix) {
    if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        return [{ file, path: prefix + entry.name }];
    }
    if (entry.isDirectory) {
        const reader = entry.createReader();
        const allEntries = await readAllEntries(reader);
        const results = await Promise.all(
            allEntries.map(e => traverseEntry(e, prefix + entry.name + '/'))
        );
        return results.flat();
    }
    return [];
}

async function readAllEntries(reader) {
    const all = [];
    while (true) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        all.push(...batch);
    }
    return all;
}

// ── Add files to queue ──
function addFiles(input, prefix = '') {
    // input = File[] or {file, path}[]
    const items = Array.isArray(input) && input.length && input[0] instanceof File
        ? input.map(f => ({ file: f, path: (prefix || '') + f.name }))
        : input;

    const filtered = items.filter(({ file, path }) => IMAGE_EXTS.test(path || file.name));

    if (!filtered.length) { toast('沒有找到支援的圖片格式'); return; }

    for (const { file, path } of filtered) {
        const id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        queue.push({ id, file, path, state: 'pending', progress: 0, error: null });
    }

    renderQueue();
    $('overallWrap').classList.add('visible');
    $('queueSection').style.display = '';
    updateOverall();
    pump();
}

// ── Upload pump ──
function pump() {
    const pending = queue.filter(q => q.state === 'pending');
    const slots = CONCURRENCY - activeCount;
    pending.slice(0, slots).forEach(startUpload);
}

async function startUpload(item) {
    item.state = 'uploading';
    activeCount++;
    updateItemEl(item);
    updateOverall();

    const key = targetFolder + item.path;

    try {
        await uploadWithProgress(item, key);
        item.state = 'done';
        item.progress = 100;
    } catch (err) {
        item.state = 'error';
        item.error = err.message || '上傳失敗';
    }

    activeCount--;
    updateItemEl(item);
    updateOverall();
    pump();
}

function uploadWithProgress(item, key) {
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', `${CONFIG.WORKER_URL}/${encodeURIComponent(key)}`);
        xhr.setRequestHeader('Content-Type', item.file.type || 'application/octet-stream');
        if (CONFIG.PHOTOGRAPHER_TOKEN) xhr.setRequestHeader('Authorization', `Bearer ${CONFIG.PHOTOGRAPHER_TOKEN}`);
        xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable) {
                item.progress = Math.round(e.loaded / e.total * 100);
                updateItemProgress(item);
                updateOverall();
            }
        });
        xhr.addEventListener('load', () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve();
            else reject(new Error(`HTTP ${xhr.status}`));
        });
        xhr.addEventListener('error', () => reject(new Error('網路錯誤')));
        xhr.send(item.file);
    });
}

// ── Render ──
function renderQueue() {
    const list = $('queueList');
    // Create missing elements, don't re-render all (preserve progress)
    const existing = new Set(Array.from(list.children).map(el => el.dataset.id));
    for (const item of queue) {
        if (!existing.has(item.id)) {
            list.appendChild(makeItemEl(item));
        }
    }
    updateQueueTitle();
}

function makeItemEl(item) {
    const el = document.createElement('div');
    el.className = 'queue-item pending';
    el.dataset.id = item.id;
    el.innerHTML = `
        <span class="qi-icon">○</span>
        <span class="qi-name" title="${item.path}">${item.path}</span>
        <span class="qi-size">${fmtSize(item.file.size)}</span>
        <span class="qi-status">待上傳</span>
        <div class="item-bar"><div class="item-bar-fill" style="width:0%"></div></div>
    `;
    return el;
}

function updateItemEl(item) {
    const el = document.querySelector(`[data-id="${item.id}"]`);
    if (!el) return;
    el.className = `queue-item ${item.state}`;
    el.querySelector('.qi-icon').textContent =
        item.state === 'pending'   ? '○'
        : item.state === 'uploading' ? '↑'
        : item.state === 'done'      ? '✓'
        : '✕';
    const st = el.querySelector('.qi-status');
    st.className = `qi-status ${item.state}`;
    st.textContent =
        item.state === 'pending'   ? '待上傳'
        : item.state === 'uploading' ? `${item.progress}%`
        : item.state === 'done'      ? '完成'
        : item.error || '失敗';
}

function updateItemProgress(item) {
    const el = document.querySelector(`[data-id="${item.id}"]`);
    if (!el) return;
    const fill = el.querySelector('.item-bar-fill');
    if (fill) fill.style.width = item.progress + '%';
    const st = el.querySelector('.qi-status');
    if (st) st.textContent = item.progress + '%';
}

function updateOverall() {
    const total = queue.length;
    const done  = queue.filter(q => q.state === 'done').length;
    const errs  = queue.filter(q => q.state === 'error').length;
    const pct   = total ? Math.round((done + errs) / total * 100) : 0;

    const bar = $('overallBar');
    bar.style.width = pct + '%';
    bar.className = 'bar-fill' + (errs && done + errs === total ? ' has-error' : pct === 100 ? ' complete' : '');

    $('overallPct').textContent = pct + '%';
    if (pct === 100 && !activeCount) {
        $('overallLabel').textContent = errs
            ? `完成（${done} 成功 · ${errs} 失敗）`
            : `全部上傳完成（${done} 張）`;
    } else {
        $('overallLabel').textContent = `${done} / ${total} 完成${activeCount ? ` · 上傳中 ${activeCount}` : ''}`;
    }
    updateQueueTitle();
}

function updateQueueTitle() {
    const total = queue.length;
    const pending = queue.filter(q => q.state === 'pending').length;
    const uploading = queue.filter(q => q.state === 'uploading').length;
    $('queueTitle').textContent = `佇列 ${total} 個檔案${uploading ? ` · 上傳中 ${uploading}` : pending ? ` · 待上傳 ${pending}` : ''}`;
}

// ── Clear done ──
$('clearDoneBtn').addEventListener('click', () => {
    queue = queue.filter(q => q.state !== 'done');
    const list = $('queueList');
    list.querySelectorAll('.queue-item.done').forEach(el => el.remove());
    updateQueueTitle();
    if (!queue.length) $('queueSection').style.display = 'none';
});

// ── Helpers ──
function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function toast(msg) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#221f18;border:1px solid #3a3528;color:#e8e3da;padding:9px 18px;border-radius:4px;font-size:0.82rem;z-index:9999;pointer-events:none;white-space:nowrap;';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2800);
}

// ── Pre-fill folder from main app ──
const params = new URLSearchParams(location.search);
const pre = params.get('folder');
if (pre) { $('targetFolder').value = pre; targetFolder = pre.endsWith('/') ? pre : pre + '/'; }
</script>
</body>
</html>
