<!DOCTYPE html>
<html lang="zh-TW" data-studio-light>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上傳照片 — Image Picker Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Bright theme, shared with home.html / dashboard.html / admin.html — cream ground,
   white cards, dark ink, warm accent. The photographer's pages use the same tokens;
   the client's pages stay dark. --accent-ink is the one derived token: amber is only
   ~2:1 on white, so amber *text* uses this darker shade of it. */
:root {
    --bg:      #fff8ee;
    --surface: #ffffff;
    --card:    #fff3df;
    --accent:  #f5a13b;
    --accent-shadow: #d6801f;
    --accent-dim: #ffd9a8;
    --accent-ink: #8a4b00;
    --mint:    #d6f0e3;
    --peach:   #ffd9a8;
    --sky:     #cfe3fb;
    --ink-90:  #231b12;
    --ink-70:  #5b4f42;
    --ink-55:  #7a6d5d;
    --rule:    #efe6d8;
    --border:  #efe6d8;
    --success: #1f6b4f;
    --danger:  #c0392b;
    --radius:  8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--ink-90); font-size: 14px; overflow: hidden; }
input::placeholder { color: var(--ink-55); opacity: 1; }

/* ── Header ── */
.header {
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
}
.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-mark { width: 24px; height: 24px; background: var(--accent); color: var(--ink-90); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px; flex-shrink: 0; border-radius: 6px; }
.logo-name { font-weight: 600; font-size: 0.9rem; color: var(--ink-90); }
.header-sep { flex: 1; }
/* page-level back: a text link at the top-left, never a pill (shared convention, see .back-btn elsewhere) */
.back-btn, .btn-back { background: none; border: 0; color: var(--ink-70); padding: 0 8px; margin-left: -8px; min-height: 36px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: color 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
.back-btn:hover, .btn-back:hover { color: var(--ink-90); text-decoration: underline; }
@media (max-width: 640px) { .back-btn, .btn-back { min-height: 44px; } }

/* ── App layout ── */
.layout {
    display: flex;
    height: calc(100vh - 52px);
    overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
    width: 230px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
}
.sidebar-header {
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
}
.sidebar-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    color: var(--ink-55);
    text-transform: uppercase;
}
.sidebar-refresh {
    background: none; border: none; color: var(--ink-55); cursor: pointer;
    font-size: 0.8rem; padding: 1px 4px; border-radius: 3px;
    transition: color 0.15s;
}
.sidebar-refresh:hover { color: var(--ink-90); }
.sidebar-tree {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
}
.sidebar-tree::-webkit-scrollbar { width: 3px; }
.sidebar-tree::-webkit-scrollbar-track { background: transparent; }
.sidebar-tree::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

/* Sidebar tree nodes */
.sb-node { }
.sb-row {
    display: flex;
    align-items: center;
    gap: 0;
    height: 28px;
    padding-right: 8px;
    cursor: pointer;
    border-radius: 0;
    transition: background 0.1s;
}
.sb-row:hover { background: var(--card); }
.sb-row.selected { background: var(--accent-dim); }
.sb-row.selected .sb-name { color: var(--ink-90); font-weight: 600; }

.sb-toggle {
    width: 24px;
    height: 28px;
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--ink-55);
    cursor: pointer;
    font-size: 0.55rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, color 0.15s;
    padding: 0;
}
.sb-toggle:hover { color: var(--ink-90); }
.sb-toggle.open { transform: rotate(90deg); }
.sb-toggle.leaf { visibility: hidden; cursor: default; }

.sb-name {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    color: var(--ink-70);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-align: left;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.1s;
}
.sb-name:hover { color: var(--ink-90); }

/* Add subfolder button (shown on row hover) */
.sb-add {
    display: none;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--accent-dim);
    color: var(--ink-70);
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.75rem;
    align-items: center;
    justify-content: center;
    margin-right: 4px;
    line-height: 1;
    transition: color 0.1s, border-color 0.1s;
}
.sb-row:hover .sb-add { display: flex; }
.sb-add:hover { color: var(--ink-90); border-color: var(--accent); }

/* Inline new-folder input row */
.sb-new-row {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    padding-right: 8px;
}
.sb-new-icon { font-size: 0.75rem; color: var(--ink-55); flex-shrink: 0; }
.sb-new-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--ink-90);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.73rem;
    padding: 2px 6px;
    border-radius: 6px;
    outline: none;
}
.sb-new-input:focus { box-shadow: 0 0 0 3px var(--accent-dim); }

.sb-children { display: none; }

.sb-loading, .sb-empty {
    padding: 12px 14px;
    font-size: 0.75rem;
    color: var(--ink-55);
    font-family: 'IBM Plex Mono', monospace;
}

.sidebar-header-btns { display: flex; gap: 4px; }
.sidebar-add-root { font-size: 0.9rem; }
.sidebar-new-root { display: none; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
/* locked target (?lock=1): no folder tree at all, the target bar carries the lock */
body.folder-locked .sidebar { display: none; }
.target-bar[data-locked="1"] { border-color: var(--accent); }
.target-bar[data-locked="1"] .target-hint { color: var(--accent-ink); font-weight: 600; }
.sb-new-row--root { padding-left: 4px; }

/* ── Main panel ── */
.main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 28px 60px;
    min-width: 0;
}
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

.section-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.2em; color: var(--ink-55); text-transform: uppercase; margin-bottom: 8px; }

/* ── Target folder bar ── */
.target-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(90,60,20,.06);
}
.target-icon { font-size: 1rem; flex-shrink: 0; }
.target-path {
    flex: 1;
    min-width: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: var(--ink-90);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.target-path.empty { color: var(--ink-55); }
.target-hint { font-size: 0.72rem; color: var(--ink-55); white-space: nowrap; }

/* ── Buttons ── */
.btn-primary { background: var(--accent); border: none; color: var(--ink-90); padding: 9px 18px; border-radius: 999px; cursor: pointer; font-size: 0.82rem; font-weight: 600; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
.btn-primary:hover { opacity: 0.85; }
.btn-secondary { background: var(--surface); border: 1px solid var(--accent-dim); color: var(--ink-70); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 0.8rem; font-family: inherit; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
.btn-secondary:hover { color: var(--ink-90); border-color: var(--accent); }
.btn-danger { background: var(--surface); border: 1px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: opacity 0.15s; }
.btn-danger:hover { opacity: 0.75; }
.btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-danger:focus-visible, .btn-back:focus-visible, .back-btn:focus-visible { outline: 2px solid var(--ink-90); outline-offset: 2px; }

/* ── Drop zone ── */
.drop-zone {
    border: 2px dashed var(--accent);
    background: var(--surface);
    border-radius: 14px;
    padding: 44px 28px;
    text-align: center;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    margin-bottom: 24px;
    position: relative;
}
.drop-zone.drag-over { border-color: var(--accent-shadow); background: var(--card); }
.drop-zone.drag-over .drop-icon { transform: scale(1.1); }
.drop-zone.no-target { opacity: 0.7; pointer-events: none; }
.drop-icon { font-size: 2.4rem; margin-bottom: 12px; transition: transform 0.2s; display: block; }
.drop-title { font-size: 1rem; font-weight: 600; color: var(--ink-90); margin-bottom: 6px; }
.drop-sub { font-size: 0.8rem; color: var(--ink-70); margin-bottom: 18px; }
.drop-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.drop-zone input[type=file] { display: none; }

/* ── Overall progress ── */
.overall-bar-wrap { display: none; margin-bottom: 20px; }
.overall-bar-wrap.visible { display: block; }
.overall-stats { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 0.8rem; color: var(--ink-70); }
.overall-stats strong { color: var(--ink-90); }
.bar-track { height: 6px; background: var(--accent-dim); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent-shadow); border-radius: 3px; transition: width 0.2s; }
.bar-fill.complete { background: var(--success); }
.bar-fill.has-error { background: var(--danger); }

/* ── Queue / Tree ── */
.queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.queue-title { font-size: 0.82rem; color: var(--ink-70); }
.queue-list { display: flex; flex-direction: column; gap: 2px; }

/* File row */
.queue-item {
    display: grid;
    grid-template-columns: 18px 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    font-size: 0.8rem;
    transition: background 0.15s;
}
.queue-item.uploading { border-color: var(--accent); background: var(--card); }
/* a finished row settles into the page instead of fading (opacity would pull
   its text under the 4.5:1 floor) */
.queue-item.done { background: var(--bg); }
.queue-item.error { border-color: var(--danger); background: var(--surface); }

.qi-icon { text-align: center; font-size: 0.9rem; flex-shrink: 0; }
.qi-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-90); font-family: 'IBM Plex Mono', monospace; font-size: 0.73rem; }
.qi-size { color: var(--ink-55); white-space: nowrap; font-size: 0.7rem; }
.qi-status { font-size: 0.7rem; color: var(--ink-70); white-space: nowrap; min-width: 52px; text-align: right; }
.qi-status.uploading { color: var(--accent-ink); }
.qi-status.done { color: var(--success); }
.qi-status.done.warn { color: var(--accent-ink); }
.qi-status.error { color: var(--danger); }

/* Mini progress on item */
.queue-item .item-bar { display: none; grid-column: 1 / -1; height: 3px; background: var(--accent-dim); border-radius: 2px; overflow: hidden; margin-top: 1px; }
.queue-item.uploading .item-bar { display: block; }
.item-bar-fill { height: 100%; background: var(--accent-shadow); border-radius: 2px; transition: width 0.1s; }

/* Folder node in upload tree */
.tree-dir-summary {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    cursor: pointer;
    list-style: none;
    user-select: none;
    font-size: 0.78rem;
}
.tree-dir-summary::-webkit-details-marker { display: none; }
.tree-chevron { font-size: 0.55rem; color: var(--ink-55); transition: transform 0.15s; flex-shrink: 0; }
details[open] > .tree-dir-summary .tree-chevron { transform: rotate(90deg); }
.tree-dir-name { font-family: 'IBM Plex Mono', monospace; color: var(--ink-90); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-dir-meta { color: var(--ink-55); white-space: nowrap; font-size: 0.68rem; flex-shrink: 0; }
.tree-children { padding-left: 14px; margin-top: 2px; display: flex; flex-direction: column; gap: 2px; }

/* ── Retry controls (failed uploads) ── */
button[hidden] { display: none !important; }
.queue-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.queue-item.error { grid-template-columns: 18px 1fr auto auto auto; }
.qi-retry { padding: 3px 12px; font-size: 0.72rem; }

/* ── Phone (<= 768px): the folder tree is a full-width panel ABOVE the drop zone, with its own scroll
   (max 40vh). A collapsible toggle was the alternative; a scroll panel keeps the tree visible and
   needs no extra state. The page itself scrolls as a document. Above 768px nothing here applies. ── */
@media (max-width: 768px) {
    html, body { height: auto; min-height: 100%; overflow: visible; }
    .header { padding: 0 12px; gap: 10px; }
    .back-btn, .btn-back, .header-logo { min-height: 44px; }
    .layout { flex-direction: column; height: auto; overflow: visible; }
    .sidebar { width: 100%; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--rule); }
    .sidebar-header { padding: 4px 8px 4px 14px; }
    .sidebar-refresh { min-width: 44px; min-height: 44px; font-size: 1.1rem; }
    .sb-row { height: 44px; }
    .sb-toggle { width: 44px; height: 44px; }
    .sb-name { min-height: 44px; font-size: 0.85rem; }
    .sb-row .sb-add { display: flex; width: 44px; height: 44px; margin-right: 0; border: 0; background: none; border-radius: 0; font-size: 1.2rem; }
    .sb-new-row { height: 44px; }
    .sb-new-input { min-height: 36px; font-size: 16px; }
    .main { flex: none; width: 100%; overflow: visible; padding: 16px 16px 40px; }
    .target-bar { margin-bottom: 16px; }
    .target-path { white-space: normal; word-break: break-all; }
    .drop-zone { padding: 28px 16px; margin-bottom: 16px; }
    .drop-btns .btn-secondary { flex: 1 1 140px; min-height: 44px; }
    .queue-header { flex-wrap: wrap; gap: 8px; }
    .queue-actions { justify-content: flex-start; }
    .btn-danger, .queue-actions .btn-secondary { min-height: 44px; min-width: 44px; padding: 8px 14px; }
    .tree-dir-summary { min-height: 44px; }
    .queue-item, .queue-item.error { grid-template-columns: 18px minmax(0, 1fr) auto; }
    .qi-status { grid-column: 2; min-width: 0; text-align: left; white-space: normal; }
    .qi-retry { grid-column: 3; min-height: 44px; min-width: 64px; }
}
</style>
</head>
<body>

<header class="header">
    <a href="dashboard.html" class="back-btn btn-back">← 返回後台</a>
    <a class="header-logo" href="index.html">
        <div class="logo-mark">選</div>
        <span class="logo-name">Image Picker Studio</span>
    </a>
    <span id="buildVersion"></span>
    <div class="header-sep"></div>
</header>

<div class="layout">

    <!-- ── Sidebar: R2 folder tree ── -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-label">R2 資料夾</span>
            <div class="sidebar-header-btns">
                <button class="sidebar-refresh sidebar-add-root" id="sidebarAddRootBtn" title="新增根目錄資料夾">+</button>
                <button class="sidebar-refresh" id="sidebarRefreshBtn" title="重新整理">↺</button>
            </div>
        </div>
        <!-- inline input for root-level new folder -->
        <div id="sidebarNewRoot" class="sidebar-new-root">
            <div class="sb-new-row sb-new-row--root">
                <span class="sb-new-icon">📁</span>
                <input class="sb-new-input" id="sidebarNewRootInput" placeholder="資料夾名稱 (可含 /)">
            </div>
        </div>
        <div class="sidebar-tree" id="sidebarTree">
            <div class="sb-loading">載入中…</div>
        </div>
    </aside>

    <!-- ── Main panel ── -->
    <div class="main">

        <!-- Target folder display -->
        <div class="section-label">01 / 目標資料夾</div>
        <div class="target-bar" id="targetBar">
            <span class="target-icon">📁</span>
            <span class="target-path empty" id="targetDisplay">← 從左側點選資料夾</span>
            <span class="target-hint" id="targetHint"></span>
        </div>

        <!-- Drop zone -->
        <div class="section-label">02 / 拖曳上傳</div>
        <div class="drop-zone no-target" id="dropZone">
            <span class="drop-icon">📂</span>
            <div class="drop-title">拖曳照片或整個資料夾到這裡</div>
            <div class="drop-sub">支援 JPG · PNG · WEBP · HEIC · TIFF · GIF<br>整個資料夾會保留子目錄結構上傳</div>
            <div class="drop-btns">
                <button class="btn-secondary" id="pickFilesBtn">選擇檔案</button>
                <button class="btn-secondary" id="pickFolderBtn">選擇資料夾</button>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.tiff,.tif">
            <input type="file" id="folderInput" multiple webkitdirectory accept="image/*,.heic,.heif,.tiff,.tif">
        </div>

        <!-- Overall progress -->
        <div class="overall-bar-wrap" id="overallWrap">
            <div class="overall-stats">
                <span id="overallLabel">準備中...</span>
                <strong id="overallPct">0%</strong>
            </div>
            <div class="bar-track">
                <div class="bar-fill" id="overallBar" style="width:0%"></div>
            </div>
        </div>

        <!-- Queue -->
        <div id="queueSection" style="display:none;">
            <div class="queue-header">
                <span class="queue-title" id="queueTitle">佇列</span>
                <div class="queue-actions">
                    <button class="btn-secondary" id="retryAllBtn" hidden>重試全部失敗項目</button>
                    <button class="btn-danger" id="clearDoneBtn">清除已完成</button>
                </div>
            </div>
            <div class="queue-list" id="queueList"></div>
        </div>

    </div><!-- /.main -->
</div><!-- /.layout -->

<script src="js/build-version.js?v=20261012a"></script>
<script src="js/config.js?v=20261012a"></script>
<script src="js/auth.js?v=20261012a"></script>
<script src="js/util.js?v=20261012a"></script>
<script>
const CONCURRENCY = 4;
// Auto retry: only network errors, timeouts, HTTP 5xx and 429; waits 2 s then 5 s. Anything else (401/403/413/other 4xx)
// is shown with its reason and left to the 重試 button.
const RETRY_DELAYS = [2000, 5000];
const UPLOAD_TIMEOUT_MS = 15 * 60 * 1000;   // per file; a stalled connection ends as a retryable timeout
const IMAGE_EXTS = /\.(jpe?g|png|webp|heic|heif|tiff?|gif|avif|bmp)$/i;

// Sizes the Worker serves for ?w=. Descending, because each thumbnail is
// downscaled from the previous one rather than from the full-res decode.
const THUMB_SIZES = [1600, 1200, 400];
const THUMB_QUALITY = 0.82;

let queue = [];
let activeCount = 0;
let targetFolder = '';
// ?folder=…&lock=1 (from a project page): the target is that folder and nothing else —
// no folder tree, no new folders — so a photo cannot land in another project's folder.
// Without lock=1 (or without a folder to lock) the page works exactly as it always did.
let folderLocked = false;

const $ = id => document.getElementById(id);

// ── Helpers ──
function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}
// the folder tree is on the left on a desktop and above on a phone (<= 768px, see the @media block)
const isNarrow = () => window.matchMedia('(max-width: 768px)').matches;
const sideWord = () => isNarrow() ? '上方' : '左側';
function toast(msg) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);color:var(--ink-90);box-shadow:0 8px 24px rgba(90,60,20,.18);padding:9px 18px;border-radius:999px;font-size:0.82rem;z-index:9999;pointer-events:none;white-space:nowrap;';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2800);
}

// ── Sidebar: R2 folder tree ──
async function fetchFolders(prefix) {
    try {
        const url = `${CONFIG.WORKER_URL}?list=${encodeURIComponent(prefix)}`;
        const headers = {};
        if (CONFIG.PHOTOGRAPHER_TOKEN) headers['Authorization'] = `Bearer ${CONFIG.PHOTOGRAPHER_TOKEN}`;
        const res = await fetch(url, { headers });
        if (!res.ok) return [];
        const json = await res.json();
        return json.folders || [];
    } catch { return []; }
}

async function initSidebar() {
    const tree = $('sidebarTree');
    tree.innerHTML = '<div class="sb-loading">載入中…</div>';
    const folders = await fetchFolders('');
    tree.innerHTML = '';
    if (!folders.length) {
        tree.innerHTML = '<div class="sb-empty">（無資料夾）</div>';
        return;
    }
    for (const f of folders) tree.appendChild(makeSbNode(f));
}

// preloaded=true: skip R2 fetch on first expand (used for newly created virtual folders)
function makeSbNode(path, preloaded = false) {
    const parts = path.split('/').filter(Boolean);
    const name = parts[parts.length - 1];

    const wrap = document.createElement('div');
    wrap.className = 'sb-node';
    wrap.dataset.path = path;

    const row = document.createElement('div');
    row.className = 'sb-row';
    row.style.paddingLeft = ((parts.length - 1) * 14 + 4) + 'px';

    const toggle = document.createElement('button');
    toggle.className = 'sb-toggle';
    toggle.textContent = '▶';

    const nameBtn = document.createElement('button');
    nameBtn.className = 'sb-name';
    nameBtn.textContent = name + '/';
    nameBtn.title = path;

    const addBtn = document.createElement('button');
    addBtn.className = 'sb-add';
    addBtn.textContent = '+';
    addBtn.title = '新增子資料夾';

    row.appendChild(toggle);
    row.appendChild(nameBtn);
    row.appendChild(addBtn);

    const childrenDiv = document.createElement('div');
    childrenDiv.className = 'sb-children';

    wrap.appendChild(row);
    wrap.appendChild(childrenDiv);

    // Select folder on name click
    nameBtn.addEventListener('click', () => {
        document.querySelectorAll('.sb-row.selected').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
        selectFolder(path);
    });

    // + → inline new-subfolder input
    addBtn.addEventListener('click', e => {
        e.stopPropagation();
        // ensure children visible
        if (childrenDiv.style.display === 'none') {
            childrenDiv.style.display = 'block';
            toggle.classList.add('open');
        }
        showNewFolderInput(childrenDiv, path, (parts.length) * 14 + 4);
    });

    // Expand/collapse on toggle click
    let loaded = preloaded; // preloaded=true skips R2 fetch (virtual/new folders)
    let open = false;
    toggle.addEventListener('click', async e => {
        e.stopPropagation();
        open = !open;
        if (open) {
            toggle.classList.add('open');
            childrenDiv.style.display = 'block';
            if (!loaded) {
                loaded = true;
                toggle.textContent = '…';
                const subs = await fetchFolders(path);
                toggle.textContent = '▶';
                if (!subs.length) {
                    toggle.classList.add('leaf');
                } else {
                    for (const sub of subs) childrenDiv.appendChild(makeSbNode(sub));
                }
            }
        } else {
            toggle.classList.remove('open');
            childrenDiv.style.display = 'none';
        }
    });

    return wrap;
}

// ── Inline new-folder input ──
function showNewFolderInput(container, parentPath, indentPx) {
    if (folderLocked) return;
    // Only one input at a time
    container.querySelectorAll('.sb-new-row').forEach(el => el.remove());

    const row = document.createElement('div');
    row.className = 'sb-new-row';
    row.style.paddingLeft = indentPx + 'px';

    const icon = document.createElement('span');
    icon.className = 'sb-new-icon';
    icon.textContent = '📁';

    const input = document.createElement('input');
    input.className = 'sb-new-input';
    input.placeholder = '名稱 (可含 / 多層)';

    row.appendChild(icon);
    row.appendChild(input);
    container.prepend(row);
    input.focus();

    const commit = () => {
        const raw = input.value.trim().replace(/^\/+|\/+$/g, '');
        if (raw) addFolderToTree(parentPath + raw + '/');
        row.remove();
    };
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') row.remove();
    });
    input.addEventListener('blur', () => setTimeout(() => { if (document.contains(row)) row.remove(); }, 200));
}

// Add a new virtual folder path into the sidebar tree and select it
function addFolderToTree(fullPath) {
    if (folderLocked) return;
    const parts = fullPath.split('/').filter(Boolean);
    let container = $('sidebarTree');
    let builtPath = '';

    for (let i = 0; i < parts.length; i++) {
        builtPath += parts[i] + '/';
        const existing = container.querySelector(`:scope > .sb-node[data-path="${CSS.escape(builtPath)}"]`);
        if (existing) {
            // node exists — open it and descend
            const ch = existing.querySelector('.sb-children');
            if (ch) {
                ch.style.display = 'block';
                const tog = existing.querySelector('.sb-toggle');
                if (tog) tog.classList.add('open');
                if (i < parts.length - 1) { container = ch; continue; }
            }
        } else {
            // create new node — mark as preloaded so expand won't fetch from R2
            const node = makeSbNode(builtPath, true);
            container.appendChild(node);
            const ch = node.querySelector('.sb-children');
            const tog = node.querySelector('.sb-toggle');
            if (ch && tog) { ch.style.display = 'block'; tog.classList.add('open'); }
            if (i < parts.length - 1) { container = ch || container; continue; }
        }
    }

    // Select the final path
    document.querySelectorAll('.sb-row.selected').forEach(r => r.classList.remove('selected'));
    const finalNode = $('sidebarTree').querySelector(`.sb-node[data-path="${CSS.escape(fullPath)}"]`);
    if (finalNode) finalNode.querySelector('.sb-row').classList.add('selected');
    selectFolder(fullPath);
}

// `initial`: the one call that sets a locked target (from ?folder=); nothing after
// it may change a locked target.
function selectFolder(path, { initial = false } = {}) {
    if (folderLocked && !initial) return;
    targetFolder = path.endsWith('/') ? path : path + '/';
    const display = $('targetDisplay');
    display.textContent = targetFolder;
    display.classList.remove('empty');
    $('targetHint').textContent = folderLocked ? '🔒 已鎖定' : '已選定';
    $('dropZone').classList.remove('no-target');
    if (!folderLocked) toast('📁 已選擇：' + targetFolder);
}

$('sidebarRefreshBtn').addEventListener('click', initSidebar);

// Root-level new folder
$('sidebarAddRootBtn').addEventListener('click', () => {
    if (folderLocked) return;
    const wrap = $('sidebarNewRoot');
    const input = $('sidebarNewRootInput');
    if (wrap.style.display !== 'block') {
        wrap.style.display = 'block';

});
$('sidebarNewRootInput').addEventListener('keydown', e => {

    if (e.key === 'Enter') {
        const raw = e.target.value.trim().replace(/^\/+|\/+$/g, '');
        if (raw) addFolderToTree(raw + '/');

    }
    if (e.key === 'Escape') { $('sidebarNewRoot').style.display = 'none'; }
});

// ── File / folder pickers ──
$('pickFilesBtn').addEventListener('click',  () => $('fileInput').click());
$('pickFolderBtn').addEventListener('click', () => $('folderInput').click());
$('fileInput').addEventListener('change',   e => addFiles(Array.from(e.target.files), ''));
$('folderInput').addEventListener('change', e => {
    addFiles(Array.from(e.target.files).map(f => ({ file: f, path: f.webkitRelativePath || f.name })));
    e.target.value = '';
});

// ── Drag & drop ──
const dz = $('dropZone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('drag-over'); });
dz.addEventListener('drop', async e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    if (!targetFolder) { toast(`請先從${sideWord()}選擇目標資料夾`); return; }
    const items = Array.from(e.dataTransfer.items).filter(i => i.kind === 'file');
    const entries = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null).filter(Boolean);
    if (!entries.length) { addFiles(Array.from(e.dataTransfer.files), ''); return; }
    const collected = [];
    for (const entry of entries) collected.push(...await traverseEntry(entry, ''));
    addFiles(collected);
});

async function traverseEntry(entry, prefix) {
    if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        return [{ file, path: prefix + entry.name }];
    }
    if (entry.isDirectory) {
        const reader = entry.createReader();
        const all = [];
        while (true) {
            const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
            if (!batch.length) break;
            all.push(...batch);
        }
        const results = await Promise.all(all.map(e => traverseEntry(e, prefix + entry.name + '/')));
        return results.flat();
    }
    return [];
}

// ── Add files to queue ──
function addFiles(input, prefix = '') {
    if (!targetFolder) { toast(`請先從${sideWord()}選擇目標資料夾`); return; }
    const items = Array.isArray(input) && input.length && input[0] instanceof File
        ? input.map(f => ({ file: f, path: (prefix || '') + f.name }))
        : input;
    const filtered = items.filter(({ file, path }) => IMAGE_EXTS.test(path || file.name));
    if (!filtered.length) { toast('沒有找到支援的圖片格式'); return; }
    for (const { file, path } of filtered) {
        const id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        queue.push({ id, file, path, state: 'pending', progress: 0, error: null, attempts: 0 });
    }
    renderQueue();
    $('overallWrap').classList.add('visible');
    $('queueSection').style.display = '';
    updateOverall();
    pump();
}

// ── Upload pump ──
function pump() {
    // offline: leave everything pending (nothing burns a retry); the `online` event pumps again
    if (!navigator.onLine) { updateOverall(); return; }
    const pending = queue.filter(q => q.state === 'pending');
    const slots = CONCURRENCY - activeCount;
    pending.slice(0, slots).forEach(startUpload);
}
window.addEventListener('offline', () => { updateQueueRows(); updateOverall(); });
window.addEventListener('online', () => { updateQueueRows(); updateOverall(); pump(); });

function whenOnline() {
    return navigator.onLine ? Promise.resolve() : new Promise(res => window.addEventListener('online', res, { once: true }));
}

async function startUpload(item) {
    if (!CONFIG.PHOTOGRAPHER_TOKEN) {
        item.state = 'error';
        item.error = '未登入，請重新整理頁面';
        updateItemEl(item);
        updateOverall();
        return;
    }
    item.state = 'uploading';
    activeCount++;
    updateItemEl(item);
    updateOverall();
    const key = targetFolder + item.path;
    try {
        // the same key is overwritten, so sending a photo again is always safe
        for (;;) {
            try {
                await uploadWithProgress(item, key);
                break;
            } catch (err) {
                if (!err.retryable) throw err;
                item.progress = 0;
                if (!navigator.onLine) {
                    // no connection is not the server's fault: wait for it without using up a retry
                    item.waiting = true;
                    updateItemEl(item); updateOverall();
                    await whenOnline();
                    item.waiting = false;
                    continue;
                }
                if (item.attempts >= RETRY_DELAYS.length) throw err;
                const delay = RETRY_DELAYS[item.attempts++];
                item.retrying = true;
                updateItemEl(item); updateOverall();
                await new Promise(res => setTimeout(res, delay));
                item.retrying = false;
            }
        }
        // the photo itself is safely stored either way — a thumbnail problem
        // only means browsing this one stays slow, so it is a warning
        item.thumbWarning = await uploadThumbnails(item, key);
        item.state = 'done';
        item.progress = 100;
    } catch (err) {
        item.state = 'error';
        item.error = err.message || '上傳失敗';
    }
    item.retrying = false;
    item.waiting = false;
    activeCount--;
    updateItemEl(item);
    updateOverall();
    pump();
}

// A failed row goes back to the queue as the SAME entry (same id, same key): never a second row.
// Its thumbnails are generated and uploaded again because startUpload runs the whole path.
function retryItem(item) {
    if (item.state !== 'error') return;
    item.state = 'pending';
    item.progress = 0;
    item.error = null;
    item.attempts = 0;
    item.thumbWarning = null;
    item.retrying = false;
    item.waiting = false;
    updateItemEl(item);
}
$('queueList').addEventListener('click', e => {
    const btn = e.target.closest('.qi-retry');
    if (!btn) return;
    const row = btn.closest('.queue-item');
    const item = row && queue.find(q => q.id === row.dataset.id);
    if (!item) return;
    retryItem(item);
    updateOverall();
    pump();
});
$('retryAllBtn').addEventListener('click', () => {
    queue.filter(q => q.state === 'error').forEach(retryItem);
    updateOverall();
    pump();
});

// ── Thumbnails ──
// Browsing used to download the full-resolution original for every 150px tile.
// We generate the small variants here, at upload time, and store them next to
// the original as _thumbs/<size>/<key>.thumb. Best-effort throughout: a format
// the browser cannot decode (HEIC, some TIFF) just yields nothing and the
// Worker falls back to serving the original.
let thumbChain = Promise.resolve();

function buildThumbnails(file) {
    // Serialise the decodes — four concurrent full-res bitmaps is a lot of RAM,
    // especially on a phone. The timeout matters: uploads await this, so a
    // decode that never settles would otherwise freeze the entire queue.
    const run = thumbChain.then(() => withTimeout(decodeAndDownscale(file), 30000));
    thumbChain = run.catch(() => {});
    return run;
}

function withTimeout(promise, ms) {
    let timer;
    return Promise.race([
        promise.finally(() => clearTimeout(timer)),
        new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error('thumbnail timed out')), ms);
        }),
    ]);
}

async function decodeAndDownscale(file) {
    if (typeof createImageBitmap !== 'function') return [];
    const bitmap = await createImageBitmap(file);
    let closed = false;
    const closeBitmap = () => { if (!closed) { closed = true; bitmap.close?.(); } };
    let src = bitmap, srcW = bitmap.width, srcH = bitmap.height;
    const out = [];
    try {
        for (const size of THUMB_SIZES) {
            const scale = Math.min(1, size / Math.max(srcW, srcH));
            const w = Math.max(1, Math.round(srcW * scale));
            const h = Math.max(1, Math.round(srcH * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(src, 0, 0, w, h);
            if (src === bitmap) closeBitmap();  // free the full-res decode ASAP
            const blob = await encodeThumb(canvas);
            if (blob) out.push({ size, blob });
            src = canvas; srcW = w; srcH = h;
        }
    } finally {
        closeBitmap();
    }
    return out;
}

// A browser that can't encode WebP silently hands back a PNG, which for a
// photo is larger than the JPEG original — exactly backwards. Check what we
// actually got and fall back to JPEG.
async function encodeThumb(canvas) {
    const webp = await new Promise(r => canvas.toBlob(r, 'image/webp', THUMB_QUALITY));
    if (webp && webp.type === 'image/webp') return webp;
    return new Promise(r => canvas.toBlob(r, 'image/jpeg', THUMB_QUALITY));
}

// Returns why thumbnails are missing, if they are. A silent best-effort is
// worse than useless here: browsing stays slow and nothing says why.
async function uploadThumbnails(item, key) {
    let thumbs = [];
    try {
        thumbs = await buildThumbnails(item.file);
    } catch (e) {
        return `無法讀取此格式（${e.name || 'error'}）`;
    }
    if (!thumbs.length) return '無法產生縮圖';

    // format-neutral suffix: the blob is WebP where supported and JPEG
    // otherwise, and the browser goes by the stored Content-Type either way
    const failures = await Promise.all(thumbs.map(async ({ size, blob }) => {
        try {
            const res = await fetch(
                `${CONFIG.WORKER_URL}/${encodeURIComponent(`_thumbs/${size}/${key}.thumb`)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': blob.type || 'image/jpeg',
                        'Authorization': `Bearer ${CONFIG.PHOTOGRAPHER_TOKEN}`
                    },
                    body: blob
                });
            return res.ok ? null : `HTTP ${res.status}`;
        } catch (e) {
            return e.message || '網路錯誤';
        }
    }));

    const bad = failures.filter(Boolean);
    return bad.length ? `縮圖上傳失敗（${bad[0]}）` : null;
}

// Why an upload failed, and whether trying again can help. `retryable` is true only for a dead
// connection, a timeout, HTTP 5xx and 429; auth, size and other client errors are the person's to fix.
function uploadError(message, retryable) {
    const e = new Error(message);
    e.retryable = retryable;
    return e;
}
function httpUploadError(status) {
    if (status === 401) return uploadError('未登入（HTTP 401），請重新整理頁面重新登入', false);
    if (status === 403) return uploadError('沒有權限（HTTP 403）', false);
    if (status === 413) return uploadError('檔案太大（HTTP 413）', false);
    if (status === 429 || status >= 500) return uploadError(`伺服器忙碌（HTTP ${status}）`, true);
    return uploadError(`HTTP ${status}`, false);
}

function uploadWithProgress(item, key) {
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', `${CONFIG.WORKER_URL}/${encodeURIComponent(key)}`);
        xhr.timeout = UPLOAD_TIMEOUT_MS;
        xhr.setRequestHeader('Content-Type', item.file.type || 'application/octet-stream');
        if (CONFIG.PHOTOGRAPHER_TOKEN) xhr.setRequestHeader('Authorization', `Bearer ${CONFIG.PHOTOGRAPHER_TOKEN}`);
        xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable) {
                item.progress = Math.round(e.loaded / e.total * 100);
                updateItemProgress(item);
                updateOverall();
            }
        });
        xhr.addEventListener('load', () => {
            if (xhr.status >= 200 && xhr.status < 300) return resolve();
            if (xhr.status === 401) {
                sessionStorage.removeItem('studio_token');
                CONFIG.PHOTOGRAPHER_TOKEN = '';
            }
            reject(httpUploadError(xhr.status));
        });
        xhr.addEventListener('error', () => reject(uploadError('網路錯誤', true)));
        xhr.addEventListener('abort', () => reject(uploadError('網路錯誤', true)));
        xhr.addEventListener('timeout', () => reject(uploadError('連線逾時', true)));
        xhr.send(item.file);
    });
}

// ── Tree builder ──
function buildTree(items) {
    const root = { children: {}, items: [] };
    for (const item of items) {
        const parts = item.path.split('/').filter(Boolean);
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
            const p = parts[i];
            if (!node.children[p]) node.children[p] = { name: p, children: {}, items: [] };
            node = node.children[p];
        }
        node.items.push(item);
    }
    return root;
}

function countAll(node) {
    let n = node.items.length;
    for (const c of Object.values(node.children)) n += countAll(c);
    return n;
}

function renderDirNode(node, container) {
    const subdirs = Object.values(node.children).sort((a, b) => a.name.localeCompare(b.name));
    for (const sub of subdirs) {
        const details = document.createElement('details');
        details.open = true;
        const total = countAll(sub);
        const summary = document.createElement('summary');
        summary.className = 'tree-dir-summary';
        summary.innerHTML =
            `<span class="tree-chevron">▶</span>` +
            `<span style="flex-shrink:0;margin-right:3px;">📁</span>` +
            `<span class="tree-dir-name">${escHtml(sub.name)}/</span>` +
            `<span class="tree-dir-meta">${total} 個</span>`;
        const children = document.createElement('div');
        children.className = 'tree-children';
        renderDirNode(sub, children);
        details.appendChild(summary);
        details.appendChild(children);
        container.appendChild(details);
    }
    for (const item of node.items) container.appendChild(makeItemEl(item));
}

// ── Render ──
function renderQueue() {
    const list = $('queueList');
    list.innerHTML = '';
    const tree = buildTree(queue);
    renderDirNode(tree, list);
    updateQueueTitle();
}

function makeItemEl(item) {
    const el = document.createElement('div');
    el.className = `queue-item ${item.state}`;
    el.dataset.id = item.id;
    const icon = { pending:'○', uploading:'↑', done:'✓', error:'✕' }[item.state] || '○';
    const statusText = itemStatusText(item);
    el.innerHTML =
        `<span class="qi-icon">${icon}</span>` +
        `<span class="qi-name" title="${escHtml(item.path)}">${escHtml(item.file.name)}</span>` +
        `<span class="qi-size">${fmtSize(item.file.size)}</span>` +
        `<span class="qi-status ${item.state}${item.thumbWarning ? ' warn' : ''}"${item.thumbWarning ? ` title="${escHtml(item.thumbWarning)}"` : ''}>${escHtml(statusText)}</span>` +
        (item.state === 'error' ? `<button type="button" class="btn-secondary qi-retry">重試</button>` : '') +
        `<div class="item-bar"><div class="item-bar-fill" style="width:${item.progress}%"></div></div>`;
    return el;
}

// a state change rebuilds the row (the retry button comes and goes with it); progress ticks use updateItemProgress
function updateItemEl(item) {
    const el = document.querySelector(`[data-id="${item.id}"]`);
    if (!el) return;
    el.replaceWith(makeItemEl(item));
}
function updateQueueRows() { queue.forEach(updateItemEl); }

function itemStatusText(item) {
    if (item.state === 'uploading') {
        if (item.waiting) return '離線，等待網路';
        if (item.retrying) return `重試中 ${item.attempts}/${RETRY_DELAYS.length}…`;
        return `${item.progress}%`;
    }
    if (item.state === 'error') return (item.error || '失敗') + (item.attempts ? ` · 已重試 ${item.attempts} 次` : '');
    if (item.state === 'pending') return navigator.onLine ? '待上傳' : '離線，等待網路';
    // uploaded, but this photo will still load at full size when browsing
    return item.thumbWarning ? '完成 · 無縮圖' : '完成';
}

function updateItemProgress(item) {
    const el = document.querySelector(`[data-id="${item.id}"]`);
    if (!el) return;
    const fill = el.querySelector('.item-bar-fill');
    if (fill) fill.style.width = item.progress + '%';
    const st = el.querySelector('.qi-status');
    if (st) st.textContent = item.progress + '%';
}

// xhr progress fires dozens of times a second per upload; coalesce the five
// full queue scans below into one repaint per frame
let overallPending = false;
function updateOverall() {
    if (overallPending) return;
    overallPending = true;
    requestAnimationFrame(() => { overallPending = false; renderOverall(); });
}

function renderOverall() {
    const total = queue.length;
    const done  = queue.filter(q => q.state === 'done').length;
    const errs  = queue.filter(q => q.state === 'error').length;
    const pct   = total ? Math.round((done + errs) / total * 100) : 0;
    const bar = $('overallBar');
    bar.style.width = pct + '%';
    bar.className = 'bar-fill' + (errs && done + errs === total ? ' has-error' : pct === 100 ? ' complete' : '');
    $('overallPct').textContent = pct + '%';
    const waiting = queue.some(q => q.state === 'pending' || q.state === 'uploading');
    $('overallLabel').textContent = !navigator.onLine && waiting
        ? `離線，恢復網路後自動重試（${done} / ${total} 完成）`
        : pct === 100 && !activeCount
        ? (errs ? `完成（${done} 成功 · ${errs} 失敗）` : `全部上傳完成（${done} 張）`)
        : `${done} / ${total} 完成${activeCount ? ` · 上傳中 ${activeCount}` : ''}`;
    $('retryAllBtn').hidden = errs === 0;
    updateQueueTitle();
}

function updateQueueTitle() {
    const total = queue.length, pending = queue.filter(q=>q.state==='pending').length, uploading = queue.filter(q=>q.state==='uploading').length;
    $('queueTitle').textContent = `佇列 ${total} 個${uploading ? ` · 上傳中 ${uploading}` : pending ? ` · 待上傳 ${pending}` : ''}`;
}

// ── Clear done ──
$('clearDoneBtn').addEventListener('click', () => {
    queue = queue.filter(q => q.state !== 'done');
    if (!queue.length) { $('queueSection').style.display = 'none'; }
    else renderQueue();
    updateQueueTitle();
    updateOverall();
});

// ── Pre-fill from URL ──
const params = new URLSearchParams(location.search);
const pre = params.get('folder');
if (pre && params.get('lock') === '1') {
    folderLocked = true;
    document.body.classList.add('folder-locked');
    $('targetBar').dataset.locked = '1';
}
if (pre) selectFolder(pre.endsWith('/') ? pre : pre + '/', { initial: true });
if (!targetFolder && isNarrow()) $('targetDisplay').textContent = '↑ 從上方點選資料夾';

// ── Back link: arriving from a project (?project=<id>), go back to it. Without one, back to the
// dashboard (the markup default): the picker page is an empty dead end on a phone.
const fromProject = params.get('project');
if (fromProject) {
    const back = document.querySelector('.header .btn-back');
    back.textContent = '← 返回專案';
    back.setAttribute('href', 'admin.html#project=' + encodeURIComponent(fromProject));
}

// ── Init sidebar after auth is ready ──
document.addEventListener('DOMContentLoaded', () => {
    // Wait a tick for auth.js to set the token
    // a locked target needs no folder tree, so it is not even read
    if (!folderLocked) setTimeout(initSidebar, 100);
});
</script>
</body>
</html>
