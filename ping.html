<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連線診斷</title>
<!-- Deliberately self-contained: no external stylesheet, font or script.
     If this page renders, the host and the path are fine and the fault is
     inside the app's own assets — which is exactly what it then tests. -->
<style>
  body { margin:0; padding:16px; background:#15120d; color:#e8e3da;
         font:14px/1.6 -apple-system,system-ui,sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; color:#e5a448; }
  p.sub { color:#8c8375; margin:0 0 16px; font-size:12px; }
  .row { display:flex; gap:8px; padding:7px 0; border-bottom:1px solid #2e2a22;
         align-items:baseline; font-size:13px; }
  .row .n { flex:1; word-break:break-all; font-family:ui-monospace,monospace; font-size:12px; }
  .ok { color:#4caf7d; } .bad { color:#e57373; } .wait { color:#8c8375; }
  pre { background:#221f18; border:1px solid #3a3528; border-radius:4px;
        padding:10px; white-space:pre-wrap; word-break:break-word;
        font:11px/1.5 ui-monospace,monospace; color:#8c8375; margin-top:16px; }
</style>
</head>
<body>
<h1>連線診斷</h1>
<p class="sub">這一頁本身不依賴任何外部檔案。請等全部跑完，然後截圖回報。</p>
<div id="rows"></div>

<h1 style="margin-top:28px;">照片大小實測</h1>
<p class="sub">輸入資料夾路徑，量測實際傳輸的位元組。<b>縮圖若有生效，w=400 應該只有幾十 KB</b>；
若跟原檔一樣大，代表 Worker 找不到縮圖、回退成原檔了。</p>
<div style="display:flex;gap:8px;margin-bottom:12px;">
  <input id="folder" placeholder="例如 20260819/合照/" value=""
         style="flex:1;min-width:0;background:#221f18;border:1px solid #3a3528;color:#e8e3da;
                padding:8px 10px;border-radius:4px;font:13px ui-monospace,monospace;">
  <button id="measureBtn"
          style="background:#e5a448;color:#15120d;border:none;padding:8px 18px;border-radius:4px;
                 font-weight:600;cursor:pointer;font-size:13px;">量測</button>
</div>
<div id="sizeRows"></div>

<pre id="env"></pre>

<script>
(function () {
  var rows = document.getElementById('rows');

  function addRow(name, target) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="n"></span><span class="s wait">檢查中…</span>';
    d.querySelector('.n').textContent = name;
    (target || rows).appendChild(d);
    return function (ok, note) {
      var s = d.querySelector('.s');
      s.className = 's ' + (ok ? 'ok' : 'bad');
      s.textContent = (ok ? '✓ ' : '✗ ') + note;
    };
  }

  // 1. can this page reach the app's own assets?
  var assets = [
    'index.html', 'css/styles.css', 'js/config.js', 'js/client-auth-check.js',
    'js/toast.js', 'js/logger.js', 'js/diagnostics.js', 'js/drive.js',
    'js/annotation.js', 'js/rating.js', 'js/app.js'
  ];
  assets.forEach(function (a) {
    var done = addRow(a);
    var t0 = Date.now();
    fetch(a + '?cachebust=' + t0, { cache: 'no-store' })
      .then(function (r) { done(r.ok, 'HTTP ' + r.status + ' · ' + (Date.now() - t0) + 'ms'); })
      .catch(function (e) { done(false, String(e.message || e)); });
  });

  // 2. third-party things index.html also pulls in
  var doneFont = addRow('fonts.googleapis.com');
  fetch('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap', { mode: 'no-cors' })
    .then(function () { doneFont(true, '可連線'); })
    .catch(function (e) { doneFont(false, String(e.message || e)); });

  var doneZip = addRow('cdnjs.cloudflare.com (JSZip)');
  fetch('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', { mode: 'no-cors' })
    .then(function () { doneZip(true, '可連線'); })
    .catch(function (e) { doneZip(false, String(e.message || e)); });

  // 3. the Worker that serves photos
  var doneWorker = addRow('Worker (imagepicker)');
  fetch('https://imagepicker.hotichen.workers.dev/api/auth/verify-admin')
    .then(function (r) { doneWorker(true, 'HTTP ' + r.status + '（401 也算正常）'); })
    .catch(function (e) { doneWorker(false, String(e.message || e)); });

  // 4. storage — blocked site data breaks login
  var doneStore = addRow('sessionStorage');
  try {
    sessionStorage.setItem('__ping', '1');
    sessionStorage.removeItem('__ping');
    doneStore(true, '可讀寫');
  } catch (e) {
    doneStore(false, (e.name || 'Error') + '：瀏覽器封鎖了網站資料');
  }

  // ── measure what a photo actually costs at each size ───────────────────
  var WORKER = 'https://imagepicker.hotichen.workers.dev';

  function fmt(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
    if (bytes >= 1024) return Math.round(bytes / 1024) + ' KB';
    return bytes + ' B';
  }

  function measureOne(key, query, label, target) {
    var done = addRow(label, target);
    var t0 = Date.now();
    // cache-bust so this measures the real transfer, not a local hit
    var sep = query ? '&' : '?';
    return fetch(WORKER + '/' + key + query + sep + 'nocache=' + t0)
      .then(function (r) { return r.blob().then(function (b) { return { r: r, b: b }; }); })
      .then(function (x) {
        done(x.r.ok, fmt(x.b.size) + ' · ' + (Date.now() - t0) + 'ms · ' + (x.b.type || '?'));
        return x.b.size;
      })
      .catch(function (e) { done(false, String(e.message || e)); return 0; });
  }

  // The listing only reports one level, so a folder holding nothing but
  // subfolders looks empty. Walk down until a photo turns up.
  function findPhoto(folder, depth) {
    return fetch(WORKER + '/?list=' + encodeURIComponent(folder))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var photos = (data && data.data) || [];
        if (photos.length) return { key: photos[0].id, folder: folder, count: photos.length };
        var subs = (data && data.folders) || [];
        if (!subs.length || depth >= 4) return null;
        return subs.reduce(function (chain, sub) {
          return chain.then(function (found) {
            return found || findPhoto(sub, depth + 1);
          });
        }, Promise.resolve(null));
      })
      .catch(function () { return null; });
  }

  document.getElementById('measureBtn').addEventListener('click', function () {
    var target = document.getElementById('sizeRows');
    target.innerHTML = '<div class="row"><span class="n">尋找照片中…</span></div>';
    var folder = document.getElementById('folder').value.trim();

    findPhoto(folder, 0)
      .then(function (found) {
        target.innerHTML = '';
        if (!found) {
          target.innerHTML = '<div class="row"><span class="n">' +
            '這個路徑底下找不到照片（已往下找 4 層）</span></div>';
          return;
        }
        var key = found.key;
        var head = document.createElement('div');
        head.style.cssText = 'color:#8c8375;font-size:12px;margin:6px 0;word-break:break-all;';
        head.textContent = '量測對象：' + key + '（' + found.folder + ' 共 ' + found.count + ' 張）';
        target.appendChild(head);

        var sizes = 0;
        measureOne(key, '?w=400', 'w=400（格子縮圖）', target)
          .then(function (s) { sizes = s; return measureOne(key, '?w=1200', 'w=1200（預覽）', target); })
          .then(function () { return measureOne(key, '?w=1600', 'w=1600（頁面畫布）', target); })
          .then(function () { return measureOne(key, '', '原檔（匯出用）', target); })
          .then(function (orig) {
            var verdict = document.createElement('div');
            verdict.style.cssText = 'margin-top:12px;padding:10px;border-radius:4px;font-size:13px;';
            if (!sizes || !orig) return;
            if (sizes >= orig * 0.9) {
              verdict.style.background = '#3a2020';
              verdict.style.color = '#e57373';
              verdict.textContent = '✗ w=400 跟原檔一樣大 — 這些照片沒有縮圖，Worker 回退成原檔了。';
            } else {
              verdict.style.background = '#1f2e24';
              verdict.style.color = '#4caf7d';
              verdict.textContent = '✓ 縮圖有生效 — w=400 只有原檔的 '
                + Math.round(sizes / orig * 100) + '%。若仍覺得慢，瓶頸在連線延遲而非檔案大小。';
            }
            target.appendChild(verdict);
          });
      })
      .catch(function (e) {
        target.innerHTML = '<div class="row"><span class="n">列出資料夾失敗：'
          + (e.message || e) + '</span></div>';
      });
  });

  document.getElementById('env').textContent =
    location.href + '\n\n' + navigator.userAgent +
    '\n\n螢幕 ' + screen.width + '×' + screen.height +
    ' · 視窗 ' + innerWidth + '×' + innerHeight +
    ' · DPR ' + (window.devicePixelRatio || 1);
})();
</script>
</body>
</html>
