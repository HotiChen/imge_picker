<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選圖工作室 — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15120d;
    --bg-soft: #1c1a14;
    --surface: #1d1a14;
    --card: #221f18;
    --card-hi: #2b271e;
    --accent: #e5a448;
    --accent-dim: rgba(229,164,72,.16);
    --ink-90: #e8e3da;
    --ink-70: rgba(232,227,218,.72);
    --ink-55: #8c8375;
    --rule: #2e2a22;
    --border: #3a3528;
    --danger: #e05c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink-90); font-family: 'IBM Plex Sans', sans-serif; font-size: 15px;
    line-height: 1.6; min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ── Top bar ─────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; max-width: 1100px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 28px; height: 28px; background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 15px; border-radius: 6px; flex-shrink: 0;
  }
  .brand .name { font-weight: 600; font-size: 16px; }
  .brand .label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em;
    color: var(--ink-55); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px;
  }
  #buildVersion { margin-left: 10px; }
  #photographerLoginBtn {
    background: transparent; border: 1px solid var(--border); color: var(--ink-70);
    padding: 8px 16px; border-radius: 5px; font-family: inherit; font-size: 13px;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  #photographerLoginBtn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Hero ────────────────────────────────────────────── */
  .hero {
    max-width: 1100px; margin: 0 auto; padding: 48px 28px 24px;
    display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center;
  }
  .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 18px; }
  .hero h1 span { color: var(--accent); }
  .pitch { font-size: 17px; color: var(--ink-70); margin-bottom: 28px; }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 6px;
    padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-accent { background: var(--accent); color: var(--bg); }
  .btn-accent:hover { opacity: .9; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink-90); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Phone mock (pure CSS/SVG, no external images) ──── */
  .phone-mock {
    justify-self: center; width: 220px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 26px; padding: 14px 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .phone-notch { width: 60px; height: 6px; background: var(--bg); border-radius: 4px; margin: 0 auto 10px; }
  .phone-header {
    display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px;
    border-bottom: 1px solid var(--rule); margin-bottom: 8px;
  }
  .phone-header .t { font-size: 10px; color: var(--ink-55); font-family: 'IBM Plex Mono', monospace; }
  .phone-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .phone-tile {
    aspect-ratio: 1; border-radius: 5px; position: relative; border: 1px solid var(--border);
    background: linear-gradient(135deg, var(--card-hi), var(--card));
  }
  .phone-tile.picked { border-color: var(--accent); }
  .phone-tile .heart {
    position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); color: var(--bg); font-size: 9px; display: flex;
    align-items: center; justify-content: center;
  }
  .phone-cta {
    margin-top: 10px; background: var(--accent); color: var(--bg); text-align: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; padding: 8px; border-radius: 5px;
  }

  /* ── Feature cards ───────────────────────────────────── */
  .features {
    max-width: 1100px; margin: 24px auto 56px; padding: 0 28px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .feature-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 22px 20px;
  }
  .feature-card .icon {
    width: 34px; height: 34px; color: var(--accent); margin-bottom: 14px;
  }
  .feature-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .feature-card p { font-size: 13px; color: var(--ink-55); line-height: 1.6; }

  footer {
    max-width: 1100px; margin: 0 auto; padding: 20px 28px 40px; color: var(--ink-55);
    font-size: 12px; text-align: center;
  }

  /* ── Login overlay ───────────────────────────────────── */
  .login-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,8,5,.7);
    align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .login-overlay.open { display: flex; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 36px 30px; width: 320px; max-width: 100%; text-align: center; position: relative;
  }
  .login-card .close-btn {
    position: absolute; top: 10px; right: 12px; background: none; border: none;
    color: var(--ink-55); font-size: 18px; cursor: pointer; line-height: 1;
  }
  .login-card .close-btn:hover { color: var(--ink-90); }
  .login-card .brand-mono {
    color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 0.15em; margin-bottom: 4px;
  }
  .login-card .subtitle { color: var(--ink-55); font-size: 12px; margin-bottom: 24px; }
  .field {
    background: var(--card); border: 1px solid var(--border); color: var(--ink-90);
    padding: 10px 12px; border-radius: 4px; font-size: 14px; font-family: inherit;
    outline: none; width: 100%; margin-bottom: 10px;
  }
  .field:focus { border-color: var(--accent); }
  .err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 16px; }

  @media (max-width: 780px) {
    .hero { grid-template-columns: 1fr; padding-top: 32px; text-align: center; }
    .hero-ctas { justify-content: center; }
    .phone-mock { margin-top: 8px; }
    .features { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .topbar { flex-direction: column; gap: 12px; align-items: flex-start; }
    .hero h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">選</span>
    <span class="name">選圖工作室</span>
    <span class="label mono">STUDIO</span>
    <span id="buildVersion"></span>
  </div>
  <button id="photographerLoginBtn" type="button">攝影師登入</button>
</div>

<section class="hero">
  <div>
    <h1>讓客人在手機上<br>輕鬆<span>選片</span>，<br>你專心修圖</h1>
    <p class="pitch">讓客人在手機上輕鬆選片，你專心修圖</p>
    <div class="hero-ctas">
      <button id="heroLoginBtn" class="btn btn-accent" type="button">攝影師登入</button>
      <a class="btn btn-ghost" href="#features">看看怎麼運作</a>
    </div>
  </div>
  <div class="phone-mock" aria-hidden="true">
    <div class="phone-notch"></div>
    <div class="phone-header">
      <span class="t">海邊系列</span>
      <span class="t">12/48</span>
    </div>
    <div class="phone-grid">
      <div class="phone-tile picked"><span class="heart">♥</span></div>
      <div class="phone-tile"></div>
      <div class="phone-tile"></div>
      <div class="phone-tile picked"><span class="heart">♥</span></div>
      <div class="phone-tile"></div>
      <div class="phone-tile picked"><span class="heart">♥</span></div>
    </div>
    <div class="phone-cta">送出選片</div>
  </div>
</section>

<section class="features" id="features">
  <div class="feature-card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="6" y="2" width="12" height="20" rx="2"/>
      <path d="M12 17.5a2 2 0 1 0 0-.01" fill="currentColor" stroke="none"/>
      <path d="M9.2 8.4c-1.4 1.6-1.2 3.6.5 5l2.3 1.9 2.3-1.9c1.7-1.4 1.9-3.4.5-5-1.1-1.2-2.8-1.1-3.8.2-1-1.3-2.7-1.4-3.8-.2z"/>
    </svg>
    <h3>手機選片 ♥</h3>
    <p>客人打開連結就能在手機上瀏覽、按愛心挑選，不用裝 App、不用註冊。</p>
  </div>
  <div class="feature-card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
    </svg>
    <h3>送出即通知</h3>
    <p>客人送出選片的那一刻，你就會收到通知，不必自己盯著後台等。</p>
  </div>
  <div class="feature-card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M4 20V10M12 20V4M20 20v-6"/>
    </svg>
    <h3>選片進度一目了然</h3>
    <p>每個專案現在是選片中、已送出還是精修中，儀表板一眼看完，不必逐一點開。</p>
  </div>
</section>

<footer>選圖工作室 · Studio</footer>

<!-- Login overlay — reuses the admin-token login already used on admin.html:
     verified against GET /api/admin/settings, token kept in
     sessionStorage.studio_token, never anywhere new. -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <button class="close-btn" id="loginCloseBtn" type="button" aria-label="關閉">×</button>
    <div class="brand-mono">STUDIO</div>
    <div class="subtitle">輸入攝影師密碼以繼續</div>
    <input id="loginTokenInput" type="password" placeholder="攝影師密碼" class="field">
    <button id="loginSubmitBtn" class="btn btn-accent" style="width:100%;justify-content:center;" type="button">進入管理後台</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<script src="js/build-version.js?v=20260928e"></script>
<script>
(function () {
  const WORKER_URL = 'https://imagepicker.hotichen.workers.dev';
  const TOKEN_KEY = 'studio_token';

  // Already signed in from an earlier visit — go straight to the dashboard.
  if (sessionStorage.getItem(TOKEN_KEY)) {
    window.location.href = 'dashboard.html';
    return;
  }

  const overlay = document.getElementById('loginOverlay');
  const input = document.getElementById('loginTokenInput');
  const errEl = document.getElementById('loginErr');
  const submitBtn = document.getElementById('loginSubmitBtn');

  function openOverlay() {
    errEl.textContent = '';
    input.value = '';
    overlay.classList.add('open');
    input.focus();
  }
  function closeOverlay() { overlay.classList.remove('open'); }

  document.getElementById('photographerLoginBtn').addEventListener('click', openOverlay);
  document.getElementById('heroLoginBtn').addEventListener('click', openOverlay);
  document.getElementById('loginCloseBtn').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

  async function tryLogin() {
    const token = input.value.trim();
    if (!token) { errEl.textContent = '請輸入密碼'; return; }
    errEl.textContent = '';
    submitBtn.disabled = true;
    try {
      const r = await fetch(`${WORKER_URL}/api/admin/settings`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (r.status === 401) { errEl.textContent = '密碼錯誤'; return; }
      if (!r.ok) { errEl.textContent = `錯誤 ${r.status}`; return; }
      sessionStorage.setItem(TOKEN_KEY, token);
      window.location.href = 'dashboard.html';
    } catch (e) {
      errEl.textContent = '無法連線到 Worker';
    } finally {
      submitBtn.disabled = false;
    }
  }

  submitBtn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
})();
</script>
</body>
</html>
